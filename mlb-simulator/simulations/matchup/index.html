    <!--
      MLB_SIM_HISTORY_20260803 - matchup aggregate shell.

      This one file backs every /mlb-simulator/simulations/YYYY-MM-DD/<away>-vs-<home>/
      URL. The tmr-sim-history Cloudflare Worker serves it for those paths and
      rewrites the <title>, description, canonical and robots tags in place from
      /api/mlb-sim-history/meta before a crawler sees them - so there are never
      thousands of baked, thin, near-empty matchup files in the repo, and a page
      with too little content is marked noindex rather than published as filler.

      The defaults below are deliberately conservative: if the Worker is ever
      bypassed, this page is noindex and canonicalises to the parent index.
    -->
