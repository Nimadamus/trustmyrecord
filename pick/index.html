<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="description" content="A pick locked before game time and graded from the final result on TrustMyRecord.">
<!-- SHARE_SYSTEM_PHASE1_20260721
     Bare /pick/ still means "go make a pick" and still lands on /sportsbook/,
     canonical included - that route is unchanged. What is new is /pick/?id=<n>,
     the permanent public URL for one locked pick.

     Head tags below are DEFAULTS. For a shared /pick/?id=<n> link the
     Cloudflare Worker rewrites title/description/canonical/og:*/twitter:* in
     place from /api/share/meta/pick/<n> before a crawler sees this document.
     If the Worker is bypassed or fails, the origin still returns 200 and the
     pick renders client-side. This page is never a redirect for a real pick id
     and is never noindexed. -->
<meta property="og:type" content="article">
<meta property="og:site_name" content="TrustMyRecord">
<meta property="og:title" content="Verified Pick | TrustMyRecord">
<meta property="og:description" content="A pick locked before game time and graded from the final result on TrustMyRecord.">
<meta property="og:url" content="https://trustmyrecord.com/pick/">
<meta property="og:image" content="https://trustmyrecord.com/static/og/og-home.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<style>
.pk-wrap{max-width:760px;margin:0 auto;padding:26px 18px 70px;color:#07182A;font-family:'Inter',system-ui,sans-serif;}
.pk-card{border:1px solid #D2DEEA;border-radius:18px;background:linear-gradient(180deg,rgba(7,24,42,0.02),rgba(7,24,42,0.02)),#0E1620;padding:22px;}
.pk-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.pk-av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(11, 79, 168,.28);background:#1E5BBF;flex:none;}
.pk-who{font-weight:800;font-size:1rem;}
.pk-who a{color:#07182A;text-decoration:none;}
.pk-who a:hover{color:#0B4FA8;}
.pk-sub{color:#2E4459;font-size:.8rem;}
.pk-spacer{flex:1;}
.pk-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pk-pill{padding:6px 13px;border-radius:999px;font-size:.74rem;font-weight:800;letter-spacing:.06em;border:1px solid #D2DEEA;background:rgba(7,24,42,0.02);color:#07182A;}
.pk-pill.is-won{color:#0A8B4E;border-color:rgba(10,139,78,.28);background:rgba(10,139,78,0.12);}
.pk-pill.is-lost{color:#BC372E;border-color:rgba(188,55,46,.28);background:rgba(188,55,46,0.12);}
.pk-pill.is-pending{color:#8A6206;border-color:rgba(185,133,5,.30);background:rgba(185,133,5,0.1);}
.pk-matchup{color:#2E4459;font-size:1rem;margin:0 0 6px;}
.pk-sel{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:2.1rem;line-height:1.1;margin:0 0 18px;}
.pk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.pk-stat{border:1px solid #D2DEEA;border-radius:12px;background:rgba(7,24,42,0.02);padding:12px 13px;}
.pk-stat span{display:block;color:#1B4F9E;font-size:.66rem;letter-spacing:.1em;font-weight:700;text-transform:uppercase;}
.pk-stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:700;margin-top:3px;}
.pk-pos{color:#0A8B4E;}.pk-neg{color:#BC372E;}
.pk-note{margin-top:18px;padding-top:16px;border-top:1px solid #D2DEEA;color:#2E4459;font-size:.83rem;line-height:1.55;}
.pk-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.pk-link{display:inline-flex;align-items:center;padding:8px 14px;border-radius:999px;border:1px solid #D2DEEA;background:rgba(7,24,42,0.02);color:#07182A;font-size:.86rem;font-weight:600;text-decoration:none;}
.pk-link:hover{border-color:rgba(11, 79, 168,.28);color:#07182A;}
.pk-cta{margin-top:20px;border:1px solid rgba(11, 79, 168,.28);border-radius:16px;background:rgba(11, 79, 168,0.08);padding:18px 20px;}
.pk-cta h2{margin:0 0 6px;font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;}
.pk-cta p{margin:0 0 12px;color:#2E4459;font-size:.9rem;line-height:1.55;}
.pk-cta a{display:inline-block;background:#DEF4F2;color:#062018;font-weight:800;padding:11px 20px;border-radius:11px;text-decoration:none;}
.pk-msg{padding:26px 22px;text-align:center;color:#2E4459;}
.pk-msg a{color:#0B4FA8;}
@media(max-width:620px){.pk-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.pk-sel{font-size:1.7rem;}}
/* PK_CONTRAST_20261114: the card is dark, but its name, values, pills and links still used the dark ink of the light theme and could not be read */
.pk-card{color:#E8F1FF}
.pk-card .pk-who a{color:#F2F7FF}.pk-card .pk-who a:hover{color:#9CC4FF}
.pk-card .pk-sub,.pk-card .pk-matchup,.pk-card .pk-note{color:#B4C5D8}
.pk-card .pk-note{border-top-color:#2B3F55}
.pk-card .pk-pill{color:#E8F1FF;border-color:#33485F}
.pk-card .pk-pill.is-won{color:#4ADE80}.pk-card .pk-pill.is-lost{color:#FF8A80}.pk-card .pk-pill.is-pending{color:#F5C451}
.pk-card .pk-stat{border-color:#33485F}.pk-card .pk-stat span{color:#8FB8F5}.pk-card .pk-stat b{color:#F2F7FF}
.pk-card .pk-stat b.pk-pos{color:#4ADE80}.pk-card .pk-stat b.pk-neg{color:#FF8A80}
.pk-card .pk-link{color:#E8F1FF;border-color:#33485F}.pk-card .pk-link:hover{color:#fff;border-color:#6FA8F5}
/* VERIFIED_RECEIPT_20261114 */
.pk-rc{margin:20px 0 4px;padding:16px 18px;border:1px solid #33485F;border-radius:14px;background:rgba(255,255,255,.03);text-align:left}
.pk-rc.is-verified{border-color:#1F9D57;background:rgba(31,157,87,.10)}
.pk-card .pk-rc-h{margin:0 0 6px;font-family:'Inter',system-ui,sans-serif;font-style:normal;font-size:1.05rem;font-weight:800;letter-spacing:0;text-transform:none;color:#F2F7FF;-webkit-text-fill-color:#F2F7FF;background:none;text-shadow:none}
.pk-rc-tick{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#1F9D57;color:#fff;-webkit-text-fill-color:#fff;font-size:.8rem;vertical-align:-3px;margin-right:4px}
.pk-rc-p{margin:0 0 10px;color:#B4C5D8;font-size:.9rem;line-height:1.45}
.pk-rc-grid{display:grid;grid-template-columns:1fr}
.pk-rc-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid #2B3F55;font-size:.93rem}
.pk-rc-row span{color:#9FB3C8;flex:none}.pk-rc-row b{color:#F2F7FF;text-align:right;overflow-wrap:anywhere}
.pk-rc-fp{margin:10px 0 0;padding-top:10px;border-top:1px solid #2B3F55;font-size:.8rem;color:#9FB3C8}.pk-rc-fp span{display:block;margin-bottom:4px}
.pk-rc-fp code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;color:#CFE2FF;background:none;overflow-wrap:anywhere;word-break:break-all}
</style>

<body class="tmr-ds-shell tmr-dark tmr-aplus" data-aplus="picks">
<main class="pk-wrap">
  <div id="pkRoot" class="pk-card"><div class="pk-msg">Loading pick…</div></div>
</main>
<noscript><p style="text-align:center;color:#2E4459;font-family:Inter,sans-serif;">This pick needs JavaScript to load. <a style="color:#0B4FA8" href="/handicappers/">Browse verified members</a>.</p></noscript>
<script>
(function () {
  'use strict';
  var API = (window.CONFIG && CONFIG.api && CONFIG.api.baseUrl) || 'https://api.trustmyrecord.com/api';
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || params.get('pick') || '').trim();

  if (!/^\d+$/.test(id)) {
    location.replace('/sportsbook/' + location.hash);
    return;
  }

  var root = document.getElementById('pkRoot');
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function signed(n, d) { var v = Number(n); return isFinite(v) ? (v > 0 ? '+' : '') + v.toFixed(d == null ? 2 : d) : null; }

  var shareUrl = 'https://trustmyrecord.com/pick/?id=' + id;
  var canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.href = shareUrl;
  var ogUrl = document.querySelector('meta[property="og:url"]');
  if (ogUrl) ogUrl.setAttribute('content', shareUrl);

  var STATUS = { won: 'WON', lost: 'LOST', push: 'PUSH', void: 'VOID', cancelled: 'VOID', pending: 'PENDING' };

  function ctaHtml() {
    return '<section class="pk-cta">' +
      '<h2>Track your own record</h2>' +
      '<p>Every pick on TrustMyRecord is locked before game time and graded from the final result. No edits, no deletions, no screenshots.</p>' +
      '<a href="/signup/?utm_source=shared_pick&amp;utm_medium=cta&amp;utm_campaign=tmr_share">Create a free account</a>' +
      '</section>';
  }

  Promise.all([
    fetch(API + '/picks/' + id).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
    fetch(API + '/share/meta/pick/' + id).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    var pick = res[0] && res[0].pick;
    var meta = res[1];

    if (!pick && !meta) {
      root.innerHTML = '<div class="pk-msg">This pick is not available.<br><br><a href="/handicappers/">Browse verified members</a></div>';
      return;
    }

    if (meta && meta.title) {
      document.title = meta.title;
      var d = document.querySelector('meta[name="description"]');
      if (d) d.setAttribute('content', meta.description || '');
    }

    // Another member's PENDING pick stays sealed: /api/picks/:id withholds it
    // until it is graded, and this page reports that honestly instead of
    // guessing at the selection.
    if (!pick) {
      root.innerHTML = '<div class="pk-msg">' + esc((meta && meta.description) || 'This pick is sealed until it is graded.') + '</div>';
      root.insertAdjacentHTML('afterend', ctaHtml());
      return;
    }

    var status = String(pick.status || 'pending').toLowerCase();
    var graded = status !== 'pending';
    var who = pick.display_name || pick.username;
    var league = (window.TMR && TMR.formatLeagueLabel) ? TMR.formatLeagueLabel(pick.sport_key) : String(pick.sport_key || '').toUpperCase();
    var label = (window.TMR && TMR.formatPickDisplayLabel) ? TMR.formatPickDisplayLabel(pick) : (pick.selection || 'Pick');
    var matchup = (pick.away_team && pick.home_team) ? (pick.away_team + ' @ ' + pick.home_team + (window.TMR && window.TMR.dhSuffix ? window.TMR.dhSuffix(pick) : '')) : '';
    var odds = Number(pick.odds_snapshot);
    var units = Number(pick.units);
    var ru = pick.result_units == null ? null : Number(pick.result_units);

    var stats = '';
    if (isFinite(odds) && odds !== 0) stats += '<div class="pk-stat"><span>Odds</span><b>' + (odds > 0 ? '+' : '') + Math.round(odds) + '</b></div>';
    if (isFinite(units) && units > 0) stats += '<div class="pk-stat"><span>Units risked</span><b>' + units + '</b></div>';
    if (graded && ru != null) stats += '<div class="pk-stat"><span>Result</span><b class="' + (ru > 0 ? 'pk-pos' : (ru < 0 ? 'pk-neg' : '')) + '">' + signed(ru) + 'u</b></div>';
    var when = pick.locked_at ? new Date(pick.locked_at) : null;
    if (when) {
      stats += '<div class="pk-stat"><span>Locked</span><b style="font-size:1.05rem">' +
        when.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</b></div>';
    }

    root.innerHTML =
      '<div class="pk-top">' +
        '<img class="pk-av" alt="" src="' + esc(API + '/users/' + encodeURIComponent(pick.username) + '/avatar') + '" onerror="this.style.visibility=\'hidden\'">' +
        '<div><div class="pk-who"><a href="/u/' + encodeURIComponent(pick.username) + '/">' + esc(who) + '</a></div>' +
        '<div class="pk-sub">Verified record on TrustMyRecord</div></div>' +
        '<div class="pk-spacer"></div>' +
        (window.TMRShare ? TMRShare.buttonHtml({ type: 'pick', id: id, url: shareUrl, label: 'Share', tooltip: 'Share this pick', ariaLabel: 'Share this pick' }) : '') +
      '</div>' +
      '<div class="pk-pills">' +
        '<span class="pk-pill is-' + esc(status) + '">' + esc(STATUS[status] || status.toUpperCase()) + '</span>' +
        '<span class="pk-pill">' + esc(league) + '</span>' +
      '</div>' +
      (matchup ? '<p class="pk-matchup">' + esc(matchup) + '</p>' : '') +
      '<h1 class="pk-sel">' + esc(graded ? label : (pick.selection ? label : 'Pick locked — sealed until graded')) + '</h1>' +
      '<div class="pk-grid">' + stats + '</div>' +
      '<p class="pk-note">' + (graded
        ? 'This pick was locked before game time and graded from the final result. Locked picks cannot be edited or deleted on TrustMyRecord.'
        : 'This pick is locked and time-stamped. It has not been graded yet — the result appears here once the game is final.') +
      '</p>' +
      '<div class="pk-actions">' +
        '<a class="pk-link" href="/u/' + encodeURIComponent(pick.username) + '/">' + esc(who) + '’s full record</a>' +
        '<a class="pk-link" href="/leaderboards/">Leaderboard</a>' +
      '</div>';

    root.insertAdjacentHTML('afterend', ctaHtml());

    // VERIFIED_RECEIPT_20261114: the proof behind this pick, from the server
    // (GET /api/share/receipt/pick/<id>). The page is unchanged when the
    // receipt is not available.
    fetch(API + '/share/receipt/pick/' + id).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }).then(function (rc) {
      if (!rc || !rc.ok) return;
      var fmt = function (iso) { return iso ? new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }) : ''; };
      var lead = function (s) {
        if (s == null || s <= 0) return '';
        var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
        return (d ? d + 'd ' : '') + (h ? h + 'h ' : '') + m + 'm before the start';
      };
      var rows = '';
      var row = function (k, v) { if (v) rows += '<div class="pk-rc-row"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; };
      row('Locked', fmt(rc.locked_at));
      row('Game start', fmt(rc.game_start));
      row('Lead time', lead(rc.locked_before_start_seconds));
      row('Graded', fmt(rc.graded_at));
      if (rc.final_score) row('Final score', rc.final_score.away_team + ' ' + rc.final_score.away + ', ' + rc.final_score.home_team + ' ' + rc.final_score.home);
      var head = rc.verified ? 'Verified receipt' : (rc.graded ? 'Pick receipt' : 'Locked pick receipt');
      var block =
        '<section class="pk-rc' + (rc.verified ? ' is-verified' : '') + '" id="pkReceipt" aria-label="' + head + '">' +
          '<h2 class="pk-rc-h">' + (rc.verified ? '<span class="pk-rc-tick" aria-hidden="true">&#10003;</span> ' : '') + head + '</h2>' +
          (rc.pregame_text ? '<p class="pk-rc-p">' + esc(rc.pregame_text) + '</p>' : '') +
          '<div class="pk-rc-grid">' + rows + '</div>' +
          (rc.fingerprint ? '<p class="pk-rc-fp"><span>Ledger fingerprint</span><code>' + esc(rc.fingerprint) + '</code></p>' : '') +
        '</section>';
      var actions = root.querySelector('.pk-actions');
      if (actions) actions.insertAdjacentHTML('beforebegin', block); else root.insertAdjacentHTML('beforeend', block);
    });
  });
}());
</script>
