name: TrustMyRecord Regression Lock

on:
  pull_request:
  push:
    branches:
      - main
    # RUN_VOLUME_20260904. These checks run against the LIVE site
    # (TMR_REGRESSION_BASE_URL defaults to https://trustmyrecord.com), so a push
    # that cannot change the site's behaviour cannot change their answer.
    # Prerendered profile pages, sitemaps, the feed and prose are published by
    # bots several times an hour; re-running a 20-minute browser suite for each
    # one produced an identical verdict and an identical email. Every path that
    # CAN move behaviour still triggers the full suite, and the nightly schedule
    # below keeps the live-site signal on a day of content-only pushes.
    paths-ignore:
      - 'u/**'
      - 'sitemap*.xml'
      - 'news-sitemap.xml'
      - 'feed.xml'
      - 'robots.txt'
      - '**/*.md'
      - 'artifacts/**'
      - 'docs/**'
  schedule:
    # 13:10 UTC daily: proves the live site against the same locks on days when
    # nothing but content shipped.
    - cron: '10 13 * * *'
  workflow_dispatch:

# One run per ref. A burst of commits used to start a full live browser suite
# each, all asking the same question of the same production site and all
# emailing the same answer. Supersede rather than pile up.
concurrency:
  group: regression-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # SEO_20260809 — offline indexability guard. Runs before the browser suite
      # because it is fast and catches the class of regression that used to reach
      # Search Console instead of CI: sitemap URLs that 404, an accidental
      # noindex, a redirect stub leaking into the sitemap, a /u/ profile that
      # stops baking its record (soft 404), or an internal link to a dead URL.
      - run: npm run test:seo
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-lock-artifacts
          path: |
            artifacts/regression-report.json
            artifacts/regression-playwright-results/**
            artifacts/playwright-results/**
