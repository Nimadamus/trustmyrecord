name: Sport Handicapping Hubs

# Refreshes /handicapping/<sport>/ and the evergreen matchup pages under them
# for every sport in scripts/build_sport_matchup_pages.py.
#
# WHY IT EXISTS. Until 2026-09-08 nothing ran that script. NFL, NBA and NHL were
# baked by hand and the two hubs added that day (NCAAF and Soccer) are pure board
# pages: a fixture list and its markets. A board page that is not rebuilt is a
# page showing yesterday's games, which is worse than an empty one, so a sport in
# the Handicapping Hub menu has to have something keeping it current.
#
# CADENCE. Four times a day, on the :40, deliberately clear of everything else
# that commits to main: the prerender cron runs at :00 and :30 and the MLB bake
# at :10, and two jobs pushing in the same minute is a race, not redundancy.
#   10:40 UTC  the European soccer card is priced, before the early kickoffs
#   14:40 UTC  the US afternoon board is up, NCAAF Saturday early window
#   18:40 UTC  evening soccer and the NCAAF afternoon window
#   22:40 UTC  the NCAAF night games and the next day's soccer card
#
# THE KEY MATTERS. build_sport_matchup_pages.py refuses to rebuild NFL, NBA or
# NHL without BETLEGEND_PRO_SERVICE_KEY, because their matchup pages carry head
# to head records, ATS splits and form from the BetLegend Pro engine and a keyless
# run would rewrite every one of them with that content gone. Until the secret is
# set on this repo the job still runs and still refreshes NCAAF and Soccer, which
# never call the engine, and says in its log which sports it skipped.
#
# Commits made with GITHUB_TOKEN do not trigger `on: push`, so this cannot loop.
# It commits only when the bake actually changed something.

on:
  schedule:
    - cron: '40 10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      sports:
        description: 'Space separated sports to bake (nfl nba nhl ncaaf soccer). Blank = all.'
        required: false

permissions:
  contents: write

concurrency:
  group: sport-handicapping-hubs
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bake the sport hubs and their matchup pages
        env:
          BETLEGEND_PRO_SERVICE_KEY: ${{ secrets.BETLEGEND_PRO_SERVICE_KEY }}
        run: python scripts/build_sport_matchup_pages.py ${{ inputs.sports }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # THE GATE, before the commit step and never after: a gate that runs after
      # the push is decorative. If it fails the bake is discarded and the last
      # good pages stay live.
      - name: Gate - site-wide SEO indexability
        run: node tests/seo-indexability-regression-test.js

      - name: Commit only if the bake changed something
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sport hubs already match the current board."
          else
            git config user.name "tmr-sport-hubs-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(handicapping): refresh sport hubs from the board [skip ci]"
            git push origin HEAD:main
            git show --stat --oneline HEAD
          fi
