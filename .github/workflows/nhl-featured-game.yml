name: NHL Featured Game

# NHL_FEATURED_GAME_20260929. The NHL Featured Game of the Day, end to end, in
# the cloud. Nothing here needs a laptop, a browser or a Claude terminal.
#
# Every 30 minutes, around the clock, scripts/nhl_featured_game.py:
#   reads the league schedule and standings (api-web.nhle.com), league team
#   stats (api.nhle.com), both clubs' results, the
#   TMR sportsbook board, Daily Faceoff's starting goalie reports, ESPN's
#   injury report and the TMR NHL simulator; selects the day's featured game
#   once (sticky; a postponement reselects); writes /nhl/<slug>/, the archive
#   /nhl/featured-games/, the homepage module, the sitemap block and
#   data/nhl-featured/*.json. featured_matchups.py sync then registers the page
#   and bakes the NHL door, the NHL hub card and the Featured Matchups menu.
#
# WHY A LOOP AND NOT A 30 MINUTE CRON. GitHub drops scheduled runs on this repo
# under load: on 2026-09-29 the '*/30' prerender cron actually fired at 15:28,
# 20:10 and 23:53 UTC, hours apart. A goalie confirmation or a line move cannot
# wait four hours. So one run works for up to five and a half hours, refreshing
# on every :20 and :50, then dispatches its own successor (workflow_dispatch is
# the one event GITHUB_TOKEN may start). The cron below is only the safety net
# that restarts the chain if a successor ever fails to start; the concurrency
# group means a cron start that lands mid chain just waits and then carries on
# as the next link, so there is never more than one chain.
#
# PUSH. Each refresh resets onto the current main and runs the generator again
# rather than hand merging generated files, then pushes. Three tries.
#
# IDEMPOTENT. A file is only rewritten when its data changed, so a quiet
# refresh commits nothing.
#
# ALERTS. A failed refresh opens (or comments on) one GitHub issue labelled
# nhl-featured-alert, which emails the repo owner; the next good refresh closes
# it. The run itself is marked failed if any refresh in it failed.

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nhl-featured-game
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Pillow turns player headshots and club marks into small self hosted
      # WebP files and draws each game's share card. Without it the page
      # falls back to the source image URLs and the site default card.
      - name: Image tools
        run: python -m pip install --quiet --disable-pip-version-check pillow

      - name: Refresh every 30 minutes for five and a half hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git config user.name "tmr-nhl-featured-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          END=$(( $(date +%s) + 330*60 ))
          FAILED=0

          alert() {
            gh label create nhl-featured-alert --color B60205 --description "NHL Featured Game pipeline failure" >/dev/null 2>&1 || true
            N=$(gh issue list --label nhl-featured-alert --state open --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$N" ]; then
              gh issue comment "$N" --body "Refresh failed at $(TZ=America/Los_Angeles date '+%b %d %I:%M %p PT'): $1. Run: $RUN_URL" || true
            else
              gh issue create --label nhl-featured-alert --title "NHL Featured Game pipeline is failing" \
                --body "A refresh failed at $(TZ=America/Los_Angeles date '+%b %d %I:%M %p PT'): $1. Run: $RUN_URL. The last good page stays live. This issue closes itself after the next good refresh." || true
            fi
          }
          recovered() {
            for N in $(gh issue list --label nhl-featured-alert --state open --json number --jq '.[].number' 2>/dev/null); do
              gh issue close "$N" --comment "Recovered at $(TZ=America/Los_Angeles date '+%b %d %I:%M %p PT'): $RUN_URL" || true
            done
          }
          refresh() {
            for attempt in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main || return 1
              python scripts/nhl_featured_game.py run > nhl_run.log 2>&1 || { tail -30 nhl_run.log; return 1; }
              grep -E '"(notes|written)"' -A6 nhl_run.log | head -20
              python scripts/featured_matchups.py sync > sync.log 2>&1 || { tail -20 sync.log; return 1; }
              # THE GATE runs before the commit: a failing gate publishes nothing.
              node tests/seo-indexability-regression-test.js > gate.log 2>&1 || { tail -40 gate.log; return 1; }
              git add -A nhl data/nhl-featured static/img/nhl-featured static/og/nhl-featured matchup-of-the-day/nhl data/featured-matchups.json index.html sitemap.xml handicapping/nhl/index.html static/js/tmr-ds-nav.js static/js/tmr-sitewide.js
              git add -u
              if git diff --cached --quiet; then
                echo "NHL featured game already current."
                return 0
              fi
              git commit -q -m "chore(nhl-featured): refresh the NHL Featured Game of the Day [skip ci]"
              if git push -q origin HEAD:main; then
                git show --stat --oneline HEAD | head -20
                return 0
              fi
              echo "main moved during the refresh; rebuilding on top of it (attempt $attempt)"
            done
            return 1
          }

          while :; do
            echo "=== refresh at $(TZ=America/Los_Angeles date '+%Y-%m-%d %I:%M %p PT')"
            if refresh; then recovered; else FAILED=1; alert "see the log for this refresh"; fi
            # Sleep to the next :20 or :50, and stop when the next one would
            # land past this run's budget.
            NOW=$(date +%s); M=$(( 10#$(date -u +%M) )); S=$(( 10#$(date -u +%S) ))
            if [ $M -lt 20 ]; then W=$(( (20-M)*60 - S )); elif [ $M -lt 50 ]; then W=$(( (50-M)*60 - S )); else W=$(( (80-M)*60 - S )); fi
            [ $(( NOW + W )) -gt $END ] && break
            sleep $W
          done

          # Hand over to the next link of the chain.
          gh workflow run nhl-featured-game.yml --ref main || { alert "could not dispatch the next run"; FAILED=1; }
          exit $FAILED
