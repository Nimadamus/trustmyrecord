name: Simulator Data Health

# SIM_DATA_HEALTH_20261001. Watches the simulators' roster and personnel data
# (GET /api/roster/status on the TMR API: NBA, NHL, MLB, NFL). The API refreshes
# NBA and NHL rosters itself every 6 hours and keeps the previous snapshot when
# a refresh fails validation, so a failure is silent on the site by design.
# This makes it loud: if any sport is not "current", its refresh is failing, or
# the endpoint does not answer, one issue per sport (label sim-data-alert-<sport>) is opened
# (or commented on), which emails the repo owner. The next healthy check closes it.
# Read only: it never changes anything on the site or the API.

on:
  schedule:
    - cron: '45 */3 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: sim-data-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check roster freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WHEN=$(TZ=America/Los_Angeles date '+%b %d %I:%M %p PT')
          BODY=""
          for i in 1 2 3; do
            BODY=$(curl -fsS -m 90 https://api.trustmyrecord.com/api/roster/status) && break
            sleep 30
          done
          printf '%s' "$BODY" > status.json
          cat > check.py <<'PY'
          import json, sys
          try:
              d = json.load(open("status.json"))
          except Exception:
              print("roster status endpoint did not answer with JSON")
              sys.exit()
          out = []
          sports = d.get("sports") or {}
          for k in ("nba", "nhl", "mlb", "nfl"):
              s = sports.get(k)
              if not s:
                  out.append(k.upper() + " missing from roster status")
                  continue
              if s.get("freshness") != "current":
                  out.append("%s data is %s (%sh old)" % (k.upper(), s.get("freshness"), s.get("data_age_hours")))
              if (s.get("consecutive_failures") or 0) > 0:
                  out.append("%s refresh failed %sx: %s" % (k.upper(), s.get("consecutive_failures"), s.get("last_error")))
          print("\n".join(out))
          PY
          python3 check.py > problems.txt
          # SIM_HEALTH_PER_SPORT_20261105: one issue per sport, so a red sport cannot hide
          # a new fault in another. A line with no sport prefix belongs to all of them.
          STATUS=0
          for S in NBA NHL MLB NFL; do
            P=$(grep -E "^($S |roster status)" problems.txt | tr '\n' ';' || true)
            L="sim-data-alert-$(echo "$S" | tr 'A-Z' 'a-z')"
            if [ -n "$P" ]; then
              echo "UNHEALTHY $S: $P"; STATUS=1
              gh label create "$L" --color B60205 --description "$S simulator data freshness problem" >/dev/null 2>&1 || true
              N=$(gh issue list --label "$L" --state open --json number --jq '.[0].number' 2>/dev/null)
              if [ -n "$N" ]; then gh issue comment "$N" --body "$WHEN: $P Run: $RUN_URL" || true
              else gh issue create --label "$L" --title "$S simulator data is stale or failing to refresh" --body "$WHEN: $P Run: $RUN_URL" || true; fi
            else
              echo "healthy $S"
              for N in $(gh issue list --label "$L" --state open --json number --jq '.[].number' 2>/dev/null); do
                gh issue close "$N" --comment "Healthy again at $WHEN: $RUN_URL" || true
              done
            fi
          done
          # The old shared issue closes on the first run of this version.
          for N in $(gh issue list --label sim-data-alert --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$N" --comment "Replaced by one issue per sport at $WHEN: $RUN_URL" || true
          done
          exit $STATUS
