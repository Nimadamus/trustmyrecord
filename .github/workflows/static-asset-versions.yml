name: Static Asset Versions

# Keeps every /static/ JS+CSS reference pinned to its content hash, on EVERY
# push, as a job that does nothing else.
#
# scripts/version_static_refs.py has existed for a while and already does this
# repo-wide -- but the only thing that ran it was the 30-minute prerender bake,
# which is fail-closed by design: a failure in the homepage-highlights check or
# the forum-thread build stops that job before its commit step, so a stale ?v=
# tag survives until the next successful run. Between 2026-08-03 and 08-04 the
# blp-pro.css tag drifted three separate times, twice leaving the two BetLegend
# Pro pages pointing at different versions of the same file.
#
# The edge caches /static/ for 4h keyed on the FULL URL including the query, so
# a stale tag means returning visitors keep getting hours-old CSS/JS while a
# cold cache looks perfectly fine -- the failure is invisible to whoever
# deployed it.
#
# This job is deliberately minimal: checkout, run the script, commit if it
# changed anything. Nothing it depends on can fail for an unrelated reason.
# Commits made with GITHUB_TOKEN do not trigger `on: push`, so it cannot loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-asset-versions
  cancel-in-progress: false

jobs:
  repin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Report drift before fixing it
        # Non-fatal on purpose: the point is to REPAIR, not to block a deploy
        # that has already reached main. The output names every file that was
        # pointing at the wrong bytes, so drift is visible in the run log even
        # though the next step silently corrects it.
        run: python scripts/version_static_refs.py --check || true

      - name: Re-pin every reference to its content hash
        run: python scripts/version_static_refs.py

      - name: Re-publish the content-hashed design-system builds
        # THE TWO VERSIONING SYSTEMS USED TO FIGHT EACH OTHER (2026-08-06).
        # version_static_refs.py rewrites ?v= refs INSIDE unhashed sources, and
        # static/js/tmr-ds-nav.js is one of them -- it names its notifications
        # dependency chain (config.js, backend-api.js, ...) in JavaScript. It also
        # skips hashed filenames by design. So every time this job re-pinned a ref
        # inside tmr-ds-nav.js, the tmr-ds-nav.<hash>.js copy that every page
        # actually loads silently froze at the refs it had when it was hashed.
        # That is not cosmetic: it shipped a nav requesting backend-api.js under a
        # stamp no other page used -- a second cache entry for the same bundle, and
        # potentially an older build of it.
        #
        # Re-hashing here closes the loop: the source is re-pinned first, then its
        # hashed copy is republished from those exact bytes and every page is
        # pointed at it. build_ds_assets.py never rewrites an existing hashed file,
        # so previously published URLs stay immutable for cached documents.
        #
        # PUBLISH AND REPOINT ARE NOW TWO SEPARATE DEPLOYS (2026-08-10). They used
        # to be one commit, and that is what let the edge cache a 404 for an asset
        # every page needs.
        #
        # Shipping the new hashed file and the HTML that references it in the SAME
        # commit means both go live in the same deploy -- but a Pages deploy is not
        # atomic across paths. A request for the new URL can arrive after the HTML
        # is being served and before the asset is fetchable. Cloudflare caches that
        # 404, /static/ carries max-age=14400, and the URL is immutable, so nothing
        # ever re-fetches it: one unlucky request pins a 404 onto the design system
        # for four hours while the origin is perfectly healthy. That is exactly what
        # happened to tmr-ds.61394bbbaf14.css, and every job in this file was green
        # while all 99 design-system pages rendered unstyled.
        #
        # Publishing first removes the race rather than repairing it. After this
        # step the new hashed file exists on main and deploys, but NOTHING links to
        # it -- so nothing requests it, so no 404 can be cached for it. Only once
        # the URL is proven fetchable does the next step point pages at it.
        run: python scripts/build_ds_assets.py

      - name: PHASE 1 - publish the new hashed builds, referenced by nothing yet
        id: publish
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new hashed builds to publish."
          else
            git config user.name "tmr-asset-version-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(assets): publish new content-hashed builds [skip ci]"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git show --stat --oneline HEAD
          fi

      - name: Wait until every hashed URL is actually fetchable on the live host
        # The gate that makes the sequence deterministic. Only when the published
        # URL answers 200 from the real hostname is it safe for a page to name it.
        # --no-purge on purpose: at this point the URL has never been referenced, so
        # a failure here means the deploy has not landed yet, not that the edge
        # holds a stale negative. Retries cover Pages propagation; if it still is
        # not live the job fails rather than repointing pages at a URL that 404s.
        if: steps.publish.outputs.changed == 'true'
        run: python scripts/verify_ds_assets_live.py --attempts 20 --delay 15 --no-purge

      - name: PHASE 2 - now point every page at the URLs proven live above
        run: |
          python scripts/repoint_ds_assets.py
          python scripts/version_static_refs.py

      - name: Prove every hashed build matches its own name
        # Fail closed: a hashed filename whose bytes are not what the name says is
        # the precise failure content hashing exists to prevent.
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          m = json.loads(pathlib.Path('static/ds-assets.json').read_text(encoding='utf-8'))
          bad = []
          for src, url in sorted(m.items()):
              raw = pathlib.Path(src).read_bytes()
              cur = hashlib.sha256(raw).hexdigest()[:12]
              named = url.rsplit('.', 2)[-2]
              target = pathlib.Path(url.lstrip('/'))
              if cur != named or not target.exists() or target.read_bytes() != raw:
                  bad.append(f"{src}: manifest={named} source={cur} exists={target.exists()}")
          if bad:
              sys.exit("hashed build mismatch:\n  " + "\n  ".join(bad))
          print(f"all {len(m)} hashed builds match their names")
          PY

      - name: Commit only if a tag actually changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "All static refs already match their content hashes."
          else
            git config user.name "tmr-asset-version-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(assets): re-pin static refs to content hashes [skip ci]"
            git push origin HEAD:main
            echo "Corrected stale ?v= tags:"
            git show --stat --oneline HEAD
          fi

      - name: Prove the tree is now self-consistent
        # Fail closed here: if a rewrite could not reach a fixpoint, the tags on
        # main are still wrong and that must not pass silently.
        run: python scripts/version_static_refs.py --check
