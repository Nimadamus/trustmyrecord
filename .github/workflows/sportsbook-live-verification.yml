name: Sportsbook Live Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'sportsbook/**'
      - 'static/js/sportsbook-production-fix-persist-reliability.js'
      - 'static/css/**sportsbook**'
      # The design-system shell. Once sportsbook renders on tmr-ds.css and
      # tmr-ds-nav.js, a change to either can move this page's layout, its nav,
      # or the cascade around the board -- without touching a single path listed
      # above. The end-to-end submit proof is the only check that would catch
      # that, so it has to be reachable from the shell's own files.
      - 'static/css/tmr-ds.css'
      - 'static/js/tmr-ds-nav.js'
      - 'static/js/tmr-session.js'
      - 'static/ds-assets.json'
      - 'tests/sportsbook-live-verification.*'
      - 'tests/sportsbook-live-browser-proof.js'
      - 'tests/sportsbook-team-totals-browser-proof.js'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/sportsbook-live-verification.yml'

# RUN_VOLUME_20260904. One run per ref: a burst of commits used to start one
# live browser run each against the same production site, every one reaching
# the same verdict and sending its own email. Supersede instead.
concurrency:
  group: sportsbook-live-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live-sportsbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:sportsbook-live
        env:
          TMR_SPORTSBOOK_URL: https://trustmyrecord.com/sportsbook/
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: xvfb-run --auto-servernum node tests/sportsbook-team-totals-browser-proof.js
        env:
          TMR_SPORTSBOOK_URL: https://trustmyrecord.com/sportsbook/
      - run: xvfb-run --auto-servernum npm run verify:sportsbook-live:browser-proof
        env:
          TMR_SPORTSBOOK_URL: https://trustmyrecord.com/sportsbook/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sportsbook-live-verification
          path: |
            artifacts/sportsbook-live-verification.png
            artifacts/sportsbook-live-browser-proof.png
            artifacts/sportsbook-team-totals-browser-proof.png
            artifacts/sportsbook-team-totals-browser-proof.json
            artifacts/sportsbook-live-f5-submit-proof.json
            artifacts/playwright-results/**
