name: League Simulator Bake

# SIM_BAKE_CLOUD_20261001. The NBA and NHL season and playoff simulator pages,
# the NFL season, team and playoff pages, and the MLB playoff odds page, baked
# from the live API in the cloud. This replaces the laptop task "TMR NBA NHL
# Season Sims" (scripts/run_league_sim_bake.cmd), which stopped whenever the
# laptop was off. Same steps, same order, same fail closed rule: any failing
# build or gate publishes nothing and the last good bake stays live.
#
# SCHEDULE. Four bakes a day, one per slot: 01:20, 09:20, 13:20, 21:20 UTC
# (6:20 PM, 2:20 AM, 6:20 AM, 2:20 PM PDT). GitHub starts this repo's scheduled
# runs 3 to 6 hours late and drops some (the 09:20 slot ran 2 times in 22 days),
# so the trigger fires hourly and the gate job (scripts/sim-bake-due.js) bakes
# only when no bake has succeeded since the latest slot. A run with nothing new
# commits nothing. SIM_BAKE_FOURTH_RUN_20261023
#
# ALERTS. A failed bake opens (or comments on) one issue labelled
# sim-bake-alert, which emails the repo owner; the next good bake closes it.
# The gate also alerts when the last good bake is more than 14 hours old.

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  # NFL_FINAL_REBAKE_20261030: the backend (services/nfl/nflFinalWatch.js) fires this
  # when an NFL game goes final, so finals reach the pages within ~20 minutes
  # instead of waiting 4 to 7 hours for the next slot. Always bakes.
  repository_dispatch:
    types: [nfl-game-final]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: league-sim-bake
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/sim-bake-due.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Is a bake due
        id: due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sim-bake-due.js
      - name: Alert when the bake is stale
        if: steps.due.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WHEN=$(TZ=America/Los_Angeles date '+%b %d %I:%M %p PT')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create sim-bake-alert --color B60205 --description "Simulator page bake failure" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          N=$(gh issue list -R "$GITHUB_REPOSITORY" --label sim-bake-alert --state open --json number --jq '.[0].number' 2>/dev/null)
          MSG="No good bake for over 14 hours at $WHEN (last ${{ steps.due.outputs.last }}). Run: $RUN_URL"
          if [ -n "$N" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" --body "$MSG" || true
          else gh issue create -R "$GITHUB_REPOSITORY" --label sim-bake-alert --title "Simulator page bake is failing" --body "$MSG. This issue closes itself after the next good bake." || true; fi

  bake:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bake and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git config user.name "tmr-sim-bake-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WHEN() { TZ=America/Los_Angeles date '+%b %d %I:%M %p PT'; }

          alert() {
            gh label create sim-bake-alert --color B60205 --description "Simulator page bake failure" >/dev/null 2>&1 || true
            N=$(gh issue list --label sim-bake-alert --state open --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$N" ]; then
              gh issue comment "$N" --body "Bake failed at $(WHEN): $1. Run: $RUN_URL" || true
            else
              gh issue create --label sim-bake-alert --title "Simulator page bake is failing" \
                --body "A bake failed at $(WHEN): $1. Run: $RUN_URL. The last good pages stay live. This issue closes itself after the next good bake." || true
            fi
          }
          recovered() {
            for N in $(gh issue list --label sim-bake-alert --state open --json number --jq '.[].number' 2>/dev/null); do
              gh issue close "$N" --comment "Recovered at $(WHEN): $RUN_URL" || true
            done
          }

          bake() {
            for attempt in 1 2 3; do
              git fetch -q origin main && git reset -q --hard origin/main || return 1
              # NBA_TEAM_PAGES_LIVE_20261030: NBA team pages from the live API (season-labelled records,
              # rotations, injuries); never fatal, a failure keeps the committed pages.
              node scripts/build_sim_team_pages.js --sports nba > bt.log 2>&1 || { tail -10 bt.log; git checkout -q -- nba-simulator/teams; }
              node scripts/build_league_sim_pages.js > b1.log 2>&1 || { tail -30 b1.log; return 1; }
              node scripts/build_nfl_season_page.js > b2.log 2>&1 || { tail -30 b2.log; return 1; }
              node scripts/build_nfl_team_pages.js > b3.log 2>&1 || { tail -30 b3.log; return 1; }
              # MLB_SEASON_STATE_20261030: one season state (phase + champion) that every MLB builder reads.
              node scripts/mlb_season_state.js > b4s.log 2>&1 || { tail -30 b4s.log; return 1; }
              node scripts/build_mlb_odds_page.js > b4.log 2>&1 || { tail -30 b4.log; return 1; }
              node scripts/build_mlb_season_pages.js >> b4s.log 2>&1 || { tail -30 b4s.log; return 1; }
              # Never fails the bake; on bad inputs it leaves the last bake live.
              node scripts/build_nfl_playoff_page.js > b5.log 2>&1 || tail -10 b5.log
              # NFL_ACCURACY_ONE_SOURCE_20261030: every accuracy figure from the API, incl. graded served predictions.
              node scripts/build_nfl_accuracy_copy.js > b6.log 2>&1 || tail -10 b6.log
              # NHL_EVALUATION_20261030: hub accuracy from the live ledger + accuracy report; keeps the last good copy on failure.
              node scripts/stamp-nhl-evaluation.js --fetch > b7.log 2>&1 || { tail -10 b7.log; git checkout -q -- data/nhl-evaluation.json nhl-simulator/index.html; }
              # THE GATES run before the commit: a failing gate publishes nothing.
              node tests/playoff-bracket-test.js > g1.log 2>&1 || { tail -30 g1.log; return 1; }
              node tests/league-season-engine-test.js > g2.log 2>&1 || { tail -30 g2.log; return 1; }
              node tests/league-tiebreakers-official-test.js > g2t.log 2>&1 || { tail -30 g2t.log; return 1; }
              node tests/nfl-accuracy-copy-test.js > g5.log 2>&1 || { tail -30 g5.log; return 1; }
              node tests/nfl-pages-consistency-test.js > g6.log 2>&1 || { tail -30 g6.log; return 1; }
              node tests/nfl-tbd-kickoff-test.js > g7.log 2>&1 || { tail -30 g7.log; return 1; }
              node tests/nfl-season-picks-test.js > g12.log 2>&1 || { tail -30 g12.log; return 1; }
              node tests/mlb-postseason-odds-test.js > g4.log 2>&1 || { tail -30 g4.log; return 1; }
              node tests/mlb-season-state-gate-test.js > g6.log 2>&1 || { tail -30 g6.log; return 1; }
              node tests/seo-indexability-regression-test.js > g3.log 2>&1 || { tail -40 g3.log; return 1; }
              node tests/sim-run-policy-test.js > g5.log 2>&1 || { tail -30 g5.log; return 1; }
              node tests/league-sim-consistency-test.js > g8.log 2>&1 || { tail -30 g8.log; return 1; }
              node tests/nba-team-season-label-test.js > g9.log 2>&1 || { tail -30 g9.log; return 1; }
              node tests/nba-accuracy-copy-test.js > g10.log 2>&1 || { tail -30 g10.log; return 1; }
              node tests/nhl-evaluation-page-test.js > g11.log 2>&1 || { tail -30 g11.log; return 1; }
              git add mlb-playoff-odds mlb-simulator data/mlb-playoff-odds-inputs.json data/mlb-season-state.json mlb-game-simulator mlb-season-simulator mlb-playoff-simulator mlb-predictions-simulator mlb-simulation-predictions nfl-season-simulator nfl-simulator nfl-playoff-simulator sitemap.xml nba-season-simulator nba-playoff-simulator nhl-season-simulator nhl-playoff-simulator nba-simulator nhl-simulator data/nhl-evaluation.json
              if git diff --cached --quiet; then echo "Simulator pages already current."; return 0; fi
              git commit -q -m "chore(sims): bake NBA and NHL season and playoff simulators [skip ci]"
              if git push -q origin HEAD:main; then git show --stat --oneline HEAD | head -20; return 0; fi
              echo "main moved during the bake; rebuilding on top of it (attempt $attempt)"
            done
            return 1
          }

          echo "=== bake at $(WHEN) (event ${GITHUB_EVENT_NAME})"
          rm -f .nfl-freshness-flag
          if ! bake; then alert "see the log for this run"; exit 1; fi
          # NFL_BAKE_FRESHNESS_GATE_20261030: a page skipped or degraded by the API's
          # freshness_status raises the same alert instead of passing silently.
          if [ -s .nfl-freshness-flag ]; then alert "NFL freshness gate: $(tr "\n" " " < .nfl-freshness-flag)"; else recovered; fi
