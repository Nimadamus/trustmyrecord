name = "tmr-home-ssr"
main = "worker.mjs"
compatibility_date = "2026-07-01"
workers_dev = false

# The worker injects CURRENT site stats + the Capper of the Week card into the
# baked homepage HTML at request time (fail-open on any error), so the first
# meaningful paint is accurate with zero client-side swap.
#
# The routes are WILDCARDS, and the worker's own isHomepage() guard decides what
# it actually rewrites. This is deliberate: a wildcard-free route such as
# "trustmyrecord.com/" is matched against the FULL request URL including the
# query string, so it covered a bare visit but NOT "/?utm_source=...",
# "/?gclid=..." or "/?fbclid=..." — i.e. every visitor from an ad, a social
# share or any UTM-tagged campaign silently bypassed the worker and got the
# un-injected bake. Cloudflare will not accept "?" inside a route pattern
# (API error 10022), so wildcard route + in-worker path guard is the only way
# to cover both. Do not narrow these back to "/" without re-testing a
# query-string URL for the "x-tmr-ssr: injected" response header.
#
# More specific routes on this zone (/pick/*, /forum/thread/*,
# /mlb-simulator/simulations/*) still take precedence and keep their own
# workers; everything else is passed straight through by the guard.
routes = [
  { pattern = "trustmyrecord.com/*", zone_name = "trustmyrecord.com" },
  { pattern = "www.trustmyrecord.com/*", zone_name = "trustmyrecord.com" },
  { pattern = "trustmyrecord.com/", zone_name = "trustmyrecord.com" },
  { pattern = "www.trustmyrecord.com/", zone_name = "trustmyrecord.com" },
  { pattern = "trustmyrecord.com/index.html", zone_name = "trustmyrecord.com" },
  { pattern = "www.trustmyrecord.com/index.html", zone_name = "trustmyrecord.com" },
]
