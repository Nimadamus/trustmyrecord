<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMR notification toast harness</title>
<!--
  Isolation harness for static/js/notifications.js.

  It loads the REAL notifications engine against a scripted window.api, so the
  toast/badge/401 behaviour is exercised exactly as it ships, without booting
  the whole site or touching a backend. The suite that drives it is
  tests/notification-toasts.spec.js.

  window.__TEST controls the feed:
    feed        -> the notifications array the next poll returns
    unreadCount -> the count the next poll returns
    failWith    -> if set, the next poll rejects with { status: <n> }
    calls       -> incremented per poll
    marked      -> notification ids passed to markNotificationRead
-->
<style>
  body { margin: 0; background: #0b0e14; color: #e6edf3;
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px; }
  #notificationsBtn { background: #1b2130; color: #e6edf3; border: 1px solid #2a3040;
                      border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  #notifBadge { display: none; background: #ef4444; color: #fff; border-radius: 999px;
                padding: 0 6px; font-size: 12px; margin-left: 6px; }
</style>
<!-- TMR Concept A theme. Additive: one stylesheet, no markup or script changes. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&display=swap">
<link rel="stylesheet" href="/static/css/tmr-theme-a.css?v=baddfa8e1cf8">
</head>
<body class="tmr-theme-a">
<header>
  <button id="notificationsBtn" type="button">Alerts<span id="notifBadge"></span></button>
</header>

<script>
  // Fast tunables so the suite never waits on a real 30s backoff or a 20s poll.
  window.TMR_NOTIF_POLL_VISIBLE_MS = 300;
  window.TMR_NOTIF_POLL_HIDDEN_MS = 1000;
  window.TMR_NOTIF_AUTH_BACKOFF_MS = [400, 500, 600, 700];

  window.__TEST = {
    feed: [],
    unreadCount: 0,
    failWith: null,
    calls: 0,
    marked: [],
    markAllCalls: 0,
    loggedIn: true,
    failMarkOne: false,
    failMarkAll: false,
    markDelayMs: 0,
    nextListDelayMs: 0,
    replyUnread: null
  };

  // A previous page in this tab already saved the read state. A reload or a
  // back-navigation has to see that, not the empty default.
  try {
    var stash = sessionStorage.getItem('__harness_server');
    if (stash) {
      var parsed = JSON.parse(stash);
      if (parsed && Array.isArray(parsed.feed)) {
        window.__TEST.feed = parsed.feed;
        window.__TEST.unreadCount = Number(parsed.unreadCount) || 0;
      }
    }
  } catch (e) {}

  function stashServer() {
    try {
      sessionStorage.setItem('__harness_server', JSON.stringify({
        feed: window.__TEST.feed,
        unreadCount: window.__TEST.unreadCount
      }));
    } catch (e) {}
  }

  window.api = {
    ready: Promise.resolve(),
    token: 'harness-access-token',
    refreshToken: 'harness-refresh-token',
    loadTokens: function () {},
    isLoggedIn: function () { return !!window.__TEST.loggedIn; },
    getNotifications: async function () {
      window.__TEST.calls += 1;
      if (window.__TEST.failWith) {
        const err = new Error('harness auth failure');
        err.status = window.__TEST.failWith;
        throw err;
      }
      if (window.__TEST.replyUnread) {
        const stale = window.__TEST.replyUnread;
        window.__TEST.replyUnread = null;
        const wait = window.__TEST.nextListDelayMs || 0;
        window.__TEST.nextListDelayMs = 0;
        if (wait) await new Promise(function (r) { setTimeout(r, wait); });
        return stale;
      }
      // Snapshot before the wait so a save that lands while this request is
      // still open cannot change the answer. That is the stale poll.
      const snap = {
        notifications: window.__TEST.feed.map(function (n) { return Object.assign({}, n); }),
        unreadCount: window.__TEST.unreadCount
      };
      const delay = window.__TEST.nextListDelayMs || 0;
      window.__TEST.nextListDelayMs = 0;
      if (delay) await new Promise(function (r) { setTimeout(r, delay); });
      return snap;
    },
    markNotificationRead: async function (id) {
      window.__TEST.marked.push(String(id));
      // Mirrored into storage so a click-through assertion survives the
      // navigation the click triggers.
      try {
        var prior = JSON.parse(localStorage.getItem('__harness_marked') || '[]');
        prior.push(String(id));
        localStorage.setItem('__harness_marked', JSON.stringify(prior));
      } catch (e) {}
      if (window.__TEST.failMarkOne) {
        const err = new Error('save failed');
        err.status = 500;
        throw err;
      }
      if (window.__TEST.markDelayMs) {
        await new Promise(function (r) { setTimeout(r, window.__TEST.markDelayMs); });
      }
      window.__TEST.feed = window.__TEST.feed.map(function (n) {
        return String(n.id) === String(id) ? Object.assign({}, n, { is_read: true }) : n;
      });
      window.__TEST.unreadCount = window.__TEST.feed.filter(function (n) { return !n.is_read; }).length;
      stashServer();
      return { ok: true };
    },
    markAllNotificationsRead: async function () {
      window.__TEST.markAllCalls += 1;
      if (window.__TEST.failMarkAll) {
        const err = new Error('save failed');
        err.status = 500;
        throw err;
      }
      if (window.__TEST.markDelayMs) {
        await new Promise(function (r) { setTimeout(r, window.__TEST.markDelayMs); });
      }
      window.__TEST.feed = window.__TEST.feed.map(function (n) { return Object.assign({}, n, { is_read: true }); });
      window.__TEST.unreadCount = 0;
      stashServer();
      return { ok: true };
    }
  };
</script>
<script src="/static/js/notifications.js?v=6df3eacc7353"></script>
<script defer src="/static/js/tmr-ds-avatar.a6e8c49d08e7.js"></script>
</body>
</html>
