    /** One situation as a sentence fragment, naming the team it measures and
     *  the value it was set to. The library's own wording is used throughout,
     *  so a row on screen and this sentence can never disagree. */
    function situationPhrase(key) {
        var spec = specById(idOf(key));
        if (!spec) return null;
        var v = filters[key];
        if (!isSet(v)) return null;
        var who = teamName(bktOf(key));
        var body = chipFor(spec, v);
        return who ? who + ' — ' + body : body;
    }

    /** Every situation, in the order the reader added them, with both benches
     *  folded together when the same question was asked of each. */
    function situationPhrases() {
        var byId = {};
        var order = [];
        Object.keys(filters).forEach(function (key) {
            if (!isSet(filters[key])) return;
            var id = idOf(key);
            if (!byId[id]) { byId[id] = []; order.push(id); }
            byId[id].push(key);
        });
        var out = [];
        order.forEach(function (id) {
            var keys = byId[id];
            var spec = specById(id);
            // The same question of both teams, answered the same way, reads as
            // one clause rather than two near-identical ones.
            if (keys.length === 2 && spec && JSON.stringify(filters[keys[0]]) === JSON.stringify(filters[keys[1]])) {
                out.push('both teams — ' + chipFor(spec, filters[keys[0]]));
                return;
            }
            keys.forEach(function (k) {
                var phrase = situationPhrase(k);
                if (phrase) out.push(phrase);
            });
        });
        return out;
    }

    /** "a, b and c" -- the join a person uses. */
    function joinClauses(parts) {
        if (!parts.length) return '';
        if (parts.length === 1) return parts[0];
        return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
    }

    /** The team total as its own sentence: it is asked OF the sample the
     *  first sentence found, not as one more narrowing of it. */
    function teamTotalPhrase() {
        var tt = teamTotalPayload();
        if (!tt) return '';
        var who = tt.team === 'team_1' ? mAway.value : mHome.value;
        return 'Analyze ' + who + ' team total ' + (tt.side === 'over' ? 'Over' : 'Under')
            + ' ' + tt.line + ' ' + ttNoun()
            + (tt.odds != null ? ' at ' + (tt.odds > 0 ? '+' : '') + tt.odds : '') + '.';
    }

    /** The whole question, in one plain-English sentence, built from the same
     *  state the request body is built from -- so it cannot drift from what is
     *  actually sent. */
    function querySentence() {
        var a = mAway.value, h = mHome.value;
        var verb = mVenue.value === 'all' ? ' and ' : (mVenue.value === 'home' ? ' vs ' : ' at ');
        var head = 'Find ' + a + verb + h + ' games'
            + (mSport.value ? '' : '') + ' in ' + timeframeLabel();
        var clauses = situationPhrases();
        var limit = mLimit.value && mLimit.value !== 'all'
            ? ', listing their ' + mLimit.value + ' most recent qualifying meetings' : '';
        var first = clauses.length
            ? head + limit + ', where ' + joinClauses(clauses) + '.'
            : head + limit + '.';
        var tt = teamTotalPhrase();
        return tt ? first + ' ' + tt : first;
    }

    function timeframeLabel() {
        var v = mTimeframe.value;
        if (v === 'custom') {
            if (mDateFrom.value && mDateTo.value) return mDateFrom.value + ' to ' + mDateTo.value;
            if (mDateFrom.value) return 'from ' + mDateFrom.value;
            if (mDateTo.value) return 'up to ' + mDateTo.value;
            return 'a custom date range';
        }
        if (v === 'all') {
            return (coverage && coverage.earliest_season)
                ? 'all available history since ' + coverage.earliest_season
                : 'all available history';
        }
        return 'the ' + v + ' season';
    }

    /** The matchup in a full sentence. "at" is standard notation, but it must
     *  never be the only place the meaning lives. */
    function paintOrient() {
        var a = mAway.value, h = mHome.value, el = $('orientRead');
        if (!el) return;
        if (!a || !h) { el.textContent = 'Choose an away team and a home team.'; return; }
        var v = mVenue.value;
        el.innerHTML = '<strong>' + esc(a) + (v === 'all' ? ' and ' : (v === 'home' ? ' vs ' : ' at '))
            + esc(h) + '</strong> — ' + (v === 'all'
                ? 'either location: ' + esc(a) + ' home or ' + esc(h) + ' home.'
                : (v === 'home' ? esc(a) + ' at home, ' + esc(h) + ' away.'
                                : esc(a) + ' away, ' + esc(h) + ' at home.'));
    }

    // --------------------------------------------------------------- teams
    var teamCache = {}, teamInFlight = {};
    var RETRY_MS = [800, 2000, 4000];

    function fetchTeams(sport) {
        if (teamCache[sport]) return Promise.resolve(teamCache[sport]);
        if (teamInFlight[sport]) return teamInFlight[sport];
        var attempt = function (i) {
            return window.api.getBetLegendProTeams(sport).then(function (r) {
                teamCache[sport] = (r && r.teams) || [];
                return teamCache[sport];
            }).catch(function (err) {
                if (i < RETRY_MS.length) {
                    return new Promise(function (r) { setTimeout(r, RETRY_MS[i]); })
                        .then(function () { return attempt(i + 1); });
                }
                throw err;
            });
        };
        var pr = attempt(0).finally(function () { delete teamInFlight[sport]; });
        teamInFlight[sport] = pr;
        return pr;
    }

    // Guarded against out-of-order responses: a slow NBA fetch resolving after
    // a newer NFL one must not repopulate the list with the wrong sport.
    async function loadMatchupTeams(sport) {
        [mAway, mHome].forEach(function (s) {
            s.disabled = true;
            s.innerHTML = '<option value="">Loading…</option>';
        });
        hide($('teamsErr'));
        try {
            var teams = await fetchTeams(sport);
            if (mSport.value !== sport) return;
            var opts = '<option value="">Select team…</option>' + teams.map(function (t) {
                return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
            }).join('');
            // Rebuilding the options clears the selection, so put it back.
            // Only if the team is still on the list: after a sport change it
            // is not, and carrying it across leagues would be wrong.
            var keepAway = mAway.value, keepHome = mHome.value;
            mAway.innerHTML = opts; mHome.innerHTML = opts;
            if (keepAway && teams.indexOf(keepAway) !== -1) mAway.value = keepAway;
            if (keepHome && teams.indexOf(keepHome) !== -1) mHome.value = keepHome;
            mAway.disabled = false; mHome.disabled = false;
        } catch (err) {
            if (mSport.value !== sport) return;
            [mAway, mHome].forEach(function (s) { s.innerHTML = '<option value="">Teams unavailable</option>'; });
            $('teamsErr').hidden = false;
        }
        syncSetup();
    }

    $('teamsRetry').addEventListener('click', function () {
        delete teamCache[mSport.value];
        loadMatchupTeams(mSport.value);
    });

    mVenue.addEventListener('change', syncSetup);

    $('mSwap').addEventListener('click', function () {
        var a = mAway.value;
        mAway.value = mHome.value;
        mHome.value = a;
        // A situation stays with the TEAM it was added for, not with the
        // slot: "Yankees off a loss" must still read Yankees after the swap,
        // and the request must still carry it on the Yankees' side.
        var swapped = {};
        Object.keys(filters).forEach(function (key) {
            var bkt = bktOf(key);
            var to = bkt === 't1' ? 't2' : bkt === 't2' ? 't1' : bkt;
            swapped[fkey(to, idOf(key))] = filters[key];
        });
        filters = swapped;
        if (library) renderConditions(); else syncSetup();
    });
    [mAway, mHome].forEach(function (s) {
        s.addEventListener('change', function () {
            // Team conditions are labelled with the team they measure, so a
            // team change has to relabel them. Without this the controls keep
            // saying "Away team" after a team is chosen -- a per-team control
            // whose team is not named is the ambiguity this panel removes.
            if (library) renderConditions();
            syncSetup();
        });
    });
    mVenue.addEventListener('change', paintOrient);

    function setProgress(step) {
        var order = ['sport', 'matchup', 'period', 'filters', 'results'];
        var at = order.indexOf(step);
        $$('.prog-step').forEach(function (el) {
            var i = order.indexOf(el.getAttribute('data-step'));
            el.classList.toggle('is-on', i === at);
            el.classList.toggle('is-done', i < at);
        });
    }

    /** One validator owns the error line, the run button, the summary and the
     *  progress rail, so those four can never disagree. */
    function syncSetup() {
        var away = mAway.value, home = mHome.value;
        var err = '';
        // Conditions attach to NAMED sides, so there is nothing to attach them
        // to until both teams are chosen. The button says why rather than
        // sitting live and adding a condition about "Away team".
        var bothPicked = !!away && !!home && away !== home;
        $$('.sit-head').forEach(function (h) { h.disabled = !bothPicked; });
        $('sitAreas').classList.toggle('is-locked', !bothPicked);
        // The lock is a stated sentence, not a grey aside: it appears the
        // moment the matchup is incomplete or invalid and disappears the
        // instant two different teams are chosen, with no reload.
        $('addCondHint').hidden = bothPicked;
        if (!bothPicked && BUCKETS.some(function (b) { return sitOpen[b]; })) toggleArea(null, false);
        paintOrient();
        syncTeamTotal();
        if (away && home && away === home) err = 'The away team and the home team must be two different teams.';
        // A situation whose number the engine would refuse must not reach it.
        // 9999 days rest can never match and -5 can never narrow; both used to
        // run, quietly, and cost the reader a report.
        if (!err) {
            var bad = situationValueErrors()[0];
            if (bad) {
                var badSpec = specById(idOf(bad.key));
                err = (badSpec ? badSpec.label + ': ' : '') + bad.err;
            }
        }
        if (!err && mTimeframe.value === 'custom') {
            if (!mDateFrom.value && !mDateTo.value) err = 'Enter a from date, a to date, or both.';
            else if (mDateFrom.value && mDateTo.value && mDateFrom.value > mDateTo.value) {
                err = 'The from date must be on or before the to date.';
            }
        }
        // The period placeholder is not a period. The select refuses input
        // while the seasons are read, but the form itself was not held, so a
        // report could be asked for a "season" the engine cannot parse.
        if (!err && bothPicked && !periodReady()) err = 'Reading the seasons on file for this sport…';
        var errEl = $('setupErr');
        errEl.textContent = err;
        errEl.hidden = !err;

        // A malformed team-total price would be rejected by the endpoint after
        // the run had already been billed, so it blocks the button here.
        var ready = !!away && !!home && away !== home && !err && !teamTotalError();
        // The marker is what survives a status refresh; the disabled property
        // alone does not.
        if (ready) mSubmit.removeAttribute('data-incomplete');
        else mSubmit.setAttribute('data-incomplete', '');
        mSubmit.disabled = !ready || SUBMIT_BLOCKED;
        // The reason is on screen next to the button, so a sighted user is
        // told. A screen reader landing on the button was not, and neither was
        // anyone hovering it -- the button just refused. Every other disabled
        // control in the console states its reason inline (the greyed-out
        // situation options carry theirs); this one was the exception.
        if (!ready) {
            mSubmit.setAttribute('title', errEl.hidden
                ? 'Choose a sport and two different teams to continue.'
                : (errEl.textContent || '').trim());
        } else if (SUBMIT_BLOCKED) {
            // Ready to run, blocked by account state: say which state. Without
            // this branch the title kept whatever the previous pass left on it.
            mSubmit.setAttribute('title', SUBMIT_BLOCKED_REASON);
        } else {
            mSubmit.removeAttribute('title');
        }

        var n = activeFilterCount();
        // The header count belongs here, not in renderConditions: setting a
        // value on a row that already exists changes the count without
        // re-rendering the list, and the chip sat on the stale number while
        // the progress rail below it already said "2 conditions set".
        $('filterCount').textContent = n ? (n + (n === 1 ? ' situation' : ' situations')) : 'None';
        var summary = $('runSummary');
        if (!ready) {
            summary.innerHTML = err ? esc(err) : 'Choose a sport and two different teams to continue.';
        } else if (SUBMIT_BLOCKED) {
            summary.textContent = SUBMIT_BLOCKED_REASON || 'This report cannot run on this account right now.';
        } else {
            // The whole question, in the words the reader chose it with. A
            // count ("2 situations, combined with AND") is true and tells them
            // nothing: not which, not whose, not what value, and not the
            // market they configured underneath.
            summary.textContent = querySentence();
        }

        var note = $('progNote');
        if ($('resultsView') && $('resultsView').hidden === false) {
            setProgress('results'); note.textContent = 'Report ready';
        } else if (ready) {
            setProgress('filters');
            note.textContent = n ? n + (n === 1 ? ' situation set' : ' situations set') : 'Situations are optional';
        } else {
            setProgress('matchup'); note.textContent = 'Pick a sport and two teams to begin';
        }
        // Ahead of the return, or it never runs: the free sample count has to
        // refresh when the teams or the venue change, not only when a condition
        // does.
        scheduleTrail();
        return ready && !SUBMIT_BLOCKED;
    }

    // ------------------------------------------------------------- results
    var SCORE_NOUN = { MLB: 'runs', NHL: 'goals', NBA: 'points', NFL: 'points' };
    var DASH = '&mdash;';
    var THIN_SAMPLE = 8;
    // Sports whose spread is a FIXED +/-1.5 run line or puck line. It cannot
    // say who was favoured -- the price does -- so anything that reports "the
    // favourite and the number behind it" has to read the moneyline here.
    var FIXED_LINE_SPORTS = { MLB: 1, NHL: 1 };

    function hxPct(v) { return (v === null || v === undefined) ? DASH : esc(v) + '%'; }
    function num(v) { return (v === null || v === undefined) ? DASH : esc(v); }
    function signed(v) {
        if (v === null || v === undefined) return DASH;
        return (v > 0 ? '+' : '') + esc(v);
    }

    /** Mean combined final score of the games listed beneath it. Not a server
     *  figure: the plain average of team_score + opponent_score over the same
     *  rows in the table, labelled as the final-score total so it is never
     *  mistaken for the average closing number. */
    function avgTotal(games) {
        var vals = (games || []).filter(function (g) {
            return typeof g.team_score === 'number' && typeof g.opponent_score === 'number';
        }).map(function (g) { return g.team_score + g.opponent_score; });
        if (!vals.length) return null;
        return Math.round((vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) * 10) / 10;
    }

    function funnelLine(r) {
        var inDataset = r.games_in_dataset;
        var qualified = (r.total_qualifying_games != null) ? r.total_qualifying_games : r.qualifying_games;
        var shown = (r.games || []).length;
        if (inDataset == null && qualified == null) return '';
        var bits = [];
        if (inDataset != null) bits.push('<span><strong>' + fmtInt(inDataset) + '</strong> games on file before filtering</span>');
        if (qualified != null) {
            bits.push('<span class="funnel-arrow" aria-hidden="true">→</span><span><strong>'
                + fmtInt(qualified) + '</strong> matched '
                + (r.conditions_applied === false ? 'no situations (unfiltered side)' : 'your situations') + '</span>');
        }
        bits.push('<span class="funnel-arrow" aria-hidden="true">→</span><span><strong>'
            + fmtInt(shown) + '</strong> listed below and used for every figure here</span>');
        return '<div class="funnel">' + bits.join('') + '</div>';
    }

    function splitsLine(r) {
        var out = [], ats = r.ats, ou = r.ou, trend = r.recent_trend;
        if (ats && ats.eligible_games) {
            out.push('<span><span class="split-l">ATS</span> <span class="split-v">' + esc(ats.record)
                + (ats.cover_pct != null ? ' (' + esc(ats.cover_pct) + '%)' : '') + '</span> · '
                + esc(ats.eligible_games) + ' graded</span>');
        }
        if (ou && ou.eligible_games) {
            out.push('<span><span class="split-l">O/U</span> <span class="split-v">' + esc(ou.record)
                + (ou.over_pct != null ? ' (' + esc(ou.over_pct) + '% over)' : '') + '</span> · '
                + esc(ou.eligible_games) + ' graded</span>');
        }
        if (trend && trend.label) {
            out.push('<span><span class="split-l">Recent</span> <span class="split-v">' + esc(trend.label) + '</span></span>');
        }
        if (r.home_games != null && r.away_games != null && (r.home_games || r.away_games)) {
            out.push('<span><span class="split-l">Split</span> <span class="split-v">' + esc(r.home_games)
                + ' home / ' + esc(r.away_games) + ' away</span></span>');
        }
        return out.length ? '<div class="splits">' + out.join('') + '</div>' : '';
    }

    function thinNote(r) {
        // The QUALIFYING count, not the length of the transmitted list. A
        // result limit trims the list but not the sample every percentage above
        // it was computed from, so reading the array made "Most recent 10
        // qualifying meetings" print "Small sample: 10 games" over records
        // drawn from 241 — a warning about a sample that does not exist, and
        // the wrong margin-of-error beside it.
        var games = (r.total_qualifying_games != null)
            ? r.total_qualifying_games : (r.games || []).length;
        if (!games) return '';
        var bits = [];
        if (games < THIN_SAMPLE) {
            bits.push('<b>Small sample: ' + games + ' game' + (games === 1 ? '' : 's') + '.</b> '
                + 'Every percentage above is exact arithmetic on those ' + games + ' results, but one more '
                + 'win or loss moves it by about ' + Math.round(100 / games) + ' points. Read the game list '
                + 'rather than the rate — or widen the timeframe or drop a condition to build a bigger sample.');
        }
        if (r.sample_note) bits.push(esc(r.sample_note));
        return bits.length ? '<div class="thin"><span>' + bits.join(' ') + '</span></div>' : '';
    }

    /** What this report searched, before any number it produced: the era the
     *  database holds, the period asked for, how many meetings qualified and
     *  the years they span. All four are the server's, measured. */
    function searchedBlock(d) {
        var cov = d.database_coverage, per = d.report_period, span = d.qualifying_span;
        var total = (d.team_1_report && d.team_1_report.total_qualifying_games) || 0;
        var listed = (d.team_1_report && (d.team_1_report.games || []).length) || 0;
        var fact = function (label, value) {
            return '<div class="fact"><span>' + esc(label) + '</span><strong>' + value + '</strong></div>';
        };
        return '<div class="facts">'
            + fact('Database coverage', (cov && cov.earliest_season != null)
                ? esc(d.sport) + ' ' + esc(cov.earliest_season) + '–' + esc(cov.latest_season)
                    + ' <em>(' + fmtInt(cov.games) + ' games)</em>'
                : DASH)
            + fact('Report period', per ? esc(per.label) : 'All available history')
            + fact('Qualifying meetings', fmtInt(total))
            + fact('Span of the answer', span
                ? esc(span.first_game) + ' → ' + esc(span.last_game) : DASH)
            + '</div>'
            + ((listed && listed < total)
                ? '<p class="note-s">The list below shows the ' + fmtInt(listed) + ' most recent of them. '
                    + 'The records, averages and market splits cover all ' + fmtInt(total) + '.</p>'
                : '');
    }

    /** Every qualifying meeting, once. One row per MEETING, away side first,
     *  presented neutrally rather than as either team's game log -- the two
     *  mirrored per-team tables this replaces listed the same games twice and
     *  made one report read as two separate team reports. */
    function meetingsTable(d) {
        var r = d.team_1_report;
        if (!r) return '';
        var games = r.games || [];
        // A rest column, but only when rest is what the reader asked about --
        // and then BOTH teams', because "Boston had 0 days rest" is not
        // substantiated by a table showing only New York's. Read straight off
        // the row; nothing here recomputes it.
        var restIds = ['min_rest_days', 'rest_days_range', 'back_to_back', 'long_rest',
                       'opp_rest_days', 'opp_back_to_back'];
        var askedAboutRest = restIds.some(function (id) {
            return Object.keys(filters).some(function (k) { return idOf(k) === id; });
        }) && games.some(function (g) { return g.rest_days != null || g.opponent_rest_days != null; });
        var restDay = function (v) { return v == null ? DASH : (v + (v === 1 ? ' day' : ' days')); };
        var total = (r.total_qualifying_games != null) ? r.total_qualifying_games : games.length;
        var rows = games.map(function (g) {
            var homeSide = g.venue === 'Home';
            var away = homeSide ? g.opponent : g.team;
            var home = homeSide ? g.team : g.opponent;
            var score = homeSide ? (g.opponent_score + '-' + g.team_score)
                                 : (g.team_score + '-' + g.opponent_score);
            var winner = g.result === 'W' ? g.team : (g.result === 'L' ? (g.opponent || '') : 'Tie');
            // A venue or nothing. The old fallback printed the home team's
            // name with "(home)" after it, which reads as a stadium called
            // "Boston Red Sox" -- and the Matchup column two cells to the left
            // already says who hosted. Older rows genuinely carry no venue, so
            // they say so rather than being dressed up.
            var where = g.venue_name || '';
            // The favourite, and THE NUMBER THAT MADE THEM ONE -- which is not
            // the same field in every sport, and pairing the wrong two produced
            // a self-contradicting cell.
            //
            // `role` comes from the point spread in NFL/NBA and from the
            // MONEYLINE in MLB/NHL, where the line is a fixed +/-1.5 that says
            // nothing about who was favoured. `closing_line` is always the
            // spread. So on MLB/NHL the cell was reading role off the price and
            // the number off the run line, and a row where the two disagreed
            // rendered "New York Yankees +1.5" -- a favourite laying a positive
            // number. On MLB/NHL the price is also the only informative half:
            // "-1.5" is true of every single row.
            var fav;
            if (g.role == null) {
                fav = DASH;
            } else if (FIXED_LINE_SPORTS[d.sport]) {
                var favMl = g.role === 'Favorite' ? g.moneyline : g.opponent_moneyline;
                fav = favMl == null ? DASH
                    : esc(g.role === 'Favorite' ? g.team : (g.opponent || '')) + ' ' + signed(favMl);
            } else if (g.closing_line == null) {
                fav = DASH;
            } else {
                // Dog-positive and team-1 relative, so the favoured side's own
                // number is the negation when team 1 was the dog.
                fav = g.role === 'Favorite'
                    ? esc(g.team) + ' ' + signed(g.closing_line)
                    : esc(g.opponent || '') + ' ' + signed(Math.round(-g.closing_line * 10) / 10);
            }
            // An estimated total is not a closing total: shown as absent rather
            // than as a line no book ever hung.
            var totalCell = (g.closing_total == null || g.closing_total_available === false)
                ? DASH : esc(g.closing_total);
            var ml = (g.moneyline == null && g.opponent_moneyline == null) ? DASH
                : (esc(g.team) + ' ' + (g.moneyline == null ? DASH : signed(g.moneyline))
                   + ' · ' + esc(g.opponent || '') + ' '
                   + (g.opponent_moneyline == null ? DASH : signed(g.opponent_moneyline)));
            var why = g.qualified_because || [];
            // `data-k` is the value a column SORTS on, where that is not the
            // text in the cell: combined score behind "4-5", the favourite's
            // own number behind "Yankees -148". Sorting the rendered string
            // would order 10 before 9 and put a "—" in the middle of the run.
            var favKey = g.role == null ? ''
                : (FIXED_LINE_SPORTS[d.sport]
                    ? (g.role === 'Favorite' ? g.moneyline : g.opponent_moneyline)
                    : (g.role === 'Favorite' ? g.closing_line : -g.closing_line));
            return '<tr><td>' + esc(g.date || '') + '</td>'
                + '<td>' + esc(away || '') + ' at ' + esc(home || '') + '</td>'
                + '<td>' + (where ? esc(where) : '<span class="unk">Venue unavailable</span>') + '</td>'
                + '<td class="n" data-k="' + ((g.team_score || 0) + (g.opponent_score || 0)) + '">' + esc(score) + '</td>'
                + '<td><span class="res res-' + (g.result === 'T' ? 't' : (winner === g.team ? 'w' : 'l')) + '">'
                + esc(winner) + '</span></td>'
                + '<td class="n" data-k="' + Math.abs(g.margin) + '">' + Math.abs(g.margin) + '</td>'
                + '<td class="n" data-k="' + (favKey === '' || favKey == null ? '' : favKey) + '">' + fav + '</td>'
                + '<td class="n" data-k="' + (g.closing_total == null || g.closing_total_available === false ? '' : g.closing_total) + '">' + totalCell + '</td>'
                + '<td class="n">' + ml + '</td>'
                + (askedAboutRest
                    ? '<td class="n" data-k="' + (g.rest_days == null ? '' : g.rest_days) + '">'
                        + restDay(g.rest_days) + '</td>'
                      + '<td class="n" data-k="' + (g.opponent_rest_days == null ? '' : g.opponent_rest_days) + '">'
                        + restDay(g.opponent_rest_days) + '</td>'
                    : '')
                + '<td class="why">' + (why.length ? esc(why.join(' · ')) : DASH) + '</td></tr>';
        }).join('');
        // Every column a research question could be asked of is sortable. Date
        // starts descending because "most recent first" is what the report is
        // already answering; clicking it flips to oldest first.
        var head = [
            ['Date', 'text', 'desc'], ['Matchup', 'text', ''], ['Location', 'text', ''],
            ['Final score', 'num', ''], ['Winner', 'text', ''], ['Margin', 'num', ''],
            ['Favorite', 'num', ''], ['Closing total', 'num', ''],
            ['Closing moneyline', '', ''],
        ].concat(askedAboutRest
            ? [[esc(d.team_1) + ' rest', 'num', ''], [esc(d.team_2) + ' rest', 'num', '']]
            : []
        ).concat([
            ['Why it qualified', '', ''],
        ]).map(function (c) {
            if (!c[1]) return '<th>' + c[0] + '</th>';
            return '<th class="th-sort" data-sort="' + c[1] + '" tabindex="0" role="columnheader"'
                + ' aria-sort="' + (c[2] === 'desc' ? 'descending' : 'none') + '"'
                + ' title="Sort by ' + c[0].toLowerCase() + '">'
                + '<span>' + c[0] + '</span><i class="th-arrow" aria-hidden="true"></i></th>';
        }).join('');
        var body = rows
            ? '<div class="tablewrap"><table class="games is-sortable">'
                + '<caption class="sr">Qualifying meetings between ' + esc(d.team_1) + ' and ' + esc(d.team_2)
                + ', with the situations each one satisfied. Column headers sort the list; '
                + 'the records and averages above always cover every qualifying meeting.</caption>'
                + '<thead><tr>' + head + '</tr></thead><tbody>'
                + rows + '</tbody></table></div>'
            : '<p class="note-s">No meeting matches these situations in this period. Remove a situation or '
                + 'widen the period — nothing here is broken, the dataset simply holds no meeting that met '
                + 'all of them.</p>';
        return '<section class="rcard">'
            + '<div class="rcard-head"><h3>' + ((games.length && games.length < total)
                ? 'Qualifying meetings — most recent ' + fmtInt(games.length) + ' of ' + fmtInt(total)
                : 'Every qualifying meeting (' + fmtInt(total) + ')') + '</h3>'
            + '<span class="range">Away side listed first</span></div>'
            + body + '</section>';
    }

    /**
     * The neutral, two-team view of the qualifying sample.
     *
     * Every figure here is the server's, computed from exactly the games the
     * tables below list, and every label names the team it describes. "Record:
     * 11-7" with no team attached is the ambiguity this block exists to
     * remove.
     */
    function matchupSummary(d) {
        var m = d.matchup_summary;
        if (!m || !m.qualifying_games) return '';
        var kpi = function (label, value, hint) {
            return '<div class="kpi"><span>' + esc(label) + '</span><strong>' + value + '</strong>'
                + (hint ? '<em>' + esc(hint) + '</em>' : '') + '</div>';
        };
        var pct = function (v) { return v == null ? '' : v + '%'; };
        var rec = function (t) { return esc(t.wins + '-' + t.losses + (m.ties ? '-' + m.ties : '')); };
        var sc = m.scoring, mk = m.market || null, st = m.streaks;

        var result = '<section class="rcard is-answer">'
            + '<div class="rcard-head"><h3>Head-to-head result</h3>'
            + '<span class="range">' + fmtInt(m.qualifying_games) + ' qualifying meetings</span></div>'
            + '<div class="kpis">'
            + kpi(m.team_1.team + ' record', rec(m.team_1), pct(m.team_1.win_pct))
            + kpi(m.team_2.team + ' record', rec(m.team_2), pct(m.team_2.win_pct))
            + (sc ? kpi('Avg ' + m.scoring_noun + ' — ' + m.team_1.team, num(sc.avg_team_1),
                        'median ' + num(sc.median_team_1)) : '')
            + (sc ? kpi('Avg ' + m.scoring_noun + ' — ' + m.team_2.team, num(sc.avg_team_2),
                        'median ' + num(sc.median_team_2)) : '')
            + (sc ? kpi('Average margin', num(sc.avg_margin),
                        'combined ' + num(sc.avg_combined) + ' per game') : '')
            + kpi('Home side', fmtInt(m.home_side_wins) + '-' + fmtInt(m.away_side_wins),
                  'whichever team hosted')
            + '</div>'
            + ((st && st.current_label)
                ? '<p class="note-s">' + esc(st.current_label) + '. ' + esc(st.longest_label) + '.</p>' : '')
            + '<p class="note-s">Every figure here is the plain arithmetic of the qualifying meetings listed '
            + 'below.</p></section>';

        // Markets are conditional on real data. One with nothing behind it says
        // so in a sentence: an empty record reads as 0-0, which is a finding
        // rather than an absence.
        var ml = mk && mk.moneyline;
        var atsN = mk ? mk.ats.eligible_games : 0;
        var ouN = mk ? mk.over_under.eligible_games : 0;
        var absent = function (market, text) {
            return '<p class="market-absent"><strong>' + esc(market) + ':</strong> ' + esc(text) + '</p>';
        };
        var units = function (u) { return u == null ? DASH : (u > 0 ? '+' : '') + u + 'u'; };
        var markets = '<section class="rcard">'
            + '<div class="rcard-head"><h3>Historical betting markets</h3>'
            + '<span class="range">Genuine stored lines only</span></div>'
            + '<div class="kpis">'
            + (ml
                ? kpi('Moneyline — ' + ml.team_1.team, esc(ml.team_1.record),
                      pct(ml.team_1.win_pct) + ' · ' + units(ml.team_1.units) + ' flat · '
                      + ml.team_1.eligible_games + ' priced')
                  + kpi('Moneyline — ' + ml.team_2.team, esc(ml.team_2.record),
                      pct(ml.team_2.win_pct) + ' · ' + units(ml.team_2.units) + ' flat · '
                      + ml.team_2.eligible_games + ' priced')
                : '')
            + (atsN > 0
                ? kpi('Against the spread — ' + m.team_1.team, esc(mk.ats.record),
                      pct(mk.ats.cover_pct) + ' · ' + atsN + ' of ' + fmtInt(m.qualifying_games)
                      + ' carried a real closing spread')
                : '')
            + (ouN > 0
                ? kpi('Over / under', esc(mk.over_under.record),
                      pct(mk.over_under.over_pct) + ' over · ' + ouN + ' of ' + fmtInt(m.qualifying_games)
                      + ' carried a real closing total')
                : '')
            + '</div>'
            + (ml ? '' : absent('Moneyline', 'no genuine closing moneyline is on file for any of these '
                + 'meetings, so no moneyline record is reported.'))
            + (atsN > 0 ? '' : absent('Spread', 'none of these meetings carry a genuine closing spread, so no '
                + 'against-the-spread record is reported.'))
            + (ouN > 0 ? '' : absent('Totals', 'none of these meetings carry a genuine closing total, so no '
                + 'over/under record is reported.'))
            + (ml ? '<p class="note-s">' + esc(ml.note) + '</p>' : '')
            + ((m.unavailable_readings || []).length
                ? '<div class="block-note"><strong>Not shown, and why</strong><ul>'
                    + m.unavailable_readings.map(function (u) {
                        return '<li>' + esc(u.reading) + ': ' + esc(u.reason) + '</li>';
                    }).join('') + '</ul></div>' : '')
            + '</section>';

        return result + markets;
    }

    function renderReport(res) {
        var d = res.result || res;
        var applied = d.filters_applied || [];
        var declined = d.filters_not_applied || [];
        var unavailable = d.unavailable_filters || [];
        var warnings = d.filter_warnings || [];
        var trail = (d.games_after_each_filter && d.games_after_each_filter.team_1) || [];

        var SCOPE_TEXT = {
            both: 'Conditions applied to both teams',
            team_1: 'Conditions applied to ' + (d.team_1 || 'team 1') + ' only',
            team_2: 'Conditions applied to ' + (d.team_2 || 'team 2') + ' only'
        };
        var context = [];
        if (d.scope) context.push(SCOPE_TEXT[d.scope] || ('Scope: ' + d.scope));
        context.push(d.sample_size_requested == null
            ? 'Sample: all qualifying games'
            : 'Sample: the ' + d.sample_size_requested + ' most recent qualifying games');
        var reqf = d.filters || {};
        if (reqf.date_from || reqf.date_to) {
            context.push('Date range: ' + (reqf.date_from || 'earliest on file') + ' to ' + (reqf.date_to || 'latest on file'));
        }
        if (d.data_through) context.push('Latest completed game in this sample: ' + d.data_through);

        // A shorthand landing on the wrong franchise must never be silent.
        var tr = d.team_resolution || {};
        var renamed = ['team_1', 'team_2'].filter(function (k) {
            return tr[k] && tr[k].requested && tr[k].resolved
                && String(tr[k].requested).trim() !== String(tr[k].resolved).trim();
        });
        var resolutionNote = renamed.length
            ? '<p class="note-s">Read as: ' + renamed.map(function (k) {
                return esc(tr[k].requested) + ' → <strong>' + esc(tr[k].resolved) + '</strong>';
            }).join(' · ') + '.</p>' : '';

        var STANDING = [d.disclaimer, 'Conditions combine with AND'];
        var notes = (d.notes || []).filter(function (n) {
            return !STANDING.some(function (s) { return s && String(n).indexOf(String(s).slice(0, 40)) === 0; });
        });

        var dc = d.data_completeness || null;
        var thin = (dc && dc.thin_readings) || [];
        var completeness = dc
            ? '<div class="block-note"><strong>Data behind this report</strong><ul class="cover">'
                + '<li>' + fmtInt(dc.games_in_dataset.team_1) + ' games on file for ' + esc(d.team_1) + ', '
                + fmtInt(dc.games_in_dataset.team_2) + ' for ' + esc(d.team_2) + ', '
                + fmtInt(dc.games_in_dataset.head_to_head) + ' meetings between them.</li>'
                + (dc.dataset_range && dc.dataset_range.from
                    ? '<li>Covering ' + esc(dc.dataset_range.from) + ' to ' + esc(dc.dataset_range.to)
                        + (dc.coverage_from ? '. Conditions are backed by ' + esc(d.sport) + ' data from '
                            + esc(dc.coverage_from) + ' onward.' : '.') + '</li>' : '')
                + ((dc.readings || []).length
                    ? '<li>' + dc.readings.map(function (r) {
                        return esc(r.filter) + ' on file for ' + hxPct(r.coverage_pct);
                    }).join(', ') + ' of those games.</li>' : '')
                + '</ul>'
                + (thin.length ? '<p class="note-s">' + thin.map(function (r) { return esc(r.note); }).join(' ') + '</p>' : '')
                + '</div>' : '';

        // What was searched, in words, plus the sample's own span. This is
        // the verification surface for the whole report: it is generated from
        // the values the query actually ran on, so a user can check that the
        // tool understood their choices before reading a single number.
        var qs = d.query_summary || null;
        var span = d.qualifying_span || null;
        var verify = qs
            ? '<div class="verify">'
                + '<p class="verify-text">' + esc(qs.text) + '</p>'
                + (span
                    ? '<p class="verify-span">' + esc(span.label) + '</p>'
                        + '<p class="note-s">Earliest matching game ' + esc(span.first_game)
                        + ' · latest ' + esc(span.last_game) + ' · ' + fmtInt(span.years_represented)
                        + ' year' + (span.years_represented === 1 ? '' : 's') + ' represented.</p>'
                    : '')
                + ((qs.conditions || []).length
                    ? '<ul class="verify-list">' + qs.conditions.map(function (c) {
                        return '<li>' + (c.applies_to_team
                            ? '<b>' + esc(c.applies_to_team) + '</b> ' : '') + esc(c.description)
                            + (c.unavailable_reason
                                ? ' <i>— not applied: ' + esc(c.unavailable_reason) + '</i>' : '')
                            + '</li>';
                    }).join('') + '</ul>' : '')
                + '</div>'
            : '';

        // A zero is an answer, not an error. It names the condition that
        // emptied the sample, because "remove a filter" is useless advice
        // without saying which one.
        var zero = d.zero_result
            ? '<div class="block-note is-warn zero"><strong>' + esc(d.zero_result.message) + '</strong>'
                + (d.zero_result.narrowest_filter
                    ? '<p>' + esc(d.zero_result.narrowest_filter.filter) + ' was the narrowest part of this query — '
                        + fmtInt(d.zero_result.narrowest_filter.games_before) + ' qualified before it, '
                        + fmtInt(d.zero_result.narrowest_filter.games_after) + ' after.</p>' : '')
                + '<div class="zero-acts">' + (d.zero_result.actions || []).map(function (a) {
                    return '<button type="button" class="zero-act" data-zero-action="' + esc(a.action) + '"'
                        + (a.filter_id ? ' data-zero-filter="' + esc(a.filter_id) + '"' : '') + '>'
                        + '<b>' + esc(a.label) + '</b><span>' + esc(a.detail) + '</span></button>';
                }).join('') + '</div></div>'
            : '';

        var head = '<section class="rcard is-head">'
            + '<div class="rcard-head"><h2>' + esc(d.team_1)
            + esc(d.team_venue === 'all' ? ' and ' : (d.team_venue === 'home' ? ' vs ' : ' at '))
            + esc(d.team_2) + '</h2>'
            + '<span class="range">' + esc(d.sport) + '</span></div>'
            + searchedBlock(d)
            + verify + zero
            + '<div class="tags">'
            + (applied.length
                ? applied.map(function (a) { return '<span class="tag">' + esc(a) + '</span>'; }).join('')
                : '<span class="tag">No situations — every completed game</span>')
            + '</div>'
            + (declined.length
                ? '<div class="block-note is-warn"><strong>Conditions requested but not applied</strong><ul>'
                    + declined.map(function (n) { return '<li>' + esc(n.filter) + ': ' + esc(n.reason) + '</li>'; }).join('')
                    + '</ul></div>' : '')
            // A qualifying count on its own is unreadable: 412 of 900 means
            // nothing until you know which condition removed the other 488.
            + (trail.length
                ? '<div class="block-note"><strong>How the sample narrowed</strong><div class="trailwrap">'
                    + '<table class="trail"><thead><tr><th>Condition</th><th class="n">Before</th>'
                    + '<th class="n">After</th><th class="n">Removed</th></tr></thead><tbody>'
                    + trail.map(function (t) {
                        return '<tr><td>' + esc(t.filter) + '</td><td class="n">' + fmtInt(t.games_before)
                            + '</td><td class="n">' + fmtInt(t.games_after) + '</td><td class="n">'
                            + (t.removed ? '−' + fmtInt(t.removed) : '0') + '</td></tr>';
                    }).join('')
                    + '</tbody></table></div><p class="note-s">Applied in this order, each to what the one above '
                    + 'it left. The first row opens at every game on file for this team, so the column accounts '
                    + 'for all of them.</p></div>' : '')
            + (unavailable.length
                ? '<div class="block-note is-warn"><strong>Not available for ' + esc(d.sport) + '</strong><ul>'
                    + unavailable.map(function (n) { return '<li>' + esc(n.filter) + ': ' + esc(n.reason) + '</li>'; }).join('')
                    + '</ul></div>' : '')
            + (warnings.length
                ? '<div class="block-note is-warn"><strong>Check these situations</strong><ul>'
                    + warnings.map(function (w) { return '<li>' + esc(w.filter) + ': ' + esc(w.reason) + '</li>'; }).join('')
                    + '</ul></div>' : '')
            + (notes.length
                ? '<div class="block-note"><strong>About this sample</strong><ul>'
                    + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>' : '')
            + completeness
            + '<p class="note-s">' + context.map(esc).join(' · ') + '.</p>'
            + resolutionNote
            + '<p class="note-s">' + esc(d.disclaimer || 'Historical patterns do not guarantee future results.')
            + ' These are completed games that already met these situations; a situation appearing alongside a '
            + 'result is not evidence it caused one.</p>'
            + receiptRow(res)
            + '</section>';

        // TEAM TOTAL. Rendered only when the caller asked; there is no empty
        // state, because a card that says "no team total" is noise on the 95%
        // of reports that never asked for one.
        var tt = (d.matchup_summary && d.matchup_summary.team_total) || null;
        var ttBlock = '';
        if (tt) {
            var pr = tt.pricing;
            var evTone = pr ? (pr.ev_per_unit > 0 ? ' is-pos' : (pr.ev_per_unit < 0 ? ' is-neg' : '')) : '';
            var edgeTone = pr ? (pr.edge_pts > 0 ? ' is-pos' : (pr.edge_pts < 0 ? ' is-neg' : '')) : '';
            var signed1 = function (v) { return (v > 0 ? '+' : '') + v; };
            // The distribution strip, centred on the line that was asked
            // about so the reader can see the neighbouring numbers too.
            var dist = (d.matchup_summary.scoring
                && (tt.team === d.team_1
                    ? d.matchup_summary.scoring.distribution_team_1
                    : d.matchup_summary.scoring.distribution_team_2)) || null;
            var strip = '';
            if (dist && dist.cumulative && dist.cumulative.length) {
                strip = '<div class="tt-dist">' + dist.cumulative.map(function (c) {
                    var on = Math.abs(c.line - tt.line) < 0.01;
                    var pctv = tt.side === 'under' ? c.under_pct : c.over_pct;
                    return '<div class="' + (on ? 'is-line' : '') + '">'
                        + '<b>' + pctv + '%</b>'
                        + '<span>' + (tt.side === 'under' ? 'u' : 'o') + c.line + '</span></div>';
                }).join('') + '</div>'
                + '<p class="note-s">Share of the same qualifying games at every number the sample reaches.</p>';
            }
            ttBlock = '<section class="rcard is-answer"><div class="rcard-head">'
                + '<h3>Team total &mdash; ' + esc(tt.team) + ' ' + esc(tt.side) + ' ' + esc(tt.line) + '</h3>'
                + '<span class="range">Read from the qualifying sample, not a filter on it</span></div>'
                + '<div class="kpis">'
                + '<div class="kpi"><span>Historical</span><strong class="tt-lead">'
                    + (tt.hit_pct == null ? DASH : tt.hit_pct + '%') + '</strong>'
                    + '<em class="tt-sub">' + esc(tt.record) + ' &middot; '
                    + fmtInt(tt.decided_games) + ' decided</em></div>'
                + (pr
                    ? '<div class="kpi"><span>Break even</span><strong>' + pr.break_even_pct + '%</strong>'
                        + '<em class="tt-sub">at ' + (pr.odds > 0 ? '+' : '') + esc(pr.odds) + '</em></div>'
                      + '<div class="kpi"><span>Edge</span><strong class="kpi-v' + edgeTone + '">'
                        + signed1(pr.edge_pts) + ' pts</strong>'
                        + '<em class="tt-sub">historical minus break even</em></div>'
                      + '<div class="kpi"><span>EV per 1u</span><strong class="kpi-v' + evTone + '">'
                        + signed1(pr.ev_per_unit) + 'u</strong>'
                        + '<em class="tt-sub">over ' + fmtInt(pr.ev_denominator_games) + ' graded</em></div>'
                    : '')
                + '</div>'
                + strip
                + '<p class="note-s">' + esc(tt.basis) + '</p>'
                + (tt.pricing_unavailable_reason
                    ? '<p class="note-s">' + esc(tt.pricing_unavailable_reason) + '</p>' : '')
                + (pr ? '<p class="note-s">' + esc(pr.note) + '</p>' : '')
                + '</section>';
        }

        var h2h = d.head_to_head;
        var h2hBlock = h2h
            ? '<section class="rcard"><div class="rcard-head"><h3>Head-to-head</h3>'
                + '<span class="range">Conditions above are not applied here</span></div><div class="kpis">'
                + '<div class="kpi"><span>Meetings</span><strong>' + esc(h2h.games_in_dataset) + '</strong></div>'
                + '<div class="kpi"><span>' + esc(d.team_1) + ' record</span><strong>'
                    + (h2h.record ? esc(h2h.record) : DASH) + '</strong></div>'
                + '<div class="kpi"><span>Win %</span><strong>' + hxPct(h2h.win_pct) + '</strong></div>'
                + '<div class="kpi"><span>ATS</span><strong>' + ((h2h.ats && h2h.ats.record) ? esc(h2h.ats.record) : DASH) + '</strong></div>'
                + '<div class="kpi"><span>Over / under</span><strong>' + ((h2h.ou && h2h.ou.record) ? esc(h2h.ou.record) : DASH) + '</strong></div>'
                + '<div class="kpi"><span>Avg margin</span><strong>' + signed(h2h.avg_margin) + '</strong></div>'
                // From the server's own two averages, which cover every
                // meeting. Averaging the transmitted game list instead
                // answered for whatever subset happened to be in the payload:
                // 9.4 over 250 rows sitting beside a Meetings count of 485,
                // in a card where every other figure covers all 485.
                + '<div class="kpi"><span>Avg total</span><strong>'
                + num(h2h.avg_scored != null && h2h.avg_allowed != null
                    ? Math.round((h2h.avg_scored + h2h.avg_allowed) * 10) / 10
                    : avgTotal(h2h.games))
                + '</strong></div>'
                + '</div>'
                // H2H_DENOMINATOR_20260817: the card prints "Meetings" from
                // games_in_dataset (every meeting on file) while the record,
                // ATS, O/U and averages beside it are computed on the most
                // recent slice the payload carries -- 485 sitting next to
                // figures that add to 250. The server explains exactly that in
                // h2h.note, and the renderer was dropping the field, so the
                // reader saw two denominators and no way to tell.
                + (h2h.note ? '<p class="note-s">' + esc(h2h.note) + '</p>' : '')
                + thinNote(h2h) + '</section>' : '';

        // Answer first: the result card leads, the methodology card (what was
        // searched, how the sample narrowed, coverage) follows as evidence.
        return matchupSummary(d) + head + ttBlock + meetingsTable(d) + h2hBlock
            + '<p class="method">Every record, average and percentage above is the plain arithmetic of the '
            + 'qualifying meetings, computed from BetLegend Pro’s graded-game database. Every game listed '
            + 'is a meeting between these two teams; games against any other opponent are never included. '
            + 'Games with no final score are excluded, and a game with no closing line, total or moneyline on '
            + 'file shows a dash rather than an inferred value.</p>';
    }

    // ------------------------------------------------------ view switching
    function showSetup() {
        $('matchupForm').hidden = false;
        $('resultsView').hidden = true;
        syncSetup();
        host.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function showResults(title, sub) {
        $('matchupForm').hidden = true;
        $('resultsView').hidden = false;
        $('resultTitle').innerHTML = esc(title) + '<span>' + esc(sub) + '</span>';
        setProgress('results');
        $('progNote').textContent = 'Report ready';
    }
    $('editSearch').addEventListener('click', showSetup);
    $('runAgain').addEventListener('click', function () {
        showSetup();
        // An identical payload reuses the stored idempotency key, so "Run
        // again" with nothing changed is never charged twice.
        if (syncSetup()) $('matchupForm').requestSubmit();
    });

    // -------------------------------------------------------------- submit
    var mLastSig = null, mLastKey = null;

    function currentPayload() {
        var tf = mTimeframe.value;
        var body = {
            sport: mSport.value, team_1: mAway.value, team_2: mHome.value,
            // Which of the two questions is being asked. The bridge forwards
            // this; the engine resolves it onto its own `location` field.
            team_venue: mVenue.value,
            // The PERIOD is years. The LIMIT is a listing control chosen after
            // it: null means every qualifying meeting in the period, still
            // bounded by the engine's own cap, which the report states.
            sample_size: mLimit.value === 'all' ? null : Number(mLimit.value)
        };
        if (tf === 'custom') {
            if (mDateFrom.value) body.date_from = mDateFrom.value;
            if (mDateTo.value) body.date_to = mDateTo.value;
        } else if (SEASON_RE.test(tf)) {
            // Only a real four-digit season travels. 'all' means no period,
            // and the "__loading" placeholder (or anything else the control
            // could hold) is never a season: it reached the engine's int()
            // as `season` and came back as a 500 on every preview.
            body.season = tf;
        }
        var chosen = filterPayload();
        Object.keys(chosen).forEach(function (k) { body[k] = chosen[k]; });
        var tt = teamTotalPayload();
        if (tt) body.team_total = tt;
        return body;
    }

    /* ------------------------------------------------------- team total */

    // Off unless a team AND a line are both set. A line with no team, or a
    // team with no line, is an incomplete thought rather than a default, and
    // guessing either one would answer a question nobody asked.
    function teamTotalPayload() {
        if (!ttTeam.value) return null;
        var line = parseFloat(ttLine.value);
        if (!isFinite(line)) return null;
        var out = { team: ttTeam.value, side: ttSide.value, line: line };
        var odds = parseFloat(ttOdds.value);
        if (isFinite(odds)) out.odds = odds;
        return out;
    }

    function teamTotalError() {
        if (!ttTeam.value) return '';
        var line = parseFloat(ttLine.value);
        if (ttLine.value !== '' && !isFinite(line)) return 'Enter a number for the line.';
        if (isFinite(line) && Math.round(line * 2) !== line * 2) {
            return 'Line must be a whole or half number, such as 3.5 or 4.';
        }
        var band = ttBand();
        if (isFinite(line) && (line < band[0] || line > band[1])) {
            return mSport.value + ' team totals must be between ' + band[0] + ' and ' + band[1]
                + ' ' + ttNoun() + '. ' + ttLine.value + ' is outside that range.';
        }
        var odds = parseFloat(ttOdds.value);
        if (ttOdds.value !== '' && !isFinite(odds)) return 'Enter a number for the price, such as -110.';
        // A book never prices anything between -99 and +99; a number in that
        // gap is a typo (110 meant as -110) and silently pricing it would
        // hand back an EV built on a line that does not exist.
        if (isFinite(odds) && odds > -100 && odds < 100) {
            return 'That is not a valid American price. Use -110 or +150, not ' + ttOdds.value + '.';
        }
        return '';
    }

    // The two team options are the actual teams, so the control reads
    // "Colorado Rockies / under / 3.5" instead of "team_1 / under / 3.5".
    function syncTeamTotal() {
        var band = ttBand();
        ttLine.min = String(band[0]);
        ttLine.max = String(band[1]);
        ttLine.placeholder = mSport.value === 'NBA' ? '112.5'
            : mSport.value === 'NFL' ? '23.5' : mSport.value === 'NHL' ? '2.5' : '4.5';
        var haveBoth = !!(mAway.value && mHome.value && mAway.value !== mHome.value);
        ttCard.hidden = !haveBoth;
        if (!haveBoth) return;
        ttTeam.options[1].textContent = mAway.value;
        ttTeam.options[2].textContent = mHome.value;

        var err = teamTotalError();
        ttErr.textContent = err;
        ttErr.hidden = !err;

        var tt = teamTotalPayload();
        ttClear.hidden = !ttTeam.value;
        if (!ttTeam.value) {

                    + '<div class="lib-main"><div class="lib-title" title="' + esc(it.title || '') + '">'
                    + esc(it.title || 'Untitled') + '</div><div class="lib-meta">' + esc(when)
                    + (it.ledger_entry_id ? ' · receipt #' + esc(it.ledger_entry_id) : ' · included in plan')
                    + '</div></div><button class="btn" data-lib-id="' + esc(it.id) + '" type="button">Open</button></div>';
            }).join('') + '</div>';
            list.querySelectorAll('[data-lib-id]').forEach(function (b) {
                b.addEventListener('click', function () { openLibraryItem(b.dataset.libId); });
            });
        } catch (err) {
            list.innerHTML = '<div class="note is-err"><span>Could not load your library.</span>'
                + '<button class="btn" type="button" id="libRetry">Retry</button></div>';
            var retry = $('libRetry');
            if (retry) retry.addEventListener('click', function () { delete list.dataset.loadedOnce; loadLibrary(); });

    async function openLibraryItem(id) {
        var box = $('libDetail');
        box.innerHTML = skeleton('report', 'Opening saved item — this is a stored copy, nothing is charged…');
        box.hidden = false;
        try {
            var d = await window.api.getBetLegendProHistoryDetail(id);
            // Replayed through the exact renderer that produced it, so a
            // reopened report looks identical to the original.
            var fake = { result: d.result, included_in_plan: false, billed: false, was_free_inquiry: false, ledger_entry_id: null };
            var body;
            if (d.kind === 'matchup_historical') body = renderReport(fake);
            else if (d.kind === 'matchup_report') body = emptyState('Archived report',
                'This was produced by the previous bet-entry Matchup Analyzer, which has been replaced. Its stored figures are kept for your records but are not re-rendered here.');
            else if (d.kind === 'report') body = renderAsk(fake);
            else if (d.kind === 'simulation') {
                var out = (d.result && d.result.results) || {};
                body = '<section class="rcard"><div class="rcard-head"><h2>' + esc(d.title || 'Simulation') + '</h2></div>'
                    + '<div class="kpis-lg">' + [['$' + fmtInt(Math.round(out.median_final_bankroll)), 'Median finish'],
                        ['$' + fmtInt(Math.round(out.mean_final_bankroll)), 'Mean finish'],
                        [pct(out.profit_probability), 'Finished ahead'],
                        [pct(out.bust_rate), 'Bust rate'],
                        [(out.expected_roi > 0 ? '+' : '') + Number(out.expected_roi).toFixed(1) + '%', 'Expected ROI'],
                        [pct(out.avg_max_drawdown), 'Avg max drawdown']]
                        .map(function (k) { return '<div class="kpi-lg"><div class="kpi-v">' + esc(k[0]) + '</div><div class="kpi-l">' + esc(k[1]) + '</div></div>'; }).join('')
                    + '</div></section>';
            } else {
                var s = (d.result && d.result.summary) || {};
                body = '<section class="rcard"><div class="rcard-head"><h2>' + esc(d.title || 'Saved item') + '</h2></div>'
                    + '<div class="kpis-lg">' + [[s.su_record, 'Straight up'], [s.ats_record, 'Against the spread'], [s.ou_record, 'Over / under']]
                        .filter(function (k) { return k[0]; })
                        .map(function (k) { return '<div class="kpi-lg"><div class="kpi-v">' + esc(k[0]) + '</div><div class="kpi-l">' + esc(k[1]) + '</div></div>'; }).join('')
                    + '</div></section>';
            }
            box.innerHTML = '<div class="note is-ok"><span>Reopened from your library — not charged.</span></div>' + body;
        } catch (err) {
            box.innerHTML = '<div class="note is-err"><span>Could not open that saved item.</span></div>';
        }

    // The signed-out first screen.
    //
    // boot() used to return immediately when there was no session, which left
    // the two things below undone: the coverage table sat on its "Reading the
    // database…" placeholder forever (it is replaced by paintIntro, which only
    // ran after an authenticated library fetch), and #howWrap stayed open on a
    // phone, pushing the sign-in card to y=982 in an 844px viewport.
    //
    // So the first screen of the app -- what a new visitor and a store reviewer
    // both open -- was a dead loading state, an empty grey box where the
    // database claim belongs, and no visible way in without scrolling.
    //
    // dataset-stats is the one BetLegend Pro route that does not require a
    // token, which is what makes this fixable without opening anything new up:
    // per-sport game counts, no era. paintIntro already renders a row with no
    // season as an em-dash, so the counts alone are enough.
    async function paintPublicCoverage() {
        try {
            var stats = await window.api.request('/betlegend-pro/dataset-stats');
            var counts = (stats && stats.by_sport_games) || {};
            var rows = Object.keys(counts).map(function (s) {
                return { sport: s, games: counts[s], earliest_season: null, latest_season: null };
            }).sort(function (a, b) { return b.games - a.games; });
            if (!rows.length) return;
            library = { coverage_all: rows };
            paintIntro();
        } catch (err) {
            // A signed-out visitor is not owed a database census, but they are
            // owed the truth about why the panel is empty rather than a
            // "Reading the database…" that never resolves.
            var box = $('coverTable');
            if (box) {
                box.innerHTML = '<li class="cover-row"><span>Coverage is unavailable right now. '
                    + 'Sign in to search the database.</span></li>';
            }
            var active = $('coverActive');
            if (active) active.textContent = '';
        }
    }

    // ============================================================= boot
    async function boot() {
        if (EMBED) {
            // Signing in from inside the product page returns to the tool
            // on that page, and "What is BetLegend Pro?" is the page the
            // reader is already on.
            $$('#authGate a[href^="/login/"]').forEach(function (a) {
                a.href = '/login/?next=' + encodeURIComponent('/betlegend-pro/#tool');
            });
            $$('#authGate a[href="/betlegend-pro/"]').forEach(function (a) { a.hidden = true; });
        }
        if (!(window.api && window.api.isLoggedIn())) {
            $('authGate').hidden = false;
            $('topbarRight').hidden = true;
            try {
                if (window.matchMedia('(max-width: 899px)').matches) $('howWrap').open = false;
            } catch (e) { /* matchMedia is not worth failing boot over */ }
            await paintPublicCoverage();
            return;
        }
        $('app').hidden = false;
        selectTool((location.hash || '').replace('#', '') || 'matchup', false);
        // See the comment on #howWrap: the steps stay open on desktop and start
        // collapsed on a phone so the tool is not pushed off the first screen.
        try {
            // 900px is where .intro-grid stops being two columns: once the
            // band stacks, five open steps push the tool off the first screen
            // (measured 1,169px on a 834px tablet, 1,422px on a phone).
            if (window.matchMedia('(max-width: 899px)').matches) $('howWrap').open = false;
        } catch (e) { /* matchMedia is not worth failing boot over */ }
        renderConditions();
        syncSetup();
        updateEdgeNote();
        loadFilterLibrary(mSport.value);
        loadMatchupTeams(mSport.value);
        loadTrendTeams(tSport.value);
        loadTrendSituations(tSport.value);
        await refreshStatus();
    }

    /**
     * True only when nothing the reader chose would be lost by a reload.
     *
     * Read by the service-worker block below, which is deliberately outside
     * this IIFE and so cannot see these variables. Anything the reader put on
     * screen counts: a team, a period other than the default, a situation, a
     * team total, or a report.
     */
    window.BLP_IDLE = function () {
        try {
            if (mAway.value || mHome.value) return false;
            if (Object.keys(filters).length) return false;
            if (mTimeframe.value && mTimeframe.value !== 'all') return false;
            if (ttTeam && ttTeam.value) return false;
            var results = $('resultsView');
            if (results && results.hidden === false) return false;
            return true;
        } catch (err) { return false; }
    };

    if (window.api) boot();
    else window.addEventListener('DOMContentLoaded', boot);
})();
</script>
<script>
/*
 * Installable-app registration. Separate from the tool's own IIFE because
 * nothing here may ever be able to stop the tool from booting: the whole block
 * is guarded, and a browser without service workers simply keeps the ordinary
 * web page it already had.
 *
 * Registered after `load` so it never competes with the first paint or with
 * the report the user came here to run.
 */
(function () {
    if (!('serviceWorker' in navigator)) return;
    // Only over HTTPS (and localhost, which the platform already exempts).
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;

    window.addEventListener('load', function () {
        // Whether this page was ALREADY controlled when it loaded. On a first
        // visit it is not: the worker activates, calls clients.claim(), and
        // `controllerchange` fires for the adoption itself. Reloading there throws
        // away a page the reader is already using -- a team they just picked, a
        // situation they just added -- one second into the session, for no update
        // at all. Captured before registering, because registration is what causes
        // the claim.
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register('/betlegend-pro/sw.js', { scope: '/betlegend-pro/' })
            .then(function (reg) {
                // A new build should not wait for every tab to be closed, but it
                // must not swap the page out from under someone mid-report
                // either. So: take over as soon as a waiting worker appears,
                // and let the CONTROLLER change decide whether to reload. See
                // the handler below for the two cases it must refuse: the
                // first claim on a page that was never controlled, and any
                // moment the reader has work on screen.
                function offerUpdate(worker) {
                    if (!worker) return;
                    worker.addEventListener('statechange', function () {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                            worker.postMessage('blp-skip-waiting');
                        }
                    });
                }
                offerUpdate(reg.waiting);
                reg.addEventListener('updatefound', function () { offerUpdate(reg.installing); });
            })
            .catch(function () { /* an uninstallable page is still a working page */ });

        var reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (reloading) return;
            // The first claim is an adoption, not a new build. Nothing to reload.
            if (!hadController) { hadController = true; return; }
            // A real update, and still never over work in progress: a half-built
            // query or a report on screen is the reader's, not ours to discard.
            // The new worker is already in control, so the next navigation they
            // make picks it up anyway -- waiting costs nothing.
            if (workInProgress()) return;
            reloading = true;
            location.reload();
        });

        /** Has the reader started? Asked of the tool, which owns the answer; a
         *  missing hook (older build, script still loading) counts as YES, because
         *  the safe direction is never to reload. */
        function workInProgress() {
            try {
                return !window.BLP_IDLE || window.BLP_IDLE() !== true;
            } catch (err) { return true; }
        }
    });

    // Install affordance. The prompt is deferred rather than fired on arrival:
    // an install dialog nobody asked for, on a page whose job is to answer a
    // question, is an interruption. The button only appears once the browser
    // has confirmed the page is installable, so it is never a dead control on
    // a platform that cannot install (iOS Safari, where Add to Home Screen is
    // a menu item the site is not allowed to trigger).
    var deferred = null;

    function installButton() {
        var host = document.getElementById('blpConsole');
        return host && host.shadowRoot ? host.shadowRoot.getElementById('installBtn') : null;
    }

    window.addEventListener('beforeinstallprompt', function (ev) {
        ev.preventDefault();
        deferred = ev;
        // The tool mounts asynchronously, so the button may not exist yet.
        var tries = 0;
        (function reveal() {
            var btn = installButton();
            if (!btn) {
                if (tries++ < 40) setTimeout(reveal, 250);
                return;
            }
            // Already running as the installed app: nothing to install.
            if (window.matchMedia('(display-mode: standalone)').matches) return;
            btn.hidden = false;
            btn.addEventListener('click', function () {
                if (!deferred) return;
                btn.disabled = true;
                deferred.prompt();
                deferred.userChoice.then(function (choice) {
                    if (choice && choice.outcome === 'accepted') btn.hidden = true;
                    else btn.disabled = false;
                    deferred = null;
                });
            }, { once: false });
        })();
    });

    window.addEventListener('appinstalled', function () {
        deferred = null;
        var btn = installButton();
        if (btn) btn.hidden = true;
    });
})();
</script>
