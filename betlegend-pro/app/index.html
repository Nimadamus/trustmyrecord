            + '<p class="note-s">Avg total is the mean combined final score of the qualifying games listed '
            + 'further down, not the average closing number.</p>'
            + '</section>';
    }

    /** The evidence half: every qualifying game, at full width so all nine
     *  columns are readable without side-scrolling. */
    function teamGames(r) {
        if (!r) return '';
        var range = r.date_range
            ? '<span class="range">' + esc(r.date_range.from) + ' \u2192 ' + esc(r.date_range.to) + '</span>' : '';
        var games = r.games || [];
        // Every returned game is listed, not the first 25. "Why it qualified"
        // is the whole point of this table.
        var rows = games.map(function (g) {
            var where = g.venue_name ? esc(g.venue || '') + ' \u00b7 ' + esc(g.venue_name) : esc(g.venue || '');
            var why = (g.qualified_because || []);
            return '<tr><td>' + esc(g.date || '') + '</td><td>' + esc(g.opponent || '') + '</td>'
                + '<td>' + (where || DASH) + '</td><td class="n">' + esc(g.score || '') + '</td>'
                + '<td><span class="res res-' + esc(String(g.result || '').toLowerCase()) + '">'
                + esc(g.result || '') + '</span></td>'
                + '<td>' + (g.role ? esc(g.role) + (g.closing_line != null ? ' ' + signed(g.closing_line) : '') : DASH) + '</td>'
                // A dash is "no closing total on file", which is not a total of
                // zero. Both are real rows here, so they must not render alike.
                + '<td class="n">' + (g.closing_total != null ? esc(g.closing_total) : DASH) + '</td>'
                + '<td class="n">' + (g.rest_days != null ? esc(g.rest_days) : DASH) + '</td>'
                + '<td class="why">' + (why.length ? esc(why.join(' \u00b7 ')) : DASH) + '</td></tr>';
        }).join('');
        var body = rows
            ? '<div class="tablewrap"><table class="games">'
                + '<caption class="sr">Qualifying games for ' + esc(r.team) + ', with the conditions each one satisfied</caption>'
                + '<thead><tr><th>Date</th><th>Opponent</th><th>Location</th><th>Final score</th>'
                + '<th>Result</th><th>Closing line</th><th>Closing total</th><th>Rest</th>'
                + '<th>Why it qualified</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
            : '<p class="note-s">No qualifying games found for these conditions. Widen the timeframe or remove a '
                + 'condition \u2014 nothing here is broken, the dataset simply holds no game that met all of them.</p>';
        return '<section class="rcard">'
            + '<div class="rcard-head"><h3>' + esc(r.team) + ' \u2014 qualifying games</h3>' + range + '</div>'
            + body + '</section>';
    }

    /**
     * The neutral, two-team view of the qualifying sample.
     *
     * Every figure here is the server's, computed from exactly the games the
     * tables below list, and every label names the team it describes. "Record:
     * 11-7" with no team attached is the ambiguity this block exists to
     * remove.
     */
    function matchupSummary(d) {
        var m = d.matchup_summary;
        if (!m || !m.qualifying_games) return '';
        var kpi = function (label, value, hint) {
            return '<div class="kpi"><span>' + esc(label) + '</span><strong>' + value + '</strong>'
                + (hint ? '<em>' + esc(hint) + '</em>' : '') + '</div>';
        };
        var pct = function (v) { return v == null ? '' : v + '%'; };
        var rec = function (t) {
            return esc(t.wins + '-' + t.losses + (m.ties ? '-' + m.ties : ''));
        };
        var sc = m.scoring, mk = m.market, st = m.streaks, cg = m.close_games;

        var lines = [m.team_1.record_label, m.team_2.record_label];
        if (m.home_side_label) lines.push(m.home_side_label);
        if (sc) { lines.push(sc.avg_score_label); lines.push(sc.combined_label); }
        if (cg) lines.push(cg.label);
        if (mk) { lines.push(mk.ats.label); lines.push(mk.over_under.label); }
        if (st) {
            if (st.current_label) lines.push(st.current_label);
            lines.push(st.longest_label);
        }

        return '<section class="rcard">'
            + '<div class="rcard-head"><h3>These ' + fmtInt(m.qualifying_games) + ' meetings</h3></div>'
            + '<div class="kpis">'
            + kpi(m.team_1.team, rec(m.team_1), pct(m.team_1.win_pct))
            + kpi(m.team_2.team, rec(m.team_2), pct(m.team_2.win_pct))
            + kpi('Home side wins', fmtInt(m.home_side_wins), 'whichever team was at home')
            + kpi('Away side wins', fmtInt(m.away_side_wins), 'whichever team was on the road')
            + (sc ? kpi(m.team_1.team + ' avg', num(sc.avg_team_1), 'median ' + num(sc.median_team_1)) : '')
            + (sc ? kpi(m.team_2.team + ' avg', num(sc.avg_team_2), 'median ' + num(sc.median_team_2)) : '')
            + (sc ? kpi('Combined ' + esc(m.scoring_noun), num(sc.avg_combined), 'median ' + num(sc.median_combined)) : '')
            + (sc ? kpi('Avg margin', num(sc.avg_margin), 'either side') : '')
            + (cg ? kpi(esc(cg.label.split(':')[0]), fmtInt(cg.count), cg.pct + '% of the sample') : '')
            + (mk ? kpi(m.team_1.team + ' as favorite', esc(mk.favorite.record), mk.favorite.eligible_games + ' eligible') : '')
            + (mk ? kpi(m.team_1.team + ' as underdog', esc(mk.underdog.record), mk.underdog.eligible_games + ' eligible') : '')
            + (mk ? kpi(m.team_1.team + ' ATS', esc(mk.ats.record), mk.ats.eligible_games + ' eligible') : '')
            + (mk ? kpi('Over / under', esc(mk.over_under.record), mk.over_under.eligible_games + ' eligible') : '')
            + '</div>'
            + '<ul class="sum-lines">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>'
            + ((m.unavailable_readings || []).length
                ? '<div class="block-note"><strong>Not shown, and why</strong><ul>'
                    + m.unavailable_readings.map(function (u) {
                        return '<li>' + esc(u.reading) + ': ' + esc(u.reason) + '</li>';
                    }).join('') + '</ul></div>' : '')
            + '</section>';
    }

    function renderReport(res) {
        var d = res.result || res;
        var noun = SCORE_NOUN[d.sport] || 'points';
        var applied = d.filters_applied || [];
        var declined = d.filters_not_applied || [];
        var unavailable = d.unavailable_filters || [];
        var warnings = d.filter_warnings || [];
        var trail = (d.games_after_each_filter && d.games_after_each_filter.team_1) || [];

        var SCOPE_TEXT = {
            both: 'Conditions applied to both teams',
            team_1: 'Conditions applied to ' + (d.team_1 || 'team 1') + ' only',
            team_2: 'Conditions applied to ' + (d.team_2 || 'team 2') + ' only'
        };
        var context = [];
        if (d.scope) context.push(SCOPE_TEXT[d.scope] || ('Scope: ' + d.scope));
        context.push(d.sample_size_requested == null
            ? 'Sample: all qualifying games'
            : 'Sample: the ' + d.sample_size_requested + ' most recent qualifying games');
        var reqf = d.filters || {};
        if (reqf.date_from || reqf.date_to) {
            context.push('Date range: ' + (reqf.date_from || 'earliest on file') + ' to ' + (reqf.date_to || 'latest on file'));
        }
        if (d.data_through) context.push('Latest completed game in this sample: ' + d.data_through);

        // A shorthand landing on the wrong franchise must never be silent.
        var tr = d.team_resolution || {};
        var renamed = ['team_1', 'team_2'].filter(function (k) {
            return tr[k] && tr[k].requested && tr[k].resolved
                && String(tr[k].requested).trim() !== String(tr[k].resolved).trim();
        });
        var resolutionNote = renamed.length
            ? '<p class="note-s">Read as: ' + renamed.map(function (k) {
                return esc(tr[k].requested) + ' → <strong>' + esc(tr[k].resolved) + '</strong>';
            }).join(' · ') + '.</p>' : '';

        var STANDING = [d.disclaimer, 'Conditions combine with AND'];
        var notes = (d.notes || []).filter(function (n) {
            return !STANDING.some(function (s) { return s && String(n).indexOf(String(s).slice(0, 40)) === 0; });
        });

        var dc = d.data_completeness || null;
        var thin = (dc && dc.thin_readings) || [];
        var completeness = dc
            ? '<div class="block-note"><strong>Data behind this report</strong><ul class="cover">'
                + '<li>' + fmtInt(dc.games_in_dataset.team_1) + ' games on file for ' + esc(d.team_1) + ', '
                + fmtInt(dc.games_in_dataset.team_2) + ' for ' + esc(d.team_2) + ', '
                + fmtInt(dc.games_in_dataset.head_to_head) + ' meetings between them.</li>'
                + (dc.dataset_range && dc.dataset_range.from
                    ? '<li>Covering ' + esc(dc.dataset_range.from) + ' to ' + esc(dc.dataset_range.to)
                        + (dc.coverage_from ? '. Conditions are backed by ' + esc(d.sport) + ' data from '
                            + esc(dc.coverage_from) + ' onward.' : '.') + '</li>' : '')
                + ((dc.readings || []).length
                    ? '<li>' + dc.readings.map(function (r) {
                        return esc(r.filter) + ' on file for ' + hxPct(r.coverage_pct);
                    }).join(', ') + ' of those games.</li>' : '')
                + '</ul>'
                + (thin.length ? '<p class="note-s">' + thin.map(function (r) { return esc(r.note); }).join(' ') + '</p>' : '')
                + '</div>' : '';

        // What was searched, in words, plus the sample's own span. This is
        // the verification surface for the whole report: it is generated from
        // the values the query actually ran on, so a user can check that the
        // tool understood their choices before reading a single number.
        var qs = d.query_summary || null;
        var span = d.qualifying_span || null;
        var verify = qs
            ? '<div class="verify">'
                + '<p class="verify-text">' + esc(qs.text) + '</p>'
                + (span
                    ? '<p class="verify-span">' + esc(span.label) + '</p>'
                        + '<p class="note-s">Earliest matching game ' + esc(span.first_game)
                        + ' · latest ' + esc(span.last_game) + ' · ' + fmtInt(span.years_represented)
                        + ' year' + (span.years_represented === 1 ? '' : 's') + ' represented.</p>'
                    : '')
                + ((qs.conditions || []).length
                    ? '<ul class="verify-list">' + qs.conditions.map(function (c) {
                        return '<li>' + (c.applies_to_team
                            ? '<b>' + esc(c.applies_to_team) + '</b> ' : '') + esc(c.description)
                            + (c.unavailable_reason
                                ? ' <i>— not applied: ' + esc(c.unavailable_reason) + '</i>' : '')
                            + '</li>';
                    }).join('') + '</ul>' : '')
                + '</div>'
            : '';

        // A zero is an answer, not an error. It names the condition that
        // emptied the sample, because "remove a filter" is useless advice
        // without saying which one.
        var zero = d.zero_result
            ? '<div class="block-note is-warn zero"><strong>' + esc(d.zero_result.message) + '</strong>'
                + (d.zero_result.narrowest_filter
                    ? '<p>' + esc(d.zero_result.narrowest_filter.filter) + ' was the narrowest part of this query — '
                        + fmtInt(d.zero_result.narrowest_filter.games_before) + ' qualified before it, '
                        + fmtInt(d.zero_result.narrowest_filter.games_after) + ' after.</p>' : '')
                + '<div class="zero-acts">' + (d.zero_result.actions || []).map(function (a) {
                    return '<button type="button" class="zero-act" data-zero-action="' + esc(a.action) + '"'
                        + (a.filter_id ? ' data-zero-filter="' + esc(a.filter_id) + '"' : '') + '>'
                        + '<b>' + esc(a.label) + '</b><span>' + esc(a.detail) + '</span></button>';
                }).join('') + '</div></div>'
            : '';

        var head = '<section class="rcard is-head">'
            + '<div class="rcard-head"><h2>' + esc(d.team_1) + ' at ' + esc(d.team_2) + '</h2>'
            + '<span class="range">' + esc(d.sport) + '</span></div>'
            + verify + zero
            + '<div class="tags">'
            + (applied.length
                ? applied.map(function (a) { return '<span class="tag">' + esc(a) + '</span>'; }).join('')
                : '<span class="tag">No conditions — every completed game</span>')
            + '</div>'
            + (declined.length
                ? '<div class="block-note is-warn"><strong>Conditions requested but not applied</strong><ul>'
                    + declined.map(function (n) { return '<li>' + esc(n.filter) + ': ' + esc(n.reason) + '</li>'; }).join('')
                    + '</ul></div>' : '')
            // A qualifying count on its own is unreadable: 412 of 900 means
            // nothing until you know which condition removed the other 488.
            + (trail.length
                ? '<div class="block-note"><strong>How the sample narrowed</strong><div class="trailwrap">'
                    + '<table class="trail"><thead><tr><th>Condition</th><th class="n">Before</th>'
                    + '<th class="n">After</th><th class="n">Removed</th></tr></thead><tbody>'
                    + trail.map(function (t) {
                        return '<tr><td>' + esc(t.filter) + '</td><td class="n">' + fmtInt(t.games_before)
                            + '</td><td class="n">' + fmtInt(t.games_after) + '</td><td class="n">'
                            + (t.removed ? '−' + fmtInt(t.removed) : '0') + '</td></tr>';
                    }).join('')
                    + '</tbody></table></div><p class="note-s">Applied in this order, each to what the one above '
                    + 'it left. The first row opens at every game on file for this team, so the column accounts '
                    + 'for all of them.</p></div>' : '')
            + (unavailable.length
                ? '<div class="block-note is-warn"><strong>Not available for ' + esc(d.sport) + '</strong><ul>'
                    + unavailable.map(function (n) { return '<li>' + esc(n.filter) + ': ' + esc(n.reason) + '</li>'; }).join('')
                    + '</ul></div>' : '')
            + (warnings.length
                ? '<div class="block-note is-warn"><strong>Check these conditions</strong><ul>'
                    + warnings.map(function (w) { return '<li>' + esc(w.filter) + ': ' + esc(w.reason) + '</li>'; }).join('')
                    + '</ul></div>' : '')
            + (notes.length
                ? '<div class="block-note"><strong>About this sample</strong><ul>'
                    + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>' : '')
            + completeness
            + '<p class="note-s">' + context.map(esc).join(' · ') + '.</p>'
            + resolutionNote
            + '<p class="note-s">' + esc(d.disclaimer || 'Historical patterns do not guarantee future results.')
            + ' These are completed games that already met these conditions; a condition appearing alongside a '
            + 'result is not evidence it caused one.</p>'
            + receiptRow(res)
            + '</section>';

        var h2h = d.head_to_head;
        var h2hBlock = h2h
            ? '<section class="rcard"><div class="rcard-head"><h3>Head-to-head</h3>'
                + '<span class="range">Conditions above are not applied here</span></div><div class="kpis">'
                + '<div class="kpi"><span>Meetings</span><strong>' + esc(h2h.games_in_dataset) + '</strong></div>'
                + '<div class="kpi"><span>' + esc(d.team_1) + ' record</span><strong>'
                    + (h2h.record ? esc(h2h.record) : DASH) + '</strong></div>'
                + '<div class="kpi"><span>Win %</span><strong>' + hxPct(h2h.win_pct) + '</strong></div>'
                + '<div class="kpi"><span>ATS</span><strong>' + ((h2h.ats && h2h.ats.record) ? esc(h2h.ats.record) : DASH) + '</strong></div>'
                + '<div class="kpi"><span>Over / under</span><strong>' + ((h2h.ou && h2h.ou.record) ? esc(h2h.ou.record) : DASH) + '</strong></div>'
                + '<div class="kpi"><span>Avg margin</span><strong>' + signed(h2h.avg_margin) + '</strong></div>'
                + '<div class="kpi"><span>Avg total</span><strong>' + num(avgTotal(h2h.games)) + '</strong></div>'
                + '</div>' + thinNote(h2h) + '</section>' : '';

        return head + matchupSummary(d) + '<div class="two">' + teamSummary(d.team_1_report, noun) + teamSummary(d.team_2_report, noun) + '</div>'
            + h2hBlock
            + teamGames(d.team_1_report) + teamGames(d.team_2_report)
            + '<p class="method">Every record, average and percentage above is the plain arithmetic of the games '
            + 'listed, computed from BetLegend Pro’s graded-game database. Games with no final score are '
            + 'excluded; a game with no closing line on file shows a dash for role rather than an inferred value.</p>';
    }

    // ------------------------------------------------------ view switching
    function showSetup() {
        $('matchupForm').hidden = false;

        syncSetup();
        host.scrollIntoView({ behavior: 'smooth', block: 'start' });

    $('editSearch').addEventListener('click', showSetup);
    $('runAgain').addEventListener('click', function () {

    // -------------------------------------------------------------- submit
    var mLastSig = null, mLastKey = null;

    function currentPayload() {
        var tf = mTimeframe.value;
        var body = {
            sport: mSport.value, team_1: mAway.value, team_2: mHome.value,
            // null is meaningful to this endpoint: every qualifying game, still
            // bounded by the engine's own cap, which the report states.
            sample_size: (tf === 'all' || tf === 'custom') ? null : Number(tf)
        };
        if (tf === 'custom') {
            if (mDateFrom.value) body.date_from = mDateFrom.value;
            if (mDateTo.value) body.date_to = mDateTo.value;
        }
        var chosen = filterPayload();
        Object.keys(chosen).forEach(function (k) {
            body[k] = (k === 'min_rest_days') ? Number(chosen[k]) : chosen[k];
        });
        return body;
    }

    $('matchupForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        if (!syncSetup()) return;

        var payload = currentPayload();
        var sig = JSON.stringify(payload);
        // The same submission retried keeps its key, so a retry is never
        // charged twice; changing any condition mints a new one.
        var key = (sig === mLastSig && mLastKey) ? mLastKey : uuid();
        mLastSig = sig; mLastKey = key;
        payload.idempotency_key = key;

        var balanceBefore = Number(($('balanceValue').textContent || '').replace(/,/g, ''));
        if (!isFinite(balanceBefore)) balanceBefore = null;

        var label = mAway.value + ' at ' + mHome.value;
        var sub = mSport.value + ' · ' + timeframeLabel() + ' · '
            + activeFilterCount() + ' condition' + (activeFilterCount() === 1 ? '' : 's');

        hide($('mError'));
        mSubmit.disabled = true;
        $('mLoading').innerHTML = skeleton('report',
            'Pulling both teams’ histories and applying your conditions — 15 to 30 seconds…');
        $('mLoading').hidden = false;
        try {
            var res = await window.api.submitBetLegendProHistoricalMatchup(payload);
            mLastSig = null; mLastKey = null;
            $('mResult').innerHTML = renderReport(res);
            showResults(label, sub);
            await refreshStatus();
            loadLibrary();
        } catch (err) {
            await handleInquiryError(err, $('mError'), balanceBefore, 'matchup report');
        } finally {
            $('mLoading').hidden = true;
            mSubmit.disabled = false;
            syncSetup();
        }
    });

    async function handleInquiryError(err, target, balanceBefore, what) {
        var data = err && err.data;
        if (err && err.status === 402) {
            showNote(target, '<span><strong>Not enough TMR Coin.</strong> This costs ' + esc(data && data.cost)
                + ' and you have ' + esc(data && data.balance) + '. Get unlimited access and skip coin entirely, '
                + 'or earn more.</span><a class="btn is-primary" href="/betlegend-pro/#pricing">See plans</a>');
            await refreshStatus();
            return;
        }
        if (err && (err.status === 400 || err.status === 403)) {
            showNote(target, '<span>' + esc((data && data.error) || 'Check your inputs and try again.') + '</span>');
            await refreshStatus();
            return;
        }
        var after = await refreshStatus();
        if (balanceBefore != null && after != null && after < balanceBefore) {
            showNote(target, '<span><strong>The connection dropped while this was completing, and it looks like '
                + 'it went through</strong> — your balance fell by ' + esc(balanceBefore - after)
                + ' TMR Coin. Check your Library before running it again so you are not charged twice.</span>');
            loadLibrary();
        } else {
            showNote(target, '<span>BetLegend Pro could not complete this ' + esc(what) + ' ('
                + esc((data && data.error) || 'server error') + '). Nothing was charged — you can try again.</span>');
        }
    }

    // ---------------------------------------------- shared render helpers
    var UNAVAILABLE_RE = /^(not available|unavailable|no data|not carried|not in this dataset)/i;
    var CONF_PCT = { high: 80, medium: 55, low: 30 };

    function narrativeHtml(n, labels, keyOrder) {
        if (!n) return '';
        var html = '', missing = [];
        keyOrder.forEach(function (key) {
            var text = n[key];
            if (!text) return;
            if (UNAVAILABLE_RE.test(text)) { missing.push(labels[key]); return; }
            html += '<details class="sec"><summary>' + esc(labels[key]) + '</summary>'
                + '<div class="sec-body"><p>' + esc(text) + '</p></div></details>';
        });
        [['key_supporting_factors', 'Supporting factors'],
         ['risk_factors', 'Risk factors'],
         ['key_risk_factors', 'Risk factors']].forEach(function (l) {
            var arr = n[l[0]];
            if (!Array.isArray(arr) || !arr.length) return;
            html += '<details class="sec" open><summary>' + esc(l[1]) + '</summary><div class="sec-body"><ul>'
                + arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></details>';
        });
        if (missing.length) {
            html += '<div class="unavail"><strong>Not carried in this dataset:</strong> ' + esc(missing.join(', '))
                + '. These are left blank rather than estimated.</div>';
        }
        return html;
    }

    // ======================================================= ASK BETLEGEND
    var REPORT_SECTIONS = {
        matchup_overview: 'Matchup overview',
        odds_and_line_movement: 'Odds & line movement',
        starting_pitchers: 'Starting pitchers',
        projected_lineups: 'Projected lineups',
        injuries_rest_travel_weather_scheduling: 'Injuries, rest, travel & weather',
        recent_form: 'Recent form',
        home_away_and_situational_splits: 'Home/away & situational splits',

        advanced_stats_and_matchup_advantages: 'Advanced stats',

    function renderAsk(res) {
        var r = res.result || {}, rep = r.report || {};
        var cr = rep.confidence_rating || {};
        var confPct = typeof cr.score === 'number' ? Math.max(0, Math.min(100, cr.score)) : (CONF_PCT[cr.level] || 30);
        var reco = rep.best_bet_or_pass || '';
        var html = '<section class="verdict">'
            + '<div class="verdict-k">Recommendation</div>'
            + '<h2 class="verdict-label">' + esc(reco || 'No call') + '</h2>'
            + '<p class="verdict-sel">' + esc(r.interpreted_as || r.query || '')
            + (r.sport ? ' · ' + esc(r.sport) : '')
            + ((r.teams && r.teams.length) ? ' · ' + esc(r.teams.join(' vs ')) : '') + '</p>'
            + '<div class="verdict-k" style="margin-top:11px">Confidence · ' + esc(cr.level || '—')
            + (typeof cr.score === 'number' ? ' · ' + cr.score : '') + '</div>'
            + '<div class="meter"><i style="width:' + confPct + '%"></i></div>'
            + (cr.basis ? '<p class="verdict-sel">' + esc(cr.basis) + '</p>' : '')
            + (rep.recommended_line_and_max_price ? '<p class="verdict-sel">' + esc(rep.recommended_line_and_max_price) + '</p>' : '')
            + '</section>';
        var order = Object.keys(REPORT_SECTIONS).filter(function (k) {
            return k !== 'best_bet_or_pass' && k !== 'recommended_line_and_max_price';
        });
        html += narrativeHtml(Object.assign({}, rep), REPORT_SECTIONS, order);
        var sources = Array.isArray(rep.sources) ? rep.sources : [];
        var t = r.timing || {}, foot = [];
        if (sources.length) {
            foot.push('Sources: ' + sources.map(function (s) {
                return esc(s.label) + (s.timestamp ? ' (' + esc(s.timestamp) + ')' : '');
            }).join(' · '));
        }
        if (t.intent_seconds != null) {
            var total = [t.intent_seconds, t.gather_seconds, t.synthesis_seconds]
                .filter(function (v) { return v != null; }).reduce(function (x, y) { return x + y; }, 0);
            foot.push('Generated in ' + total.toFixed(1) + 's');
        }
        if (foot.length) html += '<p class="unavail">' + foot.join(' · ') + '</p>';
        return html + receiptRow(res);
    }

    // ==================================================== BANKROLL SIM
    var simSubmit = $('simSubmit');
    submitButtons.push(simSubmit);

    /** Live edge read-out: whether the user's own inputs even carry a positive
     *  expectation. Pure arithmetic on their two numbers — no dataset. */
    function updateEdgeNote() {
        var p = Number($('simProb').value) / 100;
        var odds = Number($('simOdds').value);
        var be = breakEven(odds);
        var note = $('simEdgeNote');
        if (!isFinite(p) || p <= 0 || p >= 1 || be == null) {
            note.className = 'note';
            note.textContent = 'Enter a win probability and a price to see the implied edge.';
            return;
        }
        var edge = p - be;
        note.className = 'note ' + (edge > 0 ? 'is-ok' : 'is-warn');
        note.innerHTML = '<span>At ' + esc(odds > 0 ? '+' + odds : odds) + ' you need to win <strong>' + pct(be)
            + '</strong> to break even. You entered <strong>' + pct(p) + '</strong> — '
            + (edge > 0
                ? 'an assumed edge of <strong>+' + pct(edge) + '</strong>. The simulation below shows how that plays out with variance.'
                : 'that is <strong>' + pct(Math.abs(edge)) + '</strong> below break-even, so this is a losing proposition at this price.')
            + '</span>';
    }
    ['simProb', 'simOdds'].forEach(function (id) { $(id).addEventListener('input', updateEdgeNote); });

    function validateSim() {
        var p = Number($('simProb').value), odds = $('simOdds').value;
        var pOk = Number.isInteger(p) && p >= 1 && p <= 99;
        var oOk = isValidAmericanOdds(odds);
        setFieldError($('simProbField'), !pOk);
        setFieldError($('simOddsField'), !oOk);
        return pOk && oOk;
    }

    var simLastKey = null, simLastSig = null;
    $('simForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        if (!validateSim()) return;
        hide($('simError')); hide($('simResult'));
        var winProb = Number($('simProb').value) / 100;
        var odds = Number($('simOdds').value);
        var bankroll = Number($('simBank').value) || undefined;
        var strategy = $('simStrategy').value;
        var sig = winProb + '|' + odds + '|' + bankroll + '|' + strategy;
        var key = (sig === simLastSig && simLastKey) ? simLastKey : uuid();
        simLastSig = sig; simLastKey = key;
        var balanceBefore = Number(($('balanceValue').textContent || '').replace(/,/g, ''));
        if (!isFinite(balanceBefore)) balanceBefore = null;
        simSubmit.disabled = true;
        $('simLoading').innerHTML = skeleton('kpis', 'Running simulated bet sequences…');
        $('simLoading').hidden = false;
        try {
            var res = await window.api.submitBetLegendProSimulation({
                win_probability: winProb, odds: odds, bankroll: bankroll, strategy: strategy, idempotency_key: key
            });
            simLastSig = null; simLastKey = null;
            var r = res.result || {}, out = r.results || {}, params = r.parameters || {};
            var kpis = [
                { v: '$' + fmtInt(Math.round(out.median_final_bankroll)), l: 'Median finish', h: 'The middle outcome — a better guide than the mean, which a few huge runs can drag upward.' },
                { v: '$' + fmtInt(Math.round(out.mean_final_bankroll)), l: 'Mean finish', h: 'Average across every simulated run.' },
                { v: pct(out.profit_probability), l: 'Finished ahead', h: 'Share of runs that ended above the starting bankroll.', tone: out.profit_probability >= 0.5 ? 'pos' : '' },
                { v: pct(out.bust_rate), l: 'Bust rate', h: 'Share of runs that lost the bankroll entirely.', tone: out.bust_rate > 0.05 ? 'neg' : '' },
                { v: (out.expected_roi > 0 ? '+' : '') + out.expected_roi.toFixed(1) + '%', l: 'Expected ROI', h: 'Return on total amount staked.', tone: out.expected_roi > 0 ? 'pos' : 'neg' },
                { v: pct(out.avg_max_drawdown), l: 'Avg max drawdown', h: 'Typical worst peak-to-trough fall along the way.', tone: out.avg_max_drawdown > 0.3 ? 'neg' : '' }
            ];
            $('simResult').innerHTML = '<section class="rcard"><div class="rcard-head"><h2>Simulation results</h2></div>'
                + '<p class="note-s" style="margin-top:0">' + esc((params.strategy || strategy).replace('_', ' '))
                + ' staking · ' + fmtInt(params.num_simulations) + ' simulated runs · '
                + esc(pct(winProb)) + ' assumed win rate at ' + esc(odds > 0 ? '+' + odds : odds) + '</p>'
                + '<div class="kpis-lg" style="margin-top:11px">' + kpis.map(function (k) {
                    return '<div class="kpi-lg"><div class="kpi-v' + (k.tone ? ' is-' + k.tone : '') + '">' + esc(k.v)
                        + '</div><div class="kpi-l">' + esc(k.l) + '</div><div class="kpi-h">' + esc(k.h) + '</div></div>';
                }).join('') + '</div>'
                + '<div class="unavail" style="margin-top:11px">These outcomes follow entirely from the win '
                + 'probability you supplied. BetLegend Pro does not verify that assumption — if it is wrong, '
                + 'so is everything above.</div>' + receiptRow(res) + '</section>';
            $('simResult').hidden = false;
            await refreshStatus();
            loadLibrary();
        } catch (err) {
            await handleInquiryError(err, $('simError'), balanceBefore, 'simulation');
        } finally {
            simSubmit.disabled = SUBMIT_BLOCKED;
            $('simLoading').hidden = true;
        }
    });

    // ====================================================== TEAM TRENDS
    var tSubmit = $('tSubmit'), tTeam = $('tTeam'), tSport = $('tSport');
    submitButtons.push(tSubmit);
    var trendCache = {};

    async function loadTrendTeams(sport) {
        tTeam.disabled = true;
        tTeam.innerHTML = '<option value="">Loading teams…</option>';
        tSubmit.disabled = true;
        try {
            var teams = trendCache[sport];
            if (!teams) {
                var r = await window.api.getBetLegendProTeams(sport);
                teams = (r && r.teams) || [];
                trendCache[sport] = teams;
            }
            if (tSport.value !== sport) return;
            tTeam.innerHTML = '<option value="">Select team…</option>' + teams.map(function (t) {
                return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
            }).join('');
        } catch (err) {
            if (tSport.value !== sport) return;
            tTeam.innerHTML = '<option value="">Unavailable — try again</option>';
        } finally {
            if (tSport.value === sport) { tTeam.disabled = false; syncTrendSubmit(); }
        }
    }
    function syncTrendSubmit() {
        var missing = !tTeam.value;
        tSubmit.disabled = missing || SUBMIT_BLOCKED;
        // Never a greyed button without a stated reason.
        if (SUBMIT_BLOCKED) {
            tSubmit.setAttribute('title', "Today's free report is used. A plan (or TMR Coin) is needed to run another one today.");
        } else if (missing) {
            tSubmit.setAttribute('title', 'Choose a team to search.');
        } else {
            tSubmit.removeAttribute('title');
        }
    }
    tSport.addEventListener('change', function () { loadTrendTeams(tSport.value); });
    tTeam.addEventListener('change', syncTrendSubmit);

    var tLastKey = null, tLastSig = null;
    $('trendForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        if (!tTeam.value) return;
        hide($('tError')); hide($('tResult'));
        var sport = tSport.value, team = tTeam.value, situation = $('tSituation').value;
        var sig = sport + '|' + team + '|' + situation;
        var key = (sig === tLastSig && tLastKey) ? tLastKey : uuid();
        tLastSig = sig; tLastKey = key;
        var balanceBefore = Number(($('balanceValue').textContent || '').replace(/,/g, ''));
        if (!isFinite(balanceBefore)) balanceBefore = null;
        tSubmit.disabled = true;
        $('tLoading').innerHTML = skeleton('kpis', 'Searching the graded-game dataset…');
        $('tLoading').hidden = false;
        try {
            var res = await window.api.submitBetLegendProInquiry({ sport: sport, team: team, situation: situation, idempotency_key: key });
            tLastSig = null; tLastKey = null;
            var r = res.result || {}, s = r.summary || {};
            var games = typeof r.total_games === 'number' ? r.total_games : 0;
            if (!games) {
                $('tResult').innerHTML = '<section class="rcard">' + emptyState('No games match that situation',
                    'The dataset holds no ' + sport + ' games for ' + team + ' in this situation, so there is nothing to report. You were not charged.') + '</section>';
            } else {
                var tiles = [];
                if (s.su_record) tiles.push({ v: s.su_record, l: 'Straight up', h: typeof s.su_win_pct === 'number' ? pct(s.su_win_pct) + ' win rate' : '' });
                if (s.ats_record) tiles.push({ v: s.ats_record, l: 'Against the spread', h: typeof s.ats_win_pct === 'number' ? pct(s.ats_win_pct) + ' cover rate' : '' });
                if (s.ou_record) tiles.push({ v: s.ou_record, l: 'Over / under', h: typeof s.over_pct === 'number' ? pct(s.over_pct) + ' went over' : '' });
                $('tResult').innerHTML = '<section class="rcard"><div class="rcard-head"><h2>' + esc(team) + ' — '
                    + esc(r.situation || situation) + '</h2></div>'
                    + '<p class="note-s" style="margin-top:0">' + esc(r.sport || sport) + ' · ' + fmtInt(games)
                    + ' games matched' + (res.note ? ' · ' + esc(res.note) : '') + '</p>'
                    + '<div class="kpis-lg" style="margin-top:11px">' + tiles.map(function (t) {
                        return '<div class="kpi-lg"><div class="kpi-v">' + esc(t.v) + '</div><div class="kpi-l">'
                            + esc(t.l) + '</div>' + (t.h ? '<div class="kpi-h">' + esc(t.h) + '</div>' : '') + '</div>';
                    }).join('') + '</div>' + receiptRow(res) + '</section>';
            }
            $('tResult').hidden = false;
            await refreshStatus();
            loadLibrary();
        } catch (err) {
            await handleInquiryError(err, $('tError'), balanceBefore, 'trend search');
        } finally {
            syncTrendSubmit();
            $('tLoading').hidden = true;
        }
    });

    // ========================================================== LIBRARY
    var KIND = {
        report: 'AI report', simulation: 'Simulation', inquiry: 'Team trends',
        matchup_report: 'Matchup', matchup_historical: 'Matchup'
    };
    var libLoading = false;

    async function loadLibrary() {
        if (libLoading) return;
        libLoading = true;
        var list = $('libList');
        if (!list.dataset.loadedOnce) {
            list.innerHTML = '<div class="skel">' + new Array(3).fill('<div class="skel-box" style="height:44px"></div>').join('') + '</div>';
        }
        try {
            var res = await window.api.getBetLegendProHistory(25);
            var items = res.items || [];
            list.dataset.loadedOnce = '1';
            if (!items.length) {
                list.innerHTML = emptyState('Nothing saved yet',
                    'Run a matchup report, a question or a simulation and it will be kept here — reopening one is always free.',
                    '<button class="btn is-primary" type="button" data-goto="matchup">Run your first report</button>');
                list.querySelectorAll('[data-goto]').forEach(function (b) {
                    b.addEventListener('click', function () { selectTool(b.dataset.goto, true); });
                });
                return;
            }
            list.innerHTML = '<div class="lib">' + items.map(function (it) {
                var when = it.created_at ? new Date(it.created_at).toLocaleString() : '';
                return '<div class="lib-item"><span class="lib-kind">' + esc(KIND[it.kind] || it.kind) + '</span>'
                    + '<div class="lib-main"><div class="lib-title" title="' + esc(it.title || '') + '">'
                    + esc(it.title || 'Untitled') + '</div><div class="lib-meta">' + esc(when)
                    + (it.ledger_entry_id ? ' · receipt #' + esc(it.ledger_entry_id) : ' · included in plan')
                    + '</div></div><button class="btn" data-lib-id="' + esc(it.id) + '" type="button">Open</button></div>';
            }).join('') + '</div>';
            list.querySelectorAll('[data-lib-id]').forEach(function (b) {
                b.addEventListener('click', function () { openLibraryItem(b.dataset.libId); });
            });
        } catch (err) {
            list.innerHTML = '<div class="note is-err"><span>Could not load your library.</span>'
                + '<button class="btn" type="button" id="libRetry">Retry</button></div>';
            var retry = $('libRetry');
            if (retry) retry.addEventListener('click', function () { delete list.dataset.loadedOnce; loadLibrary(); });
        } finally {
            libLoading = false;
        }
    }

    async function openLibraryItem(id) {
        var box = $('libDetail');
        box.innerHTML = skeleton('report', 'Opening saved item — this is a stored copy, nothing is charged…');
        box.hidden = false;
        try {
            var d = await window.api.getBetLegendProHistoryDetail(id);
            // Replayed through the exact renderer that produced it, so a
            // reopened report looks identical to the original.
            var fake = { result: d.result, included_in_plan: false, billed: false, was_free_inquiry: false, ledger_entry_id: null };
            var body;
            if (d.kind === 'matchup_historical') body = renderReport(fake);
            else if (d.kind === 'matchup_report') body = emptyState('Archived report',
                'This was produced by the previous bet-entry Matchup Analyzer, which has been replaced. Its stored figures are kept for your records but are not re-rendered here.');
            else if (d.kind === 'report') body = renderAsk(fake);
            else if (d.kind === 'simulation') {
                var out = (d.result && d.result.results) || {};
                body = '<section class="rcard"><div class="rcard-head"><h2>' + esc(d.title || 'Simulation') + '</h2></div>'
                    + '<div class="kpis-lg">' + [['$' + fmtInt(Math.round(out.median_final_bankroll)), 'Median finish'],
                        ['$' + fmtInt(Math.round(out.mean_final_bankroll)), 'Mean finish'],
                        [pct(out.profit_probability), 'Finished ahead'],
                        [pct(out.bust_rate), 'Bust rate'],
                        [(out.expected_roi > 0 ? '+' : '') + Number(out.expected_roi).toFixed(1) + '%', 'Expected ROI'],
                        [pct(out.avg_max_drawdown), 'Avg max drawdown']]
                        .map(function (k) { return '<div class="kpi-lg"><div class="kpi-v">' + esc(k[0]) + '</div><div class="kpi-l">' + esc(k[1]) + '</div></div>'; }).join('')
                    + '</div></section>';
            } else {
                var s = (d.result && d.result.summary) || {};
                body = '<section class="rcard"><div class="rcard-head"><h2>' + esc(d.title || 'Saved item') + '</h2></div>'
                    + '<div class="kpis-lg">' + [[s.su_record, 'Straight up'], [s.ats_record, 'Against the spread'], [s.ou_record, 'Over / under']]
                        .filter(function (k) { return k[0]; })
                        .map(function (k) { return '<div class="kpi-lg"><div class="kpi-v">' + esc(k[0]) + '</div><div class="kpi-l">' + esc(k[1]) + '</div></div>'; }).join('')
                    + '</div></section>';
            }
            box.innerHTML = '<div class="note is-ok"><span>Reopened from your library — not charged.</span></div>' + body;
        } catch (err) {
            box.innerHTML = '<div class="note is-err"><span>Could not open that saved item.</span></div>';
        }
    }

    // ============================================================= boot
    async function boot() {
        if (!(window.api && window.api.isLoggedIn())) {
            $('authGate').hidden = false;
            $('topbarRight').hidden = true;
            return;
        }
        $('app').hidden = false;
        selectTool((location.hash || '').replace('#', '') || 'matchup', false);
        renderCategories();
        syncSetup();
        updateEdgeNote();
        loadFilterLibrary(mSport.value);
        loadMatchupTeams(mSport.value);
        loadTrendTeams(tSport.value);
        await refreshStatus();
    }

    if (window.api) boot();
    else window.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
