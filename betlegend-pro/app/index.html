<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetLegend Pro Dashboard | TrustMyRecord</title>
    <!-- The dashboard is a private, per-account tool: nothing here is useful in
         search results, and the public sales page at /betlegend-pro/ is the
         indexable surface. noindex is correct for a logged-in app screen and is
         not an SEO suppression of public content. -->
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Run matchup reports, AI handicapping reports, bankroll simulations and team trend searches against BetLegend Pro's graded-game dataset.">
    <link rel="canonical" href="https://trustmyrecord.com/betlegend-pro/app/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tmr-sitewide.css?v=87b1b137e000">
    <style>
        /* The page canvas only. Everything the tool needs lives inside its
           shadow root and is styled by betlegend-pro/app/console.css.

           The tool is mounted in a shadow root on purpose. tmr-sitewide.css
           styles every bare input, select, button, p and h2 on the site with
           `!important` — dark control fills, a 14px pill radius, a cyan
           gradient on submit buttons, a muted grey on paragraphs. Anything
           sitting in the same tree has to out-shout all of that and loses
           somewhere new after every edit; that is what kept putting dark
           panels and unreadable text back on this screen. A shadow boundary
           ends it: site CSS cannot reach in and this tool cannot leak out.
           The global nav and footer are outside the boundary, unchanged. */
        html { background: #eef2f7; }
        body.tmr-site-shell[data-blp-console] {
            background: #eef2f7 !important;
            color-scheme: light;
        }
        #blpConsole { display: block; visibility: hidden; }
        #blpConsole.is-ready { visibility: visible; }
        #blpFallback {
            width: min(680px, calc(100% - 32px));
            margin: 48px auto; padding: 22px 24px;
            border: 1px solid #dde4ed; border-radius: 13px; background: #fff;
            font: 15px/1.55 "Segoe UI", system-ui, sans-serif; color: #3f4d5e;
        }
        #blpFallback h1 { margin: 0 0 8px; font-size: 20px; color: #0d1520; }
        #blpFallback a { color: #0d6e66; }
    </style>
    <script defer src="/static/js/tmr-terminology.js?v=366f6ce637b4"></script>
    <script defer src="/static/js/tmr-sitewide.js?v=ecdf489fce1e"></script>
</head>
<!-- `data-blp-console` is the styling hook rather than `data-tmr-route`:
     tmr-sitewide.js overwrites that attribute with the last path segment on
     every load, so this page reports itself as `app` and anything scoped to
     `betlegend-pro-app` silently matches nothing. A data attribute the script
     never touches survives. -->
<body class="tmr-site-shell" data-blp-console data-tmr-route="betlegend-pro-app">

<noscript>
    <div id="blpFallback">
        <h1>BetLegend Pro needs JavaScript</h1>
        <p>This dashboard runs in your browser against your TrustMyRecord account.
        Turn JavaScript on for trustmyrecord.com and reload, or read
        <a href="/betlegend-pro/">what BetLegend Pro does</a>.</p>
    </div>
</noscript>

<main id="blpConsole"></main>

<!-- ==================================================== the tool's markup ==
     Cloned into the shadow root at boot. Kept declarative here rather than
     built from strings in JS so the structure stays readable and diffable. -->
<template id="blpMarkup">

    <div class="shell">

        <header class="bar">
            <div class="brand">
                <div class="mark" aria-hidden="true">BL</div>
                <div>
                    <div class="brand-name">BetLegend Pro</div>
                    <p class="brand-sub">Situational analysis on graded games</p>
                </div>
            </div>
            <div class="bar-right" id="topbarRight" hidden>
                <span class="chip" id="planChip" hidden></span>
                <span class="chip" id="balanceChip" hidden>
                    <img src="/static/branding/tmr-coin/tmr-coin-logo.svg" alt="" aria-hidden="true">
                    <strong id="balanceValue">&mdash;</strong>&nbsp;TMR Coin
                </span>
                <a class="btn" id="manageBtn" href="/betlegend-pro/" hidden>Manage plan</a>
                <a class="btn is-primary" id="upgradeBtn" href="/betlegend-pro/#pricing" hidden>Get unlimited</a>
            </div>
        </header>

        <section class="card" id="authGate" hidden>
            <div class="card-body">
                <div class="empty">
                    <div class="empty-ico" aria-hidden="true">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <h3>Sign in to open BetLegend Pro</h3>
                    <p>Your reports, simulations and library are private to your TrustMyRecord account.</p>
                    <div class="row">
                        <a class="btn is-primary" href="/login/?next=/betlegend-pro/app/">Log in</a>
                        <a class="btn" href="/betlegend-pro/">What is BetLegend Pro?</a>
                    </div>
                </div>
            </div>
        </section>

        <div class="layout" id="app" hidden>

            <nav class="rail" role="tablist" aria-label="BetLegend Pro tools">
                <div class="rail-label">Tools</div>
                <button class="navbtn" role="tab" data-tool="matchup" aria-selected="true" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg>
                    <span>Matchup Report</span>
                </button>
                <button class="navbtn" role="tab" data-tool="ask" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 1 1-3.2-6.4"/><path d="M9.5 9a2.5 2.5 0 1 1 3.2 2.4c-.8.3-1.2.9-1.2 1.7v.4"/><path d="M11.5 17h.01"/></svg>
                    <span>Ask BetLegend</span>
                </button>
                <button class="navbtn" role="tab" data-tool="sim" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17c3-8 6 4 9-2s6 1 9-5"/><path d="M3 21h18"/></svg>
                    <span>Bankroll Simulator</span>
                </button>
                <button class="navbtn" role="tab" data-tool="trends" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <span>Team Trends</span>
                </button>
                <button class="navbtn" role="tab" data-tool="library" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9"/><path d="M18 6.5 20.4 18"/></svg>
                    <span>Library</span>
                </button>
            </nav>

            <div class="work">
                <div id="accountNotice"></div>
                <!-- One allowance bar for the whole product: the daily grant is
                     per account across every tool on the rail, not per tool. -->
                <div id="allowanceNotice"></div>

                <!-- ==================================== MATCHUP REPORT -->
                <section class="panel is-active" id="panel-matchup" role="tabpanel" aria-label="Matchup Report">

                    <nav class="prog" aria-label="Report progress">
                        <span class="prog-step is-on" data-step="matchup"><b>1</b>Matchup</span>
                        <span class="prog-sep" aria-hidden="true"></span>
                        <span class="prog-step" data-step="filters"><b>2</b>Filters</span>
                        <span class="prog-sep" aria-hidden="true"></span>
                        <span class="prog-step" data-step="results"><b>3</b>Results</span>
                        <span class="prog-spacer"></span>
                        <p class="prog-note" id="progNote">Pick a sport and two teams to begin</p>
                    </nav>

                    <form id="matchupForm" novalidate>
                        <section class="card">
                            <div class="card-head">
                                <h2>Matchup</h2>
                                <span class="spacer"></span>
                                <span class="meta">Graded games only</span>
                            </div>
                            <div class="card-body">
                                <div class="setup">
                                    <div class="field">
                                        <label class="lbl" for="mSport">Sport</label>
                                        <select class="sel" id="mSport">
                                            <option value="MLB">MLB</option>
                                            <option value="NHL">NHL</option>
                                            <option value="NBA">NBA</option>
                                            <option value="NFL">NFL</option>
                                        </select>
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mAway">Away team</label>
                                        <select class="sel" id="mAway" disabled><option value="">Loading&hellip;</option></select>
                                    </div>
                                    <div class="swapcol">
                                        <button class="swap" id="mSwap" type="button" aria-label="Swap away and home teams" title="Swap teams">&#8646;</button>
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mHome">Home team</label>
                                        <select class="sel" id="mHome" disabled><option value="">Loading&hellip;</option></select>
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mTimeframe">Timeframe</label>
                                        <select class="sel" id="mTimeframe">
                                            <option value="5">Last 5 qualifying games</option>
                                            <option value="10">Last 10 qualifying games</option>
                                            <option value="20" selected>Last 20 qualifying games</option>
                                            <option value="50">Last 50 qualifying games</option>
                                            <option value="100">Last 100 qualifying games</option>
                                            <option value="all">All qualifying games</option>
                                            <option value="custom">Custom date range&hellip;</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="dates" id="dateRow" hidden>
                                    <div class="field">
                                        <label class="lbl" for="mDateFrom">From date</label>
                                        <input class="inp" id="mDateFrom" type="date">
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mDateTo">To date</label>
                                        <input class="inp" id="mDateTo" type="date">
                                    </div>
                                </div>
                                <p class="err-line" id="setupErr" hidden></p>
                                <div class="note is-err" id="teamsErr" hidden>
                                    <span>Couldn't load the team list.</span>
                                    <button class="btn" id="teamsRetry" type="button">Retry</button>
                                </div>
                            </div>
                        </section>

                        <section class="card">
                            <div class="card-head">
                                <div class="ftools">
                                    <h2>Filters</h2>
                                    <span class="meta" id="filterCount">None</span>
                                    <span class="spacer"></span>
                                    <label class="sr" for="filterSearch">Search filters</label>
                                    <input class="search" id="filterSearch" type="search" placeholder="Search conditions&hellip;" autocomplete="off">
                                    <button class="linkbtn" id="collapseAll" type="button">Collapse all</button>
                                    <button class="linkbtn" id="clearAll" type="button" hidden>Clear all</button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="cats" id="cats"></div>
                                <div class="chosen" id="chosen" hidden></div>
                            </div>
                        </section>

                        <div class="runbar">
                            <p class="runsum" id="runSummary">Choose a sport and two different teams to continue.</p>
                            <button class="run" id="mSubmit" type="submit">
                                Run Matchup Report <span class="cost" data-cost></span>
                            </button>
                        </div>
                        <p class="review" id="review" hidden></p>
                        <!-- Sample-size feedback. Counts only, from the same
                             query the report runs, and free: a user must be
                             able to see that their combination leaves three
                             games BEFORE it costs them their daily report. -->
                        <div class="trail" id="trail" hidden aria-live="polite"></div>
                    </form>

                    <div id="resultsView" hidden>
                        <div class="resultbar">
                            <h2 class="resulttitle" id="resultTitle">Matchup report</h2>
                            <button class="btn" id="editSearch" type="button">&larr; Edit search</button>
                            <button class="btn is-primary" id="runAgain" type="button">Run again</button>
                        </div>
                        <div id="mResult"></div>
                    </div>

                    <div id="mLoading" hidden></div>
                    <div class="note is-err" id="mError" hidden></div>
                </section>

                <!-- ===================================== ASK BETLEGEND -->
                <section class="panel" id="panel-ask" role="tabpanel" aria-label="Ask BetLegend">
                    <form class="card" id="askForm" novalidate>
                        <div class="card-head">
                            <h2>Ask BetLegend</h2>
                            <p class="sub">One question, plain English. You get a structured report: form, situational splits with real sample sizes, market read, and a bet-or-pass call. Anything the dataset doesn't hold is labeled as unavailable rather than guessed.</p>
                        </div>
                        <div class="card-body">
                            <div class="field" id="askField">
                                <label class="lbl" for="askQuery">Your question</label>
                                <textarea class="ta" id="askQuery" maxlength="500" placeholder="Dodgers vs Padres tonight&#10;Are the Celtics profitable as home favorites?&#10;Best MLB bet today"></textarea>
                                <span class="errmsg">Type a question first.</span>
                            </div>
                            <div class="chips">
                                <button class="chipbtn" data-example="Dodgers vs Padres tonight" type="button">Try: a matchup</button>
                                <button class="chipbtn" data-example="Are the Celtics profitable as home favorites?" type="button">Try: a team situation</button>
                                <button class="chipbtn" data-example="Best MLB bet today" type="button">Try: today's board</button>
                            </div>
                            <div class="note is-warn" id="askClarify" hidden style="margin-top:12px"></div>
                            <div class="note is-err" id="askError" hidden style="margin-top:12px"></div>
                            <div class="submitrow">
                                <button class="run" id="askSubmit" type="submit">
                                    Generate report <span class="cost" data-cost></span>
                                </button>
                                <p class="submitnote">A clarification, a timeout or a failure always costs 0.</p>
                            </div>
                        </div>
                    </form>
                    <div id="askLoading" hidden></div>
                    <div id="askResult" hidden></div>
                </section>

                <!-- ================================ BANKROLL SIMULATOR -->
                <section class="panel" id="panel-sim" role="tabpanel" aria-label="Bankroll Simulator">
                    <form class="card" id="simForm" novalidate>
                        <div class="card-head">
                            <h2>Bankroll Simulator</h2>
                            <p class="sub">Scenario analysis, not a prediction. You supply the win probability you believe in and the price you're getting; BetLegend Pro runs thousands of bet sequences and reports the spread of outcomes. It does not check whether your probability is right.</p>
                        </div>
                        <div class="card-body">
                            <div class="grid2">
                                <div class="field" id="simProbField">
                                    <label class="lbl" for="simProb">Win probability (%)</label>
                                    <input class="inp" id="simProb" type="number" min="1" max="99" step="1" value="55">
                                    <span class="errmsg">Enter a whole number between 1 and 99.</span>
                                </div>
                                <div class="field" id="simOddsField">
                                    <label class="lbl" for="simOdds">American odds</label>
                                    <input class="inp" id="simOdds" type="number" step="1" value="-110">
                                    <span class="errmsg">American odds, like -110 or +150.</span>
                                </div>
                            </div>
                            <div class="grid2" style="margin-top:11px">
                                <div class="field">
                                    <label class="lbl" for="simBank">Starting bankroll <span class="opt">(optional)</span></label>
                                    <input class="inp" id="simBank" type="number" min="1" step="1" value="10000">
                                </div>
                                <div class="field">
                                    <label class="lbl" for="simStrategy">Staking strategy</label>
                                    <select class="sel" id="simStrategy">
                                        <option value="flat">Flat &mdash; 2% per bet</option>
                                        <option value="half_kelly">Half Kelly</option>
                                        <option value="kelly">Full Kelly</option>
                                    </select>
                                </div>
                            </div>
                            <p class="note" id="simEdgeNote" style="margin-top:12px"></p>
                            <div class="note is-err" id="simError" hidden></div>
                            <div class="submitrow">
                                <button class="run" id="simSubmit" type="submit">
                                    Run simulation <span class="cost" data-cost></span>
                                </button>
                                <p class="submitnote">Invalid inputs are rejected before anything is charged.</p>
                            </div>
                        </div>
                    </form>
                    <div id="simLoading" hidden></div>
                    <div id="simResult" hidden></div>
                </section>

                <!-- ======================================== TEAM TRENDS -->
                <section class="panel" id="panel-trends" role="tabpanel" aria-label="Team Trends">
                    <form class="card" id="trendForm" novalidate>
                        <div class="card-head">
                            <h2>Team Trends</h2>
                            <p class="sub">One team, one situation, the raw split &mdash; straight up, against the spread and over/under. No narrative, no synthesis.</p>
                        </div>
                        <div class="card-body">
                            <div class="grid2">
                                <div class="field">
                                    <label class="lbl" for="tSport">Sport</label>
                                    <select class="sel" id="tSport">
                                        <option value="MLB">MLB</option>
                                        <option value="NBA">NBA</option>
                                        <option value="NFL">NFL</option>
                                        <option value="NHL">NHL</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label class="lbl" for="tTeam">Team</label>
                                    <select class="sel" id="tTeam" disabled><option value="">Loading teams&hellip;</option></select>
                                </div>
                            </div>
                            <div class="field" style="margin-top:11px">
                                <label class="lbl" for="tSituation">Situation</label>
                                <select class="sel" id="tSituation">
                                    <option value="home_favorite">Home favorites</option>
                                    <option value="road_underdog">Road underdogs</option>
                                    <option value="after_loss">After a loss</option>
                                    <option value="after_win">After a win</option>
                                    <option value="three_game_win_streak">On a 3+ game win streak</option>
                                    <option value="three_game_losing_streak">On a 3+ game losing streak</option>
                                    <option value="division_rival">vs division rivals</option>
                                    <option value="rest_advantage">With a rest advantage (2+ days)</option>
                                    <option value="large_spread">Large spread (7+)</option>
                                    <option value="close_spread">Close spread (within 3)</option>
                                    <option value="home">Home games</option>
                                    <option value="away">Away games</option>
                                    <option value="as_favorite">As favorite</option>
                                    <option value="as_underdog">As underdog</option>
                                    <option value="conference">Conference games</option>
                                    <option value="day_game">Day games</option>
                                    <option value="night_game">Night games</option>
                                </select>
                            </div>
                            <div class="note is-err" id="tError" hidden style="margin-top:12px"></div>
                            <div class="submitrow">
                                <button class="run" id="tSubmit" type="submit" disabled>
                                    Search trends <span class="cost" data-cost></span>
                                </button>
                                <p class="submitnote">An empty or failed result always costs 0.</p>
                            </div>
                        </div>
                    </form>
                    <div id="tLoading" hidden></div>
                    <div id="tResult" hidden></div>
                </section>

                <!-- ============================================ LIBRARY -->
                <section class="panel" id="panel-library" role="tabpanel" aria-label="Library">
                    <div class="card">
                        <div class="card-head">
                            <h2>Library</h2>
                            <p class="sub">Every report and simulation you've run. Reopening one shows exactly what you got &mdash; it never calls BetLegend Pro again and never charges again.</p>
                        </div>
                        <div class="card-body"><div id="libList"></div></div>
                    </div>
                    <div id="libDetail" hidden></div>
                </section>
            </div>
        </div>
    </div>
</template>

<script src="/static/js/config.js?v=7e4b853bbb3d"></script>
<script src="/static/js/backend-api.js?v=c736c27862c5"></script>
<script>
(function () {
    'use strict';

    // ============================================================ mounting
    //
    // The whole tool lives in a shadow root. Site CSS cannot cross that
    // boundary, which is the only reliable way to keep this screen looking
    // like itself — see the note in <head>. Everything below therefore scopes
    // its lookups to `root`, never to `document`.

    var host = document.getElementById('blpConsole');
    var root = host.attachShadow({ mode: 'open' });

    var sheet = document.createElement('link');
    sheet.rel = 'stylesheet';
    sheet.href = '/betlegend-pro/app/console.css?v=20260805r';
    root.appendChild(sheet);
    root.appendChild(document.getElementById('blpMarkup').content.cloneNode(true));

    // Reveal only once the sheet has resolved, so the tool never flashes
    // unstyled. `error` counts as resolved: an unstyled tool that works beats
    // a blank rectangle, and the timeout is the backstop for both.
    var reveal = function () { host.classList.add('is-ready'); };
    if (sheet.sheet) reveal();
    else { sheet.addEventListener('load', reveal); sheet.addEventListener('error', reveal); }
    setTimeout(reveal, 3000);

    var $ = function (id) { return root.getElementById(id); };
    var $$ = function (sel) { return [].slice.call(root.querySelectorAll(sel)); };

    // ================================================================ utils

    function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    function uuid() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0;
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    }

    var fmtInt = function (n) { return typeof n === 'number' ? n.toLocaleString('en-US') : '—'; };
    var pct = function (n, d) { return (n * 100).toFixed(d == null ? 1 : d) + '%'; };

    function breakEven(odds) {
        if (typeof odds !== 'number' || !isFinite(odds)) return null;
        return odds < 0 ? (-odds) / (-odds + 100) : 100 / (odds + 100);
    }

    function isValidAmericanOdds(v) {
        if (v === '' || v == null) return false;
        var n = Number(v);
        return Number.isInteger(n) && (n <= -100 || n >= 100);
    }

    function setFieldError(fieldEl, on) {
        if (!fieldEl) return;
        fieldEl.classList.toggle('is-invalid', !!on);
        var c = fieldEl.querySelector('input, select, textarea');
        if (c) c.setAttribute('aria-invalid', on ? 'true' : 'false');
    }

    function showNote(el, html) { el.innerHTML = html; el.hidden = false; }
    function hide(el) { if (el) el.hidden = true; }

    function skeleton(kind, message) {
        var body = kind === 'kpis'
            ? '<div class="kpis-lg">' + new Array(6).fill('<div class="skel-box" style="margin:0"></div>').join('') + '</div>'
            : '<div class="skel"><div class="skel-line w40" style="height:22px"></div>'
                + '<div class="skel-line w60"></div><div class="skel-box"></div>'
                + '<div class="skel-line w80"></div><div class="skel-line w60"></div>'
                + '<div class="skel-line w80"></div></div>';
        return '<div class="skel-status"><span class="spin"></span>' + esc(message) + '</div>' + body;
    }

    function emptyState(title, body, actionHtml) {
        return '<div class="empty"><div class="empty-ico" aria-hidden="true">'
            + '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'
            + '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9"/></svg>'
            + '</div><h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>'
            + (actionHtml ? '<div class="row">' + actionHtml + '</div>' : '') + '</div>';
    }

    // ============================================================== state

    var ACCESS = { entitled: false, plan: null };
    var COST = { cost: 5, freeAvailable: false, resetsAt: null, balance: 0 };
    var submitButtons = [];
    var SUBMIT_BLOCKED = false;

    function costLabel() {
        if (ACCESS.entitled) return '· Included';
        if (COST.freeAvailable) return "· Today's free report";
        return '· ' + COST.cost + ' TMR Coin';
    }
    function paintCosts() {
        $$('[data-cost]').forEach(function (el) { el.textContent = costLabel(); });
    }

    function resetText() {
        if (!COST.resetsAt) return '';
        var d = new Date(COST.resetsAt);
        if (isNaN(d.getTime())) return '';
        return ' Your next one unlocks ' + d.toLocaleString([], {
            weekday: 'short', hour: 'numeric', minute: '2-digit'
        }) + ' your time.';
    }

    function paintAllowance() {
        var box = $('allowanceNotice');
        if (!box) return;
        if (ACCESS.entitled) {
            box.innerHTML = '<div class="note is-ok"><span><strong>Unlimited reports.</strong> '
                + 'Your plan covers every tool here — no TMR Coin is deducted and the daily '
                + 'free allowance does not apply to you.</span></div>';
            return;
        }
        if (COST.freeAvailable) {
            box.innerHTML = '<div class="note is-ok"><span><strong>Free report available today.</strong> '
                + '1 free report per day, shared across every BetLegend Pro tool. '
                + 'Use it on whichever one you want.</span></div>';
            return;
        }
        var canCoin = COST.balance >= COST.cost;
        box.innerHTML = '<div class="note is-warn"><span><strong>Today’s free report used.</strong> '
            + '1 free report per day, shared across every BetLegend Pro tool.' + esc(resetText()) + ' '
            + (canCoin
                ? 'Until then each report costs ' + esc(COST.cost) + ' TMR Coin, or go unlimited with a plan.'
                : 'You need an active plan (or ' + esc(COST.cost) + ' TMR Coin) to run another one today.')
            + '</span><button type="button" class="btn is-primary" id="allowanceSubscribe">Subscribe</button></div>';
        var btn = $('allowanceSubscribe');
        if (btn) btn.addEventListener('click', function () {
            try {
                var r = window.api && window.api.startBetLegendProCheckout
                    && window.api.startBetLegendProCheckout('monthly');
                if (r && typeof r.catch === 'function') {
                    r.catch(function () { window.location.href = '/betlegend-pro/#pricing'; });
                    return;
                }
                if (!r) window.location.href = '/betlegend-pro/#pricing';
            } catch (err) { window.location.href = '/betlegend-pro/#pricing'; }
        });
    }

    function billingPill(res) {
        if (res.included_in_plan) return '<span class="pill is-plan">Included in your plan</span>';
        if (res.was_free_inquiry) return '<span class="pill is-free">Free report</span>';
        if (res.billed) return '<span class="pill is-charged">Charged ' + esc(res.amount_charged) + ' TMR Coin</span>';
        return '<span class="pill">Not charged</span>';
    }

    function receiptRow(res) {
        var bits = [billingPill(res)];
        if (!res.included_in_plan && res.balance_after != null) {
            bits.push('<span>Balance ' + fmtInt(res.balance_before) + ' → ' + fmtInt(res.balance_after) + '</span>');
        }
        if (res.ledger_entry_id) {
            bits.push('<span>Receipt #' + esc(res.ledger_entry_id)
                + (res.was_replay ? ' · duplicate submission, not re-charged' : '')
                + ' · <a href="/wallet/">View in wallet</a></span>');
        }
        return '<div class="receipt">' + bits.join('') + '</div>';
    }

    async function refreshStatus() {
        try {
            var s = await window.api.getBetLegendProStatus();
            COST.cost = typeof s.cost === 'number' ? s.cost : 5;
            COST.freeAvailable = !!s.freeAvailable;
            COST.resetsAt = s.freeResetsAt || null;
            COST.balance = typeof s.balance === 'number' ? s.balance : 0;
            ACCESS = (s.access && typeof s.access === 'object') ? s.access : { entitled: false, plan: null };

            var planChip = $('planChip'), balanceChip = $('balanceChip');
            if (ACCESS.entitled) {
                // 'comp' is an owner grant, not a purchase — label it honestly
                // rather than showing it as a bought Lifetime plan.
                var planName = ACCESS.plan === 'comp' ? 'Owner'
                    : ACCESS.is_lifetime ? 'Lifetime'
                    : ACCESS.plan === 'annual' ? 'Annual' : ACCESS.plan === 'monthly' ? 'Monthly' : 'Pro';
                planChip.className = 'chip is-plan';
                planChip.innerHTML = '<strong>' + esc(planName) + '</strong>&nbsp;· unlimited';
                planChip.hidden = false;
                balanceChip.hidden = true;
                $('manageBtn').hidden = !ACCESS.manageable;
                $('upgradeBtn').hidden = true;
            } else {
                planChip.className = 'chip';
                planChip.textContent = COST.freeAvailable
                    ? 'Free report available today'
                    : "Today's free report used";
                planChip.hidden = false;
                balanceChip.hidden = false;
                $('balanceValue').textContent = fmtInt(s.balance);
                $('manageBtn').hidden = true;
                $('upgradeBtn').hidden = false;
            }
            $('topbarRight').hidden = false;

            var notice = $('accountNotice');
            notice.innerHTML = '';
            if (!ACCESS.entitled && s.isFrozen) {
                notice.innerHTML = '<div class="note is-warn"><span><strong>Your TMR Coin wallet is frozen.</strong> '
                    + 'Contact support before running a paid report — or get unlimited access and skip coin '
                    + 'entirely.</span><a class="btn" href="/betlegend-pro/#pricing">See plans</a></div>';
            } else if (!ACCESS.entitled && !s.eligible) {
                notice.innerHTML = '<div class="note is-warn"><span>This account isn’t eligible to run a '
                    + 'coin-billed report.</span></div>';
            }

            var allowanceSpent = !ACCESS.entitled && !COST.freeAvailable && s.balance < COST.cost;
            var blocked = !ACCESS.entitled && (s.isFrozen || !s.eligible || allowanceSpent);
            SUBMIT_BLOCKED = blocked;
            submitButtons.forEach(function (b) {
                // Account state may only ever ADD a reason to disable; a form
                // that has already gated its own button keeps it disabled.
                b.disabled = blocked || b.hasAttribute('data-incomplete');
                if (blocked) {
                    b.setAttribute('title', s.isFrozen
                        ? 'Your TMR Coin wallet is frozen, so a paid report cannot run.'
                        : allowanceSpent
                            ? "Today's free report is used. A plan (or TMR Coin) is needed to run another one today."
                            : 'This account is not eligible to run a coin-billed report.');
                } else if (b.getAttribute('title') && !b.hasAttribute('data-incomplete')) {
                    b.removeAttribute('title');
                }
            });

            paintCosts();
            paintAllowance();
            return typeof s.balance === 'number' ? s.balance : null;
        } catch (err) {
            $('balanceValue').textContent = '—';
            return null;
        }
    }

    // ========================================================= navigation

    var TOOL_PANEL = { matchup: 'panel-matchup', ask: 'panel-ask', sim: 'panel-sim', trends: 'panel-trends', library: 'panel-library' };

    function selectTool(tool, push) {
        if (!TOOL_PANEL[tool]) tool = 'matchup';
        $$('.navbtn').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tool === tool)); });
        Object.keys(TOOL_PANEL).forEach(function (k) {
            $(TOOL_PANEL[k]).classList.toggle('is-active', k === tool);
        });
        if (push && window.history && history.replaceState) history.replaceState(null, '', '#' + tool);
        if (tool === 'library') loadLibrary();
    }
    $$('.navbtn').forEach(function (b) {
        b.addEventListener('click', function () { selectTool(b.dataset.tool, true); });
    });

    // ================================================== MATCHUP RESEARCH

    var mSport = $('mSport'), mAway = $('mAway'), mHome = $('mHome');
    var mTimeframe = $('mTimeframe'), mDateFrom = $('mDateFrom'), mDateTo = $('mDateTo');
    var mSubmit = $('mSubmit');
    submitButtons.push(mSubmit);

    // Six ids exist both as a top-level request field (the original API) and as
    // an id in the filter library. Those must travel top-level.
    var LEGACY_IDS = {
        venue: 1, role: 1, opponent_type: 1, season_type: 1,
        head_to_head_only: 1, min_rest_days: 1
    };

    // The server groups its filters by the dataset field behind them; those are
    // engine concepts. These are the headings a handicapper thinks in. The
    // server stays the source of truth for what exists and what is honest for a
    // sport — an id it adds that is not named here lands in Advanced Filters
    // rather than disappearing.
    var CATEGORIES = [
        { id: 'matchup',     label: 'Matchup',            ids: ['venue', 'opponent_type', 'season_type'] },
        { id: 'market',      label: 'Betting Market',     ids: ['spread_range', 'moneyline_range', 'su_result', 'ats_result'] },
        { id: 'form',        label: 'Recent Form',        ids: ['prev_result', 'prev_margin', 'last10_win_pct'] },
        { id: 'schedule',    label: 'Schedule & Rest',    ids: ['min_rest_days', 'back_to_back', 'long_rest', 'nfl_week'] },
        { id: 'venue',       label: 'Venue & Travel',     ids: ['day_night', 'start_time', 'roof', 'surface', 'temperature', 'wind', 'attendance'] },
        { id: 'streaks',     label: 'Streaks',            ids: ['su_streak', 'ats_streak', 'ou_streak'] },
        { id: 'scoring',     label: 'Scoring',            ids: ['total_range', 'ou_result'] },
        { id: 'opponent',    label: 'Opponent Strength',  ids: ['role'] },
        { id: 'situational', label: 'Situational Trends', ids: ['day_of_week', 'month'] },
        { id: 'h2h',         label: 'Head-to-Head',       ids: ['head_to_head_only'] },
        { id: 'advanced',    label: 'Advanced Filters',   ids: [] }
    ];

    var library = null, libraryFor = null, libraryCache = {};
    var filters = {};
    var closedCats = {};       // open by default; this records what was shut
    var filterSearch = '';

    function isSet(v) {
        if (v === undefined || v === null || v === false || v === '' || v === 'any') return false;
        if (typeof v === 'object' && v.min == null && v.max == null) return false;
        return true;
    }
    function activeFilterCount() {
        return Object.keys(filters).filter(function (k) { return isSet(filters[k]); }).length;
    }
    function clearFilterId(id) {
        ['game', 't1', 't2'].forEach(function (b) { delete filters[fkey(b, id)]; });
    }

    function categorised() {
        if (!library) return [];
        var byId = {};
        (library.groups || []).forEach(function (g) {
            (g.filters || []).forEach(function (f) { byId[f.id] = f; });
        });
        var claimed = {};
        CATEGORIES.forEach(function (c) { c.ids.forEach(function (id) { claimed[id] = 1; }); });
        var q = filterSearch.toLowerCase();
        var matches = function (spec) {
            if (!q) return true;
            return spec.label.toLowerCase().indexOf(q) !== -1
                || (spec.help || '').toLowerCase().indexOf(q) !== -1;
        };
        return CATEGORIES.map(function (c) {
            var ids = c.id === 'advanced'
                ? Object.keys(byId).filter(function (id) { return !claimed[id]; })
                : c.ids;
            var live = [], off = [];
            ids.forEach(function (id) {
                var spec = byId[id];
                if (!spec) return;
                (spec.available ? live : off).push(spec);
            });
            return { id: c.id, label: c.label, live: live.filter(matches), off: off, liveAll: live };
        }).filter(function (c) {
            // While searching, what matters is what MATCHED. Otherwise a
            // category shows whenever this sport can actually run something in
            // it — a heading with nothing behind it reads as broken.
            return q ? c.live.length > 0 : c.liveAll.length > 0;
        });
    }

    // A condition is stored under a composite key: which side it is about,
    // then its id. 'game' conditions describe the game itself and read the
    // same from both sides; 't1'/'t2' describe one team going into it.
    //
    // Without this split the panel cannot express the query this tool exists
    // for -- "the Giants were on one day of rest AND the Dodgers were coming
    // off a loss" is two conditions on two different teams in the same game.
    function fkey(bucket, id) { return bucket + '|' + id; }
    function bktOf(key) { return key.split('|')[0]; }
    function idOf(key) { return key.split('|').slice(1).join('|'); }
    function bucketsFor(spec) { return spec.applies_to === 'game' ? ['game'] : ['t1', 't2']; }
    function teamName(bucket) {
        if (bucket === 't1') return mAway.value || 'Away team';
        if (bucket === 't2') return mHome.value || 'Home team';
        return '';
    }

    function renderControl(spec, bucket) {
        var key = fkey(bucket, spec.id);
        var v = filters[key];
        if (spec.kind === 'enum') {
            return '<select class="fsel" data-fid="' + esc(key) + '"><option value="">Any</option>'
                + spec.options.map(function (o) {
                    return '<option value="' + esc(o.value) + '"' + (v === o.value ? ' selected' : '')
                        + '>' + esc(o.label) + '</option>';
                }).join('') + '</select>';
        }
        if (spec.kind === 'bool') {
            var id = 'f-' + bucket + '-' + spec.id;
            return '<label class="fcheck' + (v === true ? ' is-on' : '') + '" for="' + id + '">'
                + '<input type="checkbox" id="' + id + '" data-fid="' + esc(key) + '"'
                + (v === true ? ' checked' : '') + '><span>Yes</span></label>';
        }
        if (spec.kind === 'int') {
            return '<input class="fnum" type="number" data-fid="' + esc(key) + '" data-bound="value" placeholder="Any"'
                + (spec.min != null ? ' min="' + spec.min + '"' : '')
                + (spec.max != null ? ' max="' + spec.max + '"' : '')
                + (v != null && v !== '' ? ' value="' + esc(v) + '"' : '') + '>';
        }
        if (spec.kind === 'text') {
            return '<input class="ftext" type="text" data-fid="' + esc(key) + '" data-bound="value" placeholder="Any"'
                + (v ? ' value="' + esc(v) + '"' : '') + '>';
        }
        var r = (v && typeof v === 'object') ? v : {};
        var attrs = (spec.min != null ? ' min="' + spec.min + '"' : '')
            + (spec.max != null ? ' max="' + spec.max + '"' : '')
            + (spec.step != null ? ' step="' + spec.step + '"' : '');
        return '<span class="frange">'
            + '<input class="fnum" type="number" data-fid="' + esc(key) + '" data-bound="min" placeholder="Min"'
            + attrs + (r.min != null ? ' value="' + esc(r.min) + '"' : '') + '>'
            + '<span class="fto">to</span>'
            + '<input class="fnum" type="number" data-fid="' + esc(key) + '" data-bound="max" placeholder="Max"'
            + attrs + (r.max != null ? ' value="' + esc(r.max) + '"' : '') + '>'
            + (spec.unit ? '<span class="funit">' + esc(spec.unit) + '</span>' : '')
            + '</span>';
    }

    function renderCategories() {
        var box = $('cats');
        if (!library) { box.innerHTML = '<p class="empty-note">Loading the condition library…</p>'; return; }
        var cats = categorised();
        if (!cats.length) {
            box.innerHTML = '<p class="empty-note">No condition matches that search.</p>';
            renderChosen();
            return;
        }
        box.innerHTML = cats.map(function (c) {
            var open = filterSearch ? true : !closedCats[c.id];
            var n = c.liveAll.reduce(function (acc, spec) {
                return acc + bucketsFor(spec).filter(function (b) {
                    return isSet(filters[fkey(b, spec.id)]);
                }).length;
            }, 0);
            var body = open
                ? '<div class="cat-body">'
                    + c.live.map(function (spec) {
                        var buckets = bucketsFor(spec);
                        // A team condition is asked once per team, each control
                        // under its own team's name. One shared control with a
                        // hidden "which side?" is exactly the ambiguity this
                        // panel exists to remove.
                        var controls = buckets.length === 1
                            ? renderControl(spec, buckets[0])
                            : '<div class="f-teams">' + buckets.map(function (b) {
                                return '<div class="f-team"><span class="f-team-name">'
                                    + esc(teamName(b)) + '</span>' + renderControl(spec, b) + '</div>';
                            }).join('') + '</div>';
                        return '<div class="f">'
                            + '<label class="f-lbl"'
                            + (spec.help ? ' title="' + esc(spec.help + (spec.era_note ? ' ' + spec.era_note : '')) + '"' : '')
                            + '>' + esc(spec.label) + '</label>'
                            + controls
                            + (spec.era_note ? '<p class="f-era">' + esc(spec.era_note) + '</p>' : '')
                            + '</div>';
                    }).join('')
                    // Named, never drawn as a dead control, never a paragraph of
                    // yellow. The reason for each is on its tooltip.
                    + (c.off.length && !filterSearch
                        ? '<p class="cat-off"><b>Not in ' + esc(mSport.value) + ' data</b>'
                            + c.off.map(function (s) {
                                return '<i title="' + esc(s.unavailable_reason || 'not carried for this sport')
                                    + '">' + esc(s.label) + '</i>';
                            }).join(', ') + '</p>'
                        : '')
                    + '</div>'
                : '';
            return '<section class="cat' + (open ? ' is-open' : '') + '" data-cat="' + esc(c.id) + '">'
                + '<button type="button" class="cat-head" aria-expanded="' + (open ? 'true' : 'false') + '">'
                + '<span class="caret" aria-hidden="true">▸</span>'
                + '<span class="cat-title">' + esc(c.label) + '</span>'
                + (n ? '<span class="cat-count">' + n + '</span>' : '')
                + '</button>' + body + '</section>';
        }).join('');
        renderChosen();
    }

    function chipFor(spec, v) {
        if (spec.kind === 'bool') return spec.label;
        if (spec.kind === 'enum') {
            for (var i = 0; i < spec.options.length; i++) {
                if (spec.options[i].value === v) return spec.label + ': ' + spec.options[i].label;
            }
            return spec.label + ': ' + v;
        }
        if (spec.kind === 'range') {
            if (v.min != null && v.max != null) return spec.label + ' ' + v.min + '–' + v.max;
            if (v.min != null) return spec.label + ' ' + v.min + '+';
            return spec.label + ' up to ' + v.max;
        }
        return spec.label + ': ' + v;
    }

    function specById(id) {
        if (!library) return null;
        var found = null;
        (library.groups || []).forEach(function (g) {
            (g.filters || []).forEach(function (f) { if (f.id === id) found = f; });
        });
        return found;
    }

    function renderChosen() {
        var picked = [];
        Object.keys(filters).forEach(function (key) {
            if (!isSet(filters[key])) return;
            var spec = specById(idOf(key));
            if (!spec) return;
            // The team prefix is not decoration: without it "1 day of rest"
            // reads as a property of the matchup rather than of one side.
            picked.push({
                id: key,
                team: teamName(bktOf(key)),
                label: chipFor(spec, filters[key])
            });
        });
        $('clearAll').hidden = picked.length === 0;
        $('filterCount').textContent = picked.length
            ? picked.length + (picked.length === 1 ? ' condition' : ' conditions') : 'None';
        var box = $('chosen');
        if (!picked.length) {
            box.hidden = true; box.innerHTML = '';
            syncSetup(); scheduleReview(); scheduleTrail();
            return;
        }
        var html = '<span class="chosen-lbl">Applied</span>' + picked.map(function (p) {
            return '<button type="button" class="tagx" data-remove="' + esc(p.id) + '">'
                + (p.team ? '<b class="tagx-team">' + esc(p.team) + '</b>' : '')
                + esc(p.label) + '<i aria-hidden="true">×</i><span class="sr"> — remove</span></button>';
        }).join('');
        // Only rewrite when the chips changed: clicking one blurs whatever
        // input had focus, which fires `change` BEFORE the click lands, and an
        // unconditional rewrite there replaces the very button being clicked.
        if (box.innerHTML !== html) box.innerHTML = html;
        box.hidden = false;
        syncSetup(); scheduleReview(); scheduleTrail();
    }

    // A catalogue call against the same registry the report uses: no engine
    // scan, no charge, no allowance. A contradiction should surface here rather
    // than after it has spent the user's one free report for the day.
    var reviewTimer = null, reviewSig = null;
    function scheduleReview() { clearTimeout(reviewTimer); reviewTimer = setTimeout(runReview, 300); }

    // ---- Live sample size -------------------------------------------------
    // POST /betlegend-pro/matchup-preview returns counts and the narrowing
    // trail, nothing else: no game list, no records, no averages. It is never
    // billed and never spends the daily free report, so it can run while the
    // user is still choosing.
    //
    // Debounced and signature-guarded: the engine scan is seconds, and a burst
    // of clicks must not queue a burst of scans or let a stale answer land on
    // top of a fresh one.
    var trailTimer = null, trailSig = null, lastPreview = null;

    function scheduleTrail() { clearTimeout(trailTimer); trailTimer = setTimeout(runTrail, 450); }

    function trailReady() {
        return mSport.value && mAway.value && mHome.value && mAway.value !== mHome.value;
    }

    async function runTrail() {
        var host = $('trail');
        if (!host) return;
        if (!trailReady()) { host.hidden = true; host.innerHTML = ''; trailSig = null; return; }
        var payload = currentPayload();
        var sig = JSON.stringify(payload);
        if (sig === trailSig) return;
        trailSig = sig;
        host.hidden = false;
        host.innerHTML = '<p class="trail-loading">Counting matching games…</p>';
        try {
            var pv = await window.api.previewBetLegendProHistoricalMatchup(payload);
            if (sig !== trailSig) return;      // a newer selection is in flight
            lastPreview = pv;
            paintTrail(pv);
        } catch (err) {
            if (sig !== trailSig) return;
            lastPreview = null;
            // An assist, never a gate: the report itself is still runnable.
            host.innerHTML = '<p class="trail-loading">Sample preview unavailable right now.</p>';
        }
    }

    function paintTrail(pv) {
        var host = $('trail');
        if (!host || !pv) return;
        var steps = pv.games_after_each_filter || [];
        var rows = '<li><span>All ' + esc(pv.team_1) + ' vs ' + esc(pv.team_2) + ' meetings</span>'
            + '<b>' + fmtInt(pv.total_meetings) + '</b></li>'
            + steps.map(function (st) {
                return '<li><span>' + esc(st.filter) + '</span><b>' + fmtInt(st.games_after)
                    + (st.removed > 0 ? '<i>&minus;' + fmtInt(st.removed) + '</i>' : '') + '</b></li>';
            }).join('');
        var span = (pv.first_game && pv.last_game)
            ? '<p class="trail-span">' + esc(pv.first_game) + ' through ' + esc(pv.last_game) + '</p>' : '';
        var warn = pv.small_sample_note
            ? '<p class="trail-warn">' + esc(pv.small_sample_note) + '</p>' : '';
        var notes = (pv.filters_not_applied || []).concat(pv.unavailable_filters || []);
        host.innerHTML = '<div class="trail-head"><span class="trail-lbl">Matching games</span>'
            + '<b class="trail-n">' + fmtInt(pv.qualifying_games)
            + '<i> of ' + fmtInt(pv.total_meetings) + ' meetings</i></b></div>'
            + '<ol class="trail-list">' + rows + '</ol>' + span + warn
            + (notes.length
                ? '<p class="trail-note">' + notes.map(function (n) {
                    return '<b>' + esc(n.filter) + ':</b> ' + esc(n.reason);
                }).join(' ') + '</p>' : '');
    }

    async function runReview() {
        var hostEl = $('review');
        if (!hostEl) return;
        var chosen = {};
        // The review endpoint takes filter ids, not the panel's bucketed keys.
        // A condition set on both teams is the same id twice, which the review
        // (conflicts and availability, both team-independent) reads identically.
        Object.keys(filters).forEach(function (k) { if (isSet(filters[k])) chosen[idOf(k)] = filters[k]; });
        var sig = mSport.value + '|' + JSON.stringify(chosen);
        if (sig === reviewSig) return;
        reviewSig = sig;
        if (!Object.keys(chosen).length) { hostEl.hidden = true; hostEl.innerHTML = ''; return; }
        try {
            var lib = await window.api.request(
                '/betlegend-pro/matchup-filters?sport=' + encodeURIComponent(mSport.value)
                + '&selected=' + encodeURIComponent(JSON.stringify(chosen)));
            if (sig !== reviewSig) return;
            paintReview(lib && lib.selection);
        } catch (err) {
            if (sig !== reviewSig) return;
            hostEl.hidden = true;      // an assist, never a gate
        }
    }

    function paintReview(sel) {
        var hostEl = $('review');
        if (!sel) { hostEl.hidden = true; hostEl.innerHTML = ''; return; }
        var flags = [];
        (sel.unavailable || []).forEach(function (u) {
            flags.push(esc(u.filter) + ' will not be applied for ' + esc(mSport.value) + ': ' + esc(u.reason));
        });
        (sel.conflicts || []).forEach(function (c) { flags.push(esc(c.filter) + ': ' + esc(c.reason)); });
        if (!flags.length) { hostEl.hidden = true; hostEl.innerHTML = ''; return; }
        hostEl.innerHTML = '<span class="review-flag">' + flags.join('<br>') + '</span>';
        hostEl.hidden = false;
    }

    async function loadFilterLibrary(sport) {
        if (libraryFor === sport && library) { renderCategories(); return; }
        libraryFor = sport;
        // One library per sport for the session: MLB -> NFL -> MLB refetched a
        // catalogue that cannot have changed and dropped the panel back to
        // "Loading…" each time.
        if (libraryCache[sport]) { library = libraryCache[sport]; renderCategories(); return; }
        library = null;
        renderCategories();
        try {
            var lib = await window.api.getBetLegendProMatchupFilters(sport);
            if (libraryFor !== sport) return;     // sport changed mid-flight
            libraryCache[sport] = lib;
            library = lib;
        } catch (err) {
            library = null;
            $('cats').innerHTML = '<p class="empty-note">The condition library could not be loaded, so only '
                + 'the unfiltered report is available right now.</p>';
            return;
        }
        renderCategories();
    }

    function setFilter(fid, bound, raw) {
        if (bound === 'min' || bound === 'max') {
            var cur = (filters[fid] && typeof filters[fid] === 'object') ? filters[fid] : {};
            var next = { min: cur.min, max: cur.max };
            next[bound] = (raw === '' || raw == null) ? null : Number(raw);
            if (next.min == null && next.max == null) delete filters[fid];
            else filters[fid] = next;
            return;
        }
        if (raw === '' || raw == null || raw === false) delete filters[fid];
        else filters[fid] = raw;
    }

    /** Repaint only the per-category counters. A full re-render on every
     *  keystroke would tear out the input being typed into. */
    function paintCatCounts() {
        categorised().forEach(function (c) {
            var head = $('cats').querySelector('[data-cat="' + c.id + '"] .cat-head');
            if (!head) return;
            var n = c.liveAll.filter(function (s) { return isSet(filters[s.id]); }).length;
            var badge = head.querySelector('.cat-count');
            if (n && !badge) head.insertAdjacentHTML('beforeend', '<span class="cat-count">' + n + '</span>');
            else if (n && badge) badge.textContent = n;
            else if (!n && badge) badge.remove();
        });
    }

    $('cats').addEventListener('change', function (ev) {
        var el = ev.target;
        if (!el || !el.getAttribute) return;
        var fid = el.getAttribute('data-fid');
        if (!fid) return;
        if (el.type === 'checkbox') {
            setFilter(fid, null, el.checked);
            var wrap = el.closest('.fcheck');
            if (wrap) wrap.classList.toggle('is-on', el.checked);
        } else {
            setFilter(fid, el.getAttribute('data-bound'), el.value);
        }
        renderChosen(); paintCatCounts();
    });

    $('cats').addEventListener('input', function (ev) {
        var el = ev.target;
        if (!el || !el.getAttribute) return;
        var fid = el.getAttribute('data-fid');
        if (!fid || el.type === 'checkbox' || el.tagName === 'SELECT') return;
        setFilter(fid, el.getAttribute('data-bound'), el.value);
        renderChosen(); paintCatCounts();
    });

    $('cats').addEventListener('click', function (ev) {
        var head = ev.target.closest && ev.target.closest('.cat-head');
        if (!head) return;
        var cid = head.parentNode.getAttribute('data-cat');
        closedCats[cid] = !closedCats[cid];
        renderCategories();
    });

    // The zero-result card's one-click ways out. Delegated on the report
    // host because the card is re-rendered with every report.
    document.addEventListener('click', function (ev) {
        var btn = ev.target.closest && ev.target.closest('[data-zero-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-zero-action');
        if (action === 'clear_filters') {
            filters = {};
        } else if (action === 'remove_filter') {
            var id = btn.getAttribute('data-zero-filter');
            if (!id) return;
            clearFilterId(id);
        } else {
            return;
        }
        renderCategories();
        showSetup();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $('chosen').addEventListener('click', function (ev) {
        var btn = ev.target.closest && ev.target.closest('[data-remove]');
        if (!btn) return;
        delete filters[btn.getAttribute('data-remove')];
        renderCategories();
    });

    $('filterSearch').addEventListener('input', function () {
        filterSearch = $('filterSearch').value.trim();
        renderCategories();
    });

    $('collapseAll').addEventListener('click', function () {
        var anyOpen = categorised().some(function (c) { return !closedCats[c.id]; });
        categorised().forEach(function (c) { closedCats[c.id] = anyOpen; });
        $('collapseAll').textContent = anyOpen ? 'Expand all' : 'Collapse all';
        renderCategories();
    });

    $('clearAll').addEventListener('click', function () {
        filters = {};
        filterSearch = '';
        $('filterSearch').value = '';
        renderCategories();
    });

    function filterPayload() {
        var body = {}, game = {}, t1 = {}, t2 = {};
        Object.keys(filters).forEach(function (key) {
            if (!isSet(filters[key])) return;
            var id = idOf(key), bucket = bktOf(key);
            // The six legacy ids are top-level request fields; the endpoint
            // reads them there and skips them in the library pass.
            if (LEGACY_IDS[id]) { body[id] = filters[key]; return; }
            if (bucket === 't1') t1[id] = filters[key];
            else if (bucket === 't2') t2[id] = filters[key];
            else game[id] = filters[key];
        });
        if (Object.keys(game).length) body.filters = game;
        if (Object.keys(t1).length) body.team_1_filters = t1;
        if (Object.keys(t2).length) body.team_2_filters = t2;
        return body;
    }

    mSport.addEventListener('change', function () {
        // A condition that exists for one sport may not for the next, so the
        // selection resets rather than carrying across silently.
        filters = {};
        filterSearch = '';
        $('filterSearch').value = '';
        reviewSig = null;
        $('review').hidden = true;
        loadFilterLibrary(mSport.value);
        loadMatchupTeams(mSport.value);
        syncSetup();
    });

    mTimeframe.addEventListener('change', function () {
        var custom = mTimeframe.value === 'custom';
        $('dateRow').hidden = !custom;
        if (!custom) { mDateFrom.value = ''; mDateTo.value = ''; }
        syncSetup();
    });
    [mDateFrom, mDateTo].forEach(function (el) {
        el.addEventListener('change', syncSetup);
        el.addEventListener('input', syncSetup);
    });

    function timeframeLabel() {
        var v = mTimeframe.value;
        if (v === 'custom') {
            if (mDateFrom.value && mDateTo.value) return mDateFrom.value + ' to ' + mDateTo.value;
            if (mDateFrom.value) return 'from ' + mDateFrom.value;
            if (mDateTo.value) return 'up to ' + mDateTo.value;
            return 'a custom date range';
        }
        if (v === 'all') return 'all qualifying games';
        return 'the last ' + v + ' qualifying games';
    }

    // --------------------------------------------------------------- teams
    var teamCache = {}, teamInFlight = {};
    var RETRY_MS = [800, 2000, 4000];

    function fetchTeams(sport) {
        if (teamCache[sport]) return Promise.resolve(teamCache[sport]);
        if (teamInFlight[sport]) return teamInFlight[sport];
        var attempt = function (i) {
            return window.api.getBetLegendProTeams(sport).then(function (r) {
                teamCache[sport] = (r && r.teams) || [];
                return teamCache[sport];
            }).catch(function (err) {
                if (i < RETRY_MS.length) {
                    return new Promise(function (r) { setTimeout(r, RETRY_MS[i]); })
                        .then(function () { return attempt(i + 1); });
                }
                throw err;
            });
        };
        var pr = attempt(0).finally(function () { delete teamInFlight[sport]; });
        teamInFlight[sport] = pr;
        return pr;
    }

    // Guarded against out-of-order responses: a slow NBA fetch resolving after
    // a newer NFL one must not repopulate the list with the wrong sport.
    async function loadMatchupTeams(sport) {
        [mAway, mHome].forEach(function (s) {
            s.disabled = true;
            s.innerHTML = '<option value="">Loading…</option>';
        });
        hide($('teamsErr'));
        try {
            var teams = await fetchTeams(sport);
            if (mSport.value !== sport) return;
            var opts = '<option value="">Select team…</option>' + teams.map(function (t) {
                return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
            }).join('');
            mAway.innerHTML = opts; mHome.innerHTML = opts;
            mAway.disabled = false; mHome.disabled = false;
        } catch (err) {
            if (mSport.value !== sport) return;
            [mAway, mHome].forEach(function (s) { s.innerHTML = '<option value="">Teams unavailable</option>'; });
            $('teamsErr').hidden = false;
        }
        syncSetup();
    }

    $('teamsRetry').addEventListener('click', function () {
        delete teamCache[mSport.value];
        loadMatchupTeams(mSport.value);
    });

    $('mSwap').addEventListener('click', function () {
        var a = mAway.value;
        mAway.value = mHome.value;
        mHome.value = a;
        syncSetup();
    });
    [mAway, mHome].forEach(function (s) {
        s.addEventListener('change', function () {
            // Team conditions are labelled with the team they measure, so a
            // team change has to relabel them. Without this the controls keep
            // saying "Away team" after a team is chosen -- a per-team control
            // whose team is not named is the ambiguity this panel removes.
            if (library) renderCategories();
            syncSetup();
        });
    });

    function setProgress(step) {
        var order = ['matchup', 'filters', 'results'];
        var at = order.indexOf(step);
        $$('.prog-step').forEach(function (el) {
            var i = order.indexOf(el.getAttribute('data-step'));
            el.classList.toggle('is-on', i === at);
            el.classList.toggle('is-done', i < at);
        });
    }

    /** One validator owns the error line, the run button, the summary and the
     *  progress rail, so those four can never disagree. */
    function syncSetup() {
        var away = mAway.value, home = mHome.value;
        var err = '';
        if (away && home && away === home) err = 'Away and home must be two different teams.';
        if (!err && mTimeframe.value === 'custom') {
            if (!mDateFrom.value && !mDateTo.value) err = 'Enter a from date, a to date, or both.';
            else if (mDateFrom.value && mDateTo.value && mDateFrom.value > mDateTo.value) {
                err = 'The from date must be on or before the to date.';
            }
        }
        var errEl = $('setupErr');
        errEl.textContent = err;
        errEl.hidden = !err;

        var ready = !!away && !!home && away !== home && !err;
        // The marker is what survives a status refresh; the disabled property
        // alone does not.
        if (ready) mSubmit.removeAttribute('data-incomplete');
        else mSubmit.setAttribute('data-incomplete', '');
        mSubmit.disabled = !ready || SUBMIT_BLOCKED;

        var n = activeFilterCount();
        var summary = $('runSummary');
        if (!ready) {
            summary.innerHTML = err ? esc(err) : 'Choose a sport and two different teams to continue.';
        } else if (SUBMIT_BLOCKED) {
            summary.textContent = 'Today’s free report is used. A plan (or TMR Coin) is needed to run another one today.';
        } else {
            summary.innerHTML = '<strong>' + esc(mSport.value) + '</strong> · ' + esc(away) + ' at '
                + esc(home) + ' · ' + esc(timeframeLabel()) + ' · <strong>' + n + '</strong> '
                + (n === 1 ? 'condition' : 'conditions') + (n ? ', combined with AND' : '');
        }

        var note = $('progNote');
        if ($('resultsView') && $('resultsView').hidden === false) {
            setProgress('results'); note.textContent = 'Report ready';
        } else if (ready) {
            setProgress('filters');
            note.textContent = n ? n + (n === 1 ? ' condition set' : ' conditions set') : 'Conditions are optional';
        } else {
            setProgress('matchup'); note.textContent = 'Pick a sport and two teams to begin';
        }
        return ready && !SUBMIT_BLOCKED;
        scheduleTrail();
    }

    // ------------------------------------------------------------- results
    var SCORE_NOUN = { MLB: 'runs', NHL: 'goals', NBA: 'points', NFL: 'points' };
    var DASH = '&mdash;';
    var THIN_SAMPLE = 8;

    function hxPct(v) { return (v === null || v === undefined) ? DASH : esc(v) + '%'; }
    function num(v) { return (v === null || v === undefined) ? DASH : esc(v); }
    function signed(v) {
        if (v === null || v === undefined) return DASH;
        return (v > 0 ? '+' : '') + esc(v);
    }

    /** Mean combined final score of the games listed beneath it. Not a server
     *  figure: the plain average of team_score + opponent_score over the same
     *  rows in the table, labelled as the final-score total so it is never
     *  mistaken for the average closing number. */
    function avgTotal(games) {
        var vals = (games || []).filter(function (g) {
            return typeof g.team_score === 'number' && typeof g.opponent_score === 'number';
        }).map(function (g) { return g.team_score + g.opponent_score; });
        if (!vals.length) return null;
        return Math.round((vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) * 10) / 10;
    }

    function funnelLine(r) {
        var inDataset = r.games_in_dataset;
        var qualified = (r.total_qualifying_games != null) ? r.total_qualifying_games : r.qualifying_games;
        var shown = (r.games || []).length;
        if (inDataset == null && qualified == null) return '';
        var bits = [];
        if (inDataset != null) bits.push('<span><strong>' + fmtInt(inDataset) + '</strong> games on file before filtering</span>');
        if (qualified != null) {
            bits.push('<span class="funnel-arrow" aria-hidden="true">→</span><span><strong>'
                + fmtInt(qualified) + '</strong> matched '
                + (r.conditions_applied === false ? 'no conditions (unfiltered side)' : 'your conditions') + '</span>');
        }
        bits.push('<span class="funnel-arrow" aria-hidden="true">→</span><span><strong>'
            + fmtInt(shown) + '</strong> listed below and used for every figure here</span>');
        return '<div class="funnel">' + bits.join('') + '</div>';
    }

    function splitsLine(r) {
        var out = [], ats = r.ats, ou = r.ou, trend = r.recent_trend;
        if (ats && ats.eligible_games) {
            out.push('<span><span class="split-l">ATS</span> <span class="split-v">' + esc(ats.record)
                + (ats.cover_pct != null ? ' (' + esc(ats.cover_pct) + '%)' : '') + '</span> · '
                + esc(ats.eligible_games) + ' graded</span>');
        }
        if (ou && ou.eligible_games) {
            out.push('<span><span class="split-l">O/U</span> <span class="split-v">' + esc(ou.record)
                + (ou.over_pct != null ? ' (' + esc(ou.over_pct) + '% over)' : '') + '</span> · '
                + esc(ou.eligible_games) + ' graded</span>');
        }
        if (trend && trend.label) {
            out.push('<span><span class="split-l">Recent</span> <span class="split-v">' + esc(trend.label) + '</span></span>');
        }
        if (r.home_games != null && r.away_games != null && (r.home_games || r.away_games)) {
            out.push('<span><span class="split-l">Split</span> <span class="split-v">' + esc(r.home_games)
                + ' home / ' + esc(r.away_games) + ' away</span></span>');
        }
        return out.length ? '<div class="splits">' + out.join('') + '</div>' : '';
    }

    function thinNote(r) {
        var games = (r.games || []).length;
        if (!games) return '';
        var bits = [];
        if (games < THIN_SAMPLE) {
            bits.push('<b>Small sample: ' + games + ' game' + (games === 1 ? '' : 's') + '.</b> '
                + 'Every percentage above is exact arithmetic on those ' + games + ' results, but one more '
                + 'win or loss moves it by about ' + Math.round(100 / games) + ' points. Read the game list '
                + 'rather than the rate — or widen the timeframe or drop a condition to build a bigger sample.');
        }
        if (r.sample_note) bits.push(esc(r.sample_note));
        return bits.length ? '<div class="thin"><span>' + bits.join(' ') + '</span></div>' : '';
    }

    /** The comparison half: the figures a handicapper reads side by side.
     *  Split from the game log because a nine-column table cannot fit in half
     *  a screen -- it was being clipped, and the game log IS the evidence the
     *  report exists to show. */
    function teamSummary(r, noun) {
        if (!r) return '';
        var range = r.date_range
            ? '<span class="range">' + esc(r.date_range.from) + ' → ' + esc(r.date_range.to) + '</span>' : '';
        var games = r.games || [];
        var total = (r.total_qualifying_games != null) ? r.total_qualifying_games : r.qualifying_games;
        return '<section class="rcard">'
            + '<div class="rcard-head"><h3>' + esc(r.team) + '</h3>' + range + '</div>'
            + '<div class="kpis">'
            + '<div class="kpi"><span>Record</span><strong>' + (r.record ? esc(r.record) : DASH) + '</strong></div>'
            + '<div class="kpi"><span>Win %</span><strong>' + hxPct(r.win_pct) + '</strong></div>'
            + '<div class="kpi"><span>ATS</span><strong>' + ((r.ats && r.ats.record) ? esc(r.ats.record) : DASH) + '</strong></div>'
            + '<div class="kpi"><span>Over / under</span><strong>' + ((r.ou && r.ou.record) ? esc(r.ou.record) : DASH) + '</strong></div>'
            + '<div class="kpi"><span>Avg score (' + esc(noun) + ')</span><strong>'
                + num(r.avg_scored) + ' – ' + num(r.avg_allowed) + '</strong></div>'
            + '<div class="kpi"><span>Avg margin</span><strong>' + signed(r.avg_margin) + '</strong></div>'
            + '<div class="kpi"><span>Avg total</span><strong>' + num(avgTotal(games)) + '</strong></div>'
            + '<div class="kpi"><span>Qualifying games</span><strong>' + esc(total) + '</strong></div>'
            + '</div>'
            + splitsLine(r) + funnelLine(r)
            + (r.conditions_applied === false
                ? '<p class="note-s">Your conditions were <strong>not</strong> applied to this team — the scope you chose targets the other side only.</p>'
                : '')
            + thinNote(r)
