<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetLegend Pro Dashboard | TrustMyRecord</title>
    <!-- The dashboard is a private, per-account tool: nothing here is useful in
         search results, and the public sales page at /betlegend-pro/ is the
         indexable surface. noindex is correct for a logged-in app screen and is
         not an SEO suppression of public content. -->
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Run matchup reports, AI handicapping reports, bankroll simulations and team trend searches against BetLegend Pro's graded-game dataset.">
    <link rel="canonical" href="https://trustmyrecord.com/betlegend-pro/app/">

    <!-- Installable app. The manifest and the worker both sit under
         /betlegend-pro/, so the worker's scope is that directory and it can
         never take control of the rest of TrustMyRecord. Installing gives a
         standalone window titled BetLegend Pro with the product's own monogram
         as its icon; the free tools and every other page are untouched.
         Signing in briefly leaves the scope (/login/ is site-wide), which the
         browser marks with its own minimal bar and which resolves as soon as
         the redirect lands back here. -->
    <link rel="manifest" href="/betlegend-pro/manifest.webmanifest">
    <meta name="theme-color" content="#0b5a54">
    <meta name="color-scheme" content="light">
    <meta name="application-name" content="BetLegend Pro">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BetLegend Pro">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/betlegend-pro/app/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tmr-sitewide.css?v=4b6bdc402218">
    <style>
        /* The page canvas only. Everything the tool needs lives inside its
           shadow root and is styled by betlegend-pro/app/console.css.

           The tool is mounted in a shadow root on purpose. tmr-sitewide.css
           styles every bare input, select, button, p and h2 on the site with
           `!important` — dark control fills, a 14px pill radius, a cyan
           gradient on submit buttons, a muted grey on paragraphs. Anything
           sitting in the same tree has to out-shout all of that and loses
           somewhere new after every edit; that is what kept putting dark
           panels and unreadable text back on this screen. A shadow boundary
           ends it: site CSS cannot reach in and this tool cannot leak out.
           The global nav and footer are outside the boundary, unchanged. */
        html { background: #eef2f7; }
        body.tmr-site-shell[data-blp-console] {
            background: #eef2f7 !important;
            color-scheme: light;
        }
        #blpConsole { display: block; visibility: hidden; }
        #blpConsole.is-ready { visibility: visible; }
        #blpFallback {
            width: min(680px, calc(100% - 32px));
            margin: 48px auto; padding: 22px 24px;
            border: 1px solid #dde4ed; border-radius: 13px; background: #fff;
            font: 15px/1.55 "Segoe UI", system-ui, sans-serif; color: #3f4d5e;
        }
        #blpFallback h1 { margin: 0 0 8px; font-size: 20px; color: #0d1520; }
        #blpFallback a { color: #0d6e66; }

        /* Installed as an app. The global nav stays -- it is how the wallet,
           pricing and account are reached, and removing it would strand the
           user. The site FOOTER does not: five columns of marketing links and
           a site map are a website's furniture, and in a standalone window
           they read as the app having accidentally embedded a web page. The
           legal line at the bottom of it is kept, because a wagering-research
           product may not quietly drop its disclaimer. */
        /* Embedded inside the product page (/betlegend-pro/?tool): the
           page around the tool is the product page itself, so the site
           header, footer, chat launcher and anything else a site script
           appends to <body> stay out of the frame. The tool posts its own
           height to the parent so the frame never scrolls on its own. */
        html.blp-embed, html.blp-embed body.tmr-site-shell[data-blp-console] {
            background: transparent !important;
            overflow: hidden;
            padding: 0 !important; margin: 0 !important;
        }
        html.blp-embed body > :not(#blpConsole):not(#blpMarkup):not(script):not(noscript) {
            display: none !important;
        }
        @media (display-mode: standalone) {
            body.tmr-site-shell[data-blp-console] .tmr-global-footer__grid,
            body.tmr-site-shell[data-blp-console] .tmr-global-footer__resources {
                display: none;
            }
            body.tmr-site-shell[data-blp-console] .tmr-global-footer { padding-top: 14px; }
        }
    </style>
    <script>
        // Embed mode is decided before any anchor exists: every link inside
        // the frame then opens in the page around it, never inside the box.
        (function () {
            if (!/(?:^|[?&])embed=1(?:&|$)/.test(location.search)) return;
            document.documentElement.classList.add('blp-embed');
            var base = document.createElement('base');
            base.target = '_top';
            document.head.appendChild(base);
        }());
    </script>
    <script defer src="/static/js/tmr-terminology.js?v=366f6ce637b4"></script>
    <script defer src="/static/js/tmr-sitewide.js?v=33a5257cc7a9"></script>
<!-- The one approved navbar: the shared header component (tmr-ds-nav.js)
     plus the homepage's own navbar rules, so every page renders the same bar. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/static/css/tmr-navbar.css?v=68ec3081d29a">
<link rel="stylesheet" href="/static/css/tmr-ds.d4d41a955166.css">
<link rel="stylesheet" href="/static/css/tmr-ds-header.4de36f3898ee.css">
</head>
<!-- `data-blp-console` is the styling hook rather than `data-tmr-route`:
     tmr-sitewide.js overwrites that attribute with the last path segment on
     every load, so this page reports itself as `app` and anything scoped to
     `betlegend-pro-app` silently matches nothing. A data attribute the script
     never touches survives. -->
<body class="tmr-site-shell tmr-ds-shell tmr-theme-a" data-blp-console data-tmr-route="betlegend-pro-app">

<noscript>
    <div id="blpFallback">
        <h1>BetLegend Pro needs JavaScript</h1>
        <p>This dashboard runs in your browser against your TrustMyRecord account.
        Turn JavaScript on for trustmyrecord.com and reload, or read
        <a href="/betlegend-pro/">what BetLegend Pro does</a>.</p>
    </div>
</noscript>

<main id="blpConsole"></main>

<!-- ==================================================== the tool's markup ==
     Cloned into the shadow root at boot. Kept declarative here rather than
     built from strings in JS so the structure stays readable and diffable. -->
<template id="blpMarkup">

    <div class="shell">

        <header class="bar">
            <div class="brand">
                <div class="mark" aria-hidden="true">BL</div>
                <div>
                    <div class="brand-name">BetLegend Pro</div>
                    <p class="brand-sub">Situational analysis on graded games</p>
                </div>
            </div>
            <div class="bar-right" id="topbarRight" hidden>
                <span class="chip" id="planChip" hidden></span>
                <span class="chip" id="balanceChip" hidden>
                    <img src="/static/branding/tmr-coin/tmr-coin-logo.svg" alt="" aria-hidden="true">
                    <strong id="balanceValue">&mdash;</strong>&nbsp;TMR Coin
                </span>
                <a class="btn" id="manageBtn" href="/betlegend-pro/" hidden>Manage plan</a>
                <a class="btn is-primary" id="upgradeBtn" href="/betlegend-pro/#pricing" hidden>Get unlimited</a>
                <!-- Revealed only when the browser has actually offered an
                     install, and removed the moment one happens. A dead
                     "Install" button on a platform that cannot install, or on a
                     window that already is the app, is worse than none. -->
                <button class="btn" id="installBtn" type="button" hidden>Install app</button>
            </div>
        </header>

        <!-- ============================================== INTRODUCTION ==
             What the tool is, which years it holds, and how to drive it --
             above the tool because a user who has just arrived is asking
             those three questions and nothing else. Kept to one band: the
             coverage table and the steps sit side by side on desktop and
             stack on mobile, so the tool itself stays near the top of the
             page. Every year shown is measured from the loaded database
             (GET matchup-filters -> coverage_all); nothing here is written
             into the markup. -->
            <section class="intro" id="intro">
                <div class="intro-lede">
                    <h1 class="intro-title">BetLegend Pro <span>Historical Matchup Research</span></h1>
                    <p>Pick two teams, choose the years, add a situation if you like, and see how
                    they actually played each other. Graded games only &mdash; research, never a
                    prediction.</p>
                </div>

                <div class="intro-grid">
                    <section class="intro-block intro-cover">
                        <p class="intro-h">Years on file</p>
                        <ul class="cover-table" id="coverTable">
                            <li class="cover-row"><span>Reading the database&hellip;</span></li>
                        </ul>
                        <p class="intro-note" id="coverActive"></p>
                    </section>

                    <!-- Closed by default at every width: the tool is the
                         page, the steps are there for whoever wants them. -->
                    <details class="intro-block intro-block-wide how-wrap" id="howWrap">
                        <summary class="intro-h how-summary">How it works<span class="how-toggle" aria-hidden="true"></span></summary>
                        <ol class="how">
                            <li><b>1</b><span><strong>Pick the sport.</strong> The years on file for it
                                are shown above.</span></li>
                            <li><b>2</b><span><strong>Pick the matchup.</strong> Away team, where the games
                                were played, home team.</span></li>
                            <li><b>3</b><span><strong>Choose the years.</strong> Everything
                                <em id="howSince">since the first year on file</em>, one season, or an
                                exact date range.</span></li>
                            <li><b>4</b><span><strong>Add situations, if you want.</strong> With none you
                                get <strong>every</strong> meeting in that period. Each one you add narrows
                                the sample: <span id="howExamples">coming off a win or a loss, win and
                                losing streaks, days of rest, previous-game scoring, moneyline range</span>.</span></li>
                            <li><b>5</b><span><strong>Run the report.</strong> Both teams' records, win
                                percentage, scoring, and the exact games that qualified.</span></li>
                        </ol>
                        <p class="intro-note"><strong>Sample size matters.</strong> Every situation you add
                        makes the sample smaller. 7-1 and 70-10 are not the same evidence, so read the
                        qualifying count next to any record before you lean on it.</p>
                    </details>
                </div>
            </section>

        <section class="card" id="authGate" hidden>
            <div class="card-body">
                <div class="empty">
                    <div class="empty-ico" aria-hidden="true">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <h3>Sign in to open BetLegend Pro</h3>
                    <p>Your reports, simulations and library are private to your TrustMyRecord account.</p>
                    <div class="row">
                        <a class="btn is-primary" href="/login/?next=/betlegend-pro/app/">Log in</a>
                        <a class="btn" href="/betlegend-pro/">What is BetLegend Pro?</a>
                    </div>
                </div>
            </div>
        </section>

        <div class="layout" id="app" hidden>

            <nav class="rail" role="tablist" aria-label="BetLegend Pro tools">
                <div class="rail-label">Tools</div>
                <button class="navbtn" role="tab" data-tool="matchup" aria-selected="true" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg>
                    <span>Matchup Report</span>
                </button>
                <button class="navbtn" role="tab" data-tool="ask" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 1 1-3.2-6.4"/><path d="M9.5 9a2.5 2.5 0 1 1 3.2 2.4c-.8.3-1.2.9-1.2 1.7v.4"/><path d="M11.5 17h.01"/></svg>
                    <span>Ask BetLegend</span>
                </button>
                <button class="navbtn" role="tab" data-tool="sim" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17c3-8 6 4 9-2s6 1 9-5"/><path d="M3 21h18"/></svg>
                    <span>Bankroll Simulator</span>
                </button>
                <button class="navbtn" role="tab" data-tool="trends" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <span>Team Trends</span>
                </button>
                <button class="navbtn" role="tab" data-tool="library" aria-selected="false" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9"/><path d="M18 6.5 20.4 18"/></svg>
                    <span>Library</span>
                </button>
            </nav>

            <div class="work">
                <div id="accountNotice"></div>
                <!-- One allowance bar for the whole product: the daily grant is
                     per account across every tool on the rail, not per tool. -->
                <div id="allowanceNotice"></div>

                <!-- ==================================== MATCHUP REPORT -->
                <section class="panel is-active" id="panel-matchup" role="tabpanel" aria-label="Matchup Report">

                    <nav class="prog" aria-label="Report progress">
                        <span class="prog-step is-done" data-step="sport"><b>1</b>Sport</span>
                        <span class="prog-sep" aria-hidden="true"></span>
                        <span class="prog-step is-on" data-step="matchup"><b>2</b>Matchup</span>
                        <span class="prog-sep" aria-hidden="true"></span>
                        <span class="prog-step" data-step="period"><b>3</b>Period</span>
                        <span class="prog-sep" aria-hidden="true"></span>
                        <span class="prog-step" data-step="filters"><b>4</b>Situations</span>
                        <span class="prog-sep" aria-hidden="true"></span>
                        <span class="prog-step" data-step="results"><b>5</b>Results</span>
                        <span class="prog-spacer"></span>
                        <p class="prog-note" id="progNote">Pick a sport and two teams to begin</p>
                    </nav>

                    <form id="matchupForm" novalidate>
                        <!-- ============================================ 1. MATCHUP ==
                             The two teams ARE the query. Away and home are named
                             outright and read back in a full sentence underneath:
                             "at" is the standard notation but must never be the only
                             place the meaning lives. -->
                        <section class="card is-sport" id="sportCard">
                            <div class="card-body">
                                <h2><span class="step-n" aria-hidden="true">1</span>Sport</h2>
                                <div class="sportpick" id="sportPick" role="group" aria-label="Sport"></div>
                                <div class="field sport-native">
                                    <label class="lbl" for="mSport">Sport</label>
                                    <select class="sel" id="mSport">
                                        <option value="MLB">MLB</option>
                                        <option value="NHL">NHL</option>
                                        <option value="NBA">NBA</option>
                                        <option value="NFL">NFL</option>
                                    </select>
                                </div>
                            </div>
                        </section>

                        <section class="card" id="matchupCard">
                            <div class="card-head">
                                <h2><span class="step-n" aria-hidden="true">2</span>Matchup</h2>
                                <span class="tag is-req">Required</span>
                                <span class="spacer"></span>
                                <span class="meta">Graded games only</span>
                            </div>
                            <div class="card-body">
                                <div class="setup setup-teams">
                                    <div class="field">
                                        <label class="lbl" for="mAway">Away team</label>
                                        <select class="sel" id="mAway" disabled><option value="">Loading&hellip;</option></select>
                                    </div>
                                    <div class="swapcol">
                                        <select class="sel venuesel" id="mVenue" aria-label="Where the games were played">
                                            <option value="away" selected>at</option>
                                            <option value="home">vs</option>
                                            <option value="all">at or vs</option>
                                        </select>
                                        <button class="swap" id="mSwap" type="button" aria-label="Swap the away and home teams" title="Swap teams">&#8646;</button>
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mHome">Home team</label>
                                        <select class="sel" id="mHome" disabled><option value="">Loading&hellip;</option></select>
                                    </div>
                                </div>
                                <p class="orient" id="orientRead" aria-live="polite">Choose an away team and a home team.</p>
                                <p class="err-line" id="setupErr" hidden></p>
                                <p class="cleared" id="sportNote" role="status" hidden></p>
                                <div class="note is-err" id="teamsErr" hidden>
                                    <span>Couldn't load the team list.</span>
                                    <button class="btn" id="teamsRetry" type="button">Retry</button>
                                </div>
                            </div>
                        </section>

                        <!-- ================================== 2. HISTORICAL PERIOD ==
                             Years, never a game count. Every option is built from the
                             era the database actually holds for the selected sport, so
                             this list can never offer a season that is not on file. The
                             result limit is a SEPARATE control below it, and it trims
                             the list only. -->
                        <section class="card">
                            <div class="card-head">
                                <h2><span class="step-n" aria-hidden="true">3</span>Period</h2>
                                <span class="tag is-req">Required</span>
                                <span class="spacer"></span>
                                <span class="meta" id="coverMeta"></span>
                            </div>
                            <div class="card-body">
                                <p class="cover" id="coverLine">Reading database coverage&hellip;</p>
                                <div class="setup setup-2">
                                    <div class="field">
                                        <label class="lbl" for="mTimeframe">Search period</label>
                                        <select class="sel" id="mTimeframe" aria-describedby="periodLoading">
                                            <option value="all" selected>All available history</option>
                                            <option value="custom">Custom date range&hellip;</option>
                                        </select>
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mLimit">Result limit (optional)</label>
                                        <select class="sel" id="mLimit">
                                            <option value="all" selected>Every qualifying meeting in the period</option>
                                            <option value="10">Most recent 10 qualifying meetings</option>
                                            <option value="20">Most recent 20 qualifying meetings</option>
                                            <option value="50">Most recent 50 qualifying meetings</option>
                                            <option value="100">Most recent 100 qualifying meetings</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="dates" id="dateRow" hidden>
                                    <div class="field">
                                        <label class="lbl" for="mDateFrom">From date</label>
                                        <input class="inp" id="mDateFrom" type="date">
                                    </div>
                                    <div class="field">
                                        <label class="lbl" for="mDateTo">To date</label>
                                        <input class="inp" id="mDateTo" type="date">
                                    </div>
                                </div>
                                <p class="note-s" id="periodLoading" hidden>Reading the seasons on file for this
                                sport&hellip; the period options appear as soon as the coverage lands.</p>
                                <p class="note-s">The limit trims the game list only. Records and averages
                                always use every qualifying meeting.</p>
                            </div>
                        </section>

                        <!-- ============================== 3. SITUATIONAL FILTERS ==
                     Three plain areas, one per thing a situation can be
                     about: the away team, the home team, the game itself.
                     Clicking a team's area reveals, in plain English, the
                     situations the database can answer for that team; the
                     ones added sit right under that team's name. Nothing is
                     a form to fill in: a matchup with no situations is a
                     complete query, and the panel reads that way.

                     The locked state is STATED, not merely disabled. -->
                <section class="card" id="sitCard">
                    <div class="card-head">
                        <div class="ftools">
                                    <h2><span class="step-n" aria-hidden="true">4</span>Situations</h2>
                                    <span class="tag">Optional</span>
                                    <span class="meta" id="filterCount">None</span>
                            <span class="spacer"></span>
                            <button class="linkbtn" id="clearAll" type="button" hidden>Remove all</button>
                        </div>
                    </div>
                    <div class="card-body">
                                <p class="note-s" id="condIntro">Optional. Leave this empty to include <strong>every</strong> meeting in
                                    the period, or add situations for either team or for the game itself.</p>
                        <div class="condlock" id="addCondHint">
                            <span class="condlock-i" aria-hidden="true">&#128274;</span>
                            <span class="condlock-t">Pick both teams above to add situations.</span>
                        </div>
                        <div class="sitareas" id="sitAreas">
                            <section class="sitarea" data-bucket="t1">
                                <button class="sit-head" type="button" data-toggle="t1"
                                        aria-expanded="false" aria-controls="sitBody-t1" disabled>
                                    <span class="sit-kicker">Away team</span>
                                    <span class="sit-name" id="sitName-t1">Away team</span>
                                    <span class="sit-count" id="sitCount-t1">No situations added</span>
                                    <span class="sit-cta" id="sitCta-t1">Add situations</span>
                                </button>
                                <div class="condlist sit-active" id="sitActive-t1"></div>
                                <div class="sit-body" id="sitBody-t1" hidden>
                                    <p class="sit-lead" id="sitLead-t1"></p>
                                    <div class="sit-search">
                                        <label class="sr" for="sitSearch-t1">Search situations</label>
                                        <input class="search" id="sitSearch-t1" data-search="t1" type="search"
                                               placeholder="Search &mdash; rest, streak, off a loss, moneyline&hellip;" autocomplete="off">
                                    </div>
                                    <div class="sit-options" id="sitOptions-t1"></div>
                                </div>
                            </section>
                            <section class="sitarea" data-bucket="t2">
                                <button class="sit-head" type="button" data-toggle="t2"
                                        aria-expanded="false" aria-controls="sitBody-t2" disabled>
                                    <span class="sit-kicker">Home team</span>
                                    <span class="sit-name" id="sitName-t2">Home team</span>
                                    <span class="sit-count" id="sitCount-t2">No situations added</span>
                                    <span class="sit-cta" id="sitCta-t2">Add situations</span>
                                </button>
                                <div class="condlist sit-active" id="sitActive-t2"></div>
                                <div class="sit-body" id="sitBody-t2" hidden>
                                    <p class="sit-lead" id="sitLead-t2"></p>
                                    <div class="sit-search">
                                        <label class="sr" for="sitSearch-t2">Search situations</label>
                                        <input class="search" id="sitSearch-t2" data-search="t2" type="search"
                                               placeholder="Search &mdash; rest, streak, off a loss, moneyline&hellip;" autocomplete="off">
                                    </div>
                                    <div class="sit-options" id="sitOptions-t2"></div>
                                </div>
                            </section>
                            <section class="sitarea is-game" data-bucket="game">
                                <button class="sit-head" type="button" data-toggle="game"
                                        aria-expanded="false" aria-controls="sitBody-game" disabled>
                                    <span class="sit-kicker">Game filters</span>
                                    <span class="sit-name" id="sitName-game">The game itself</span>
                                    <span class="sit-count" id="sitCount-game">No situations added</span>
                                    <span class="sit-cta" id="sitCta-game">Add situations</span>
                                </button>
                                <div class="condlist sit-active" id="sitActive-game"></div>
                                <div class="sit-body" id="sitBody-game" hidden>

<script src="/static/js/config.js?v=738db2dd80a5"></script>
<script src="/static/js/backend-api.js?v=365fae38a6a5"></script>
<script>
(function () {
    'use strict';

    // ============================================================ mounting
    //
    // The whole tool lives in a shadow root. Site CSS cannot cross that
    // boundary, which is the only reliable way to keep this screen looking
    // like itself — see the note in <head>. Everything below therefore scopes
    // its lookups to `root`, never to `document`.

    var host = document.getElementById('blpConsole');
    var root = host.attachShadow({ mode: 'open' });

    // Embedded in the product page. The frame is sized by the parent from
    // the height posted here (the tool's own bottom edge: the document's
    // scrollHeight is never less than the frame, so it could only grow), and
    // "scroll to the top" means the top of the
    // tool on that page, not the top of a box that cannot scroll.
    var EMBED = document.documentElement.classList.contains('blp-embed');
    if (EMBED) {
        host.classList.add('is-embed');
        var postHeight = function () {
            try {
                parent.postMessage({ type: 'blp-embed-height',
                    height: Math.ceil(host.getBoundingClientRect().bottom + window.pageYOffset) + 4 }, location.origin);
            } catch (e) { /* no parent to tell */ }
        };
        if (window.ResizeObserver) {
            var ro = new ResizeObserver(postHeight);
            ro.observe(document.documentElement);
            ro.observe(document.body);
            ro.observe(host);
        }
        window.addEventListener('load', postHeight);
        setInterval(postHeight, 1500);
        window.scrollTo = function (o) {
            var top = (o && typeof o === 'object') ? o.top : arguments[1];
            try { parent.postMessage({ type: 'blp-embed-scroll', top: top || 0 }, location.origin); } catch (e) { /* ignore */ }
        };
    }

    var sheet = document.createElement('link');
    sheet.rel = 'stylesheet';
// A new NAME per build, not a new query string: the edge caches this sheet
    // for four hours and ignores the query string, so `?v=` never reached it.
    sheet.href = '/betlegend-pro/app/console.20260902d.css';
    root.appendChild(sheet);
    root.appendChild(document.getElementById('blpMarkup').content.cloneNode(true));

    // Reveal only once the sheet has resolved, so the tool never flashes
    // unstyled. `error` counts as resolved: an unstyled tool that works beats
    // a blank rectangle, and the timeout is the backstop for both.
    var reveal = function () { host.classList.add('is-ready'); };
    if (sheet.sheet) reveal();
    else { sheet.addEventListener('load', reveal); sheet.addEventListener('error', reveal); }
    setTimeout(reveal, 3000);

    var $ = function (id) { return root.getElementById(id); };
    var $$ = function (sel) { return [].slice.call(root.querySelectorAll(sel)); };

    // ================================================================ utils

    function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    function uuid() {
        if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0;
            return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    }

    var fmtInt = function (n) { return typeof n === 'number' ? n.toLocaleString('en-US') : '—'; };
    var pct = function (n, d) { return (n * 100).toFixed(d == null ? 1 : d) + '%'; };

    function breakEven(odds) {
        if (typeof odds !== 'number' || !isFinite(odds)) return null;
        return odds < 0 ? (-odds) / (-odds + 100) : 100 / (odds + 100);
    }

    function isValidAmericanOdds(v) {
        if (v === '' || v == null) return false;
        var n = Number(v);
        return Number.isInteger(n) && (n <= -100 || n >= 100);
    }

    function setFieldError(fieldEl, on) {
        if (!fieldEl) return;
        fieldEl.classList.toggle('is-invalid', !!on);
        var c = fieldEl.querySelector('input, select, textarea');
        if (c) c.setAttribute('aria-invalid', on ? 'true' : 'false');
    }

    function showNote(el, html) { el.innerHTML = html; el.hidden = false; }
    function hide(el) { if (el) el.hidden = true; }

    function skeleton(kind, message) {
        var body = kind === 'kpis'
            ? '<div class="kpis-lg">' + new Array(6).fill('<div class="skel-box" style="margin:0"></div>').join('') + '</div>'
            : '<div class="skel"><div class="skel-line w40" style="height:22px"></div>'
                + '<div class="skel-line w60"></div><div class="skel-box"></div>'
                + '<div class="skel-line w80"></div><div class="skel-line w60"></div>'
                + '<div class="skel-line w80"></div></div>';
        return '<div class="skel-status"><span class="spin"></span>' + esc(message) + '</div>' + body;
    }

    function emptyState(title, body, actionHtml) {
        return '<div class="empty"><div class="empty-ico" aria-hidden="true">'
            + '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'
            + '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H9v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M9 4h5.5A1.5 1.5 0 0 1 16 5.5v13a1.5 1.5 0 0 1-1.5 1.5H9"/></svg>'
            + '</div><h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>'
            + (actionHtml ? '<div class="row">' + actionHtml + '</div>' : '') + '</div>';
    }

    // ============================================================== state

    var ACCESS = { entitled: false, plan: null };
    var COST = { cost: 5, freeAvailable: false, resetsAt: null, balance: 0 };
    var submitButtons = [];
    var SUBMIT_BLOCKED = false;
    // BLOCK_REASON_20260817: refreshStatus works out WHICH of three states is
    // blocking (frozen wallet / ineligible account / today's allowance spent)
    // and used to put that reason on the button title only. syncSetup then
    // printed a single hardcoded sentence in the run bar for all three, so an
    // account that was merely ineligible was told "Today's free report is
    // used" while the API was still returning freeAvailable:true and the
    // header two inches above said "1 of 1 free reports left today". Keeping
    // the reason here lets both surfaces state the same, true thing.
    var SUBMIT_BLOCKED_REASON = '';

    function costLabel() {
        if (ACCESS.entitled) return '· Included';
        if (COST.freeAvailable) return "· Today's free report";
        return '· ' + COST.cost + ' TMR Coin';
    }
    function paintCosts() {
        $$('[data-cost]').forEach(function (el) { el.textContent = costLabel(); });
    }

    function resetText() {
        if (!COST.resetsAt) return '';
        var d = new Date(COST.resetsAt);
        if (isNaN(d.getTime())) return '';
        return ' Your next one unlocks ' + d.toLocaleString([], {
            weekday: 'short', hour: 'numeric', minute: '2-digit'
        }) + ' your time.';
    }

    function paintAllowance() {
        var box = $('allowanceNotice');
        if (!box) return;
        if (ACCESS.entitled) {
            // Entitled users already see their plan in the header chip. A
            // full-width banner repeating it every visit takes space from the
            // research tool and tells them nothing they can act on.
            box.innerHTML = '';
            return;
        }
        if (COST.freeAvailable) {
            box.innerHTML = '<div class="note is-ok"><span><strong>Free report available today.</strong> '
                + '1 free report per day, shared across every BetLegend Pro tool. '
                + 'Use it on whichever one you want.</span></div>';
            return;
        }
        var canCoin = COST.balance >= COST.cost;
        box.innerHTML = '<div class="note is-warn"><span><strong>Today’s free report used.</strong> '
            + '1 free report per day, shared across every BetLegend Pro tool.' + esc(resetText()) + ' '
            + (canCoin
                ? 'Until then each report costs ' + esc(COST.cost) + ' TMR Coin, or go unlimited with a plan.'
                : 'You need an active plan (or ' + esc(COST.cost) + ' TMR Coin) to run another one today.')
            + '</span><button type="button" class="btn is-primary" id="allowanceSubscribe">Subscribe</button></div>';
        var btn = $('allowanceSubscribe');
        if (btn) btn.addEventListener('click', function () {
            try {
                var r = window.api && window.api.startBetLegendProCheckout
                    && window.api.startBetLegendProCheckout('monthly');
                if (r && typeof r.catch === 'function') {
                    r.catch(function () { window.location.href = '/betlegend-pro/#pricing'; });
                    return;
                }
                if (!r) window.location.href = '/betlegend-pro/#pricing';
            } catch (err) { window.location.href = '/betlegend-pro/#pricing'; }
        });
    }

    function billingPill(res) {
        if (res.included_in_plan) return '<span class="pill is-plan">Included in your plan</span>';
        if (res.was_free_inquiry) return '<span class="pill is-free">Free report</span>';
        if (res.billed) return '<span class="pill is-charged">Charged ' + esc(res.amount_charged) + ' TMR Coin</span>';
        return '<span class="pill">Not charged</span>';
    }

    function receiptRow(res) {
        var bits = [billingPill(res)];
        if (!res.included_in_plan && res.balance_after != null) {
            bits.push('<span>Balance ' + fmtInt(res.balance_before) + ' → ' + fmtInt(res.balance_after) + '</span>');
        }
        if (res.ledger_entry_id) {
            bits.push('<span>Receipt #' + esc(res.ledger_entry_id)
                + (res.was_replay ? ' · duplicate submission, not re-charged' : '')
                + ' · <a href="/wallet/">View in wallet</a></span>');
        }
        return '<div class="receipt">' + bits.join('') + '</div>';
    }

    async function refreshStatus() {
        try {
            var s = await window.api.getBetLegendProStatus();
            COST.cost = typeof s.cost === 'number' ? s.cost : 5;
            COST.freeAvailable = !!s.freeAvailable;
            COST.resetsAt = s.freeResetsAt || null;
            COST.balance = typeof s.balance === 'number' ? s.balance : 0;
            ACCESS = (s.access && typeof s.access === 'object') ? s.access : { entitled: false, plan: null };

            var planChip = $('planChip'), balanceChip = $('balanceChip');
            if (ACCESS.entitled) {
                // 'comp' is an owner grant, not a purchase — label it honestly
                // rather than showing it as a bought Lifetime plan.
                var planName = ACCESS.plan === 'comp' ? 'Owner'
                    : ACCESS.is_lifetime ? 'Lifetime'
                    : ACCESS.plan === 'annual' ? 'Annual' : ACCESS.plan === 'monthly' ? 'Monthly' : 'Pro';
                planChip.className = 'chip is-plan';
                planChip.innerHTML = '<strong>' + esc(planName) + '</strong>';
                planChip.hidden = false;
                balanceChip.hidden = true;
                $('manageBtn').hidden = !ACCESS.manageable;
                $('upgradeBtn').hidden = true;
            } else {
                planChip.className = 'chip';
                // A count, not a mood: "1 of 1 free reports left today" is
                // the number a user needs to decide whether to run one.
                planChip.textContent = COST.freeAvailable
                    ? '1 of 1 free reports left today'
                    : '0 of 1 free reports left today';
                planChip.hidden = false;
                balanceChip.hidden = false;
                $('balanceValue').textContent = fmtInt(s.balance);
                $('manageBtn').hidden = true;
                $('upgradeBtn').hidden = false;
            }
            $('topbarRight').hidden = false;

            var notice = $('accountNotice');
            notice.innerHTML = '';
            if (!ACCESS.entitled && s.isFrozen) {
                notice.innerHTML = '<div class="note is-warn"><span><strong>Your TMR Coin wallet is frozen.</strong> '
                    + 'Contact support before running a paid report — or get unlimited access and skip coin '
                    + 'entirely.</span><a class="btn" href="/betlegend-pro/#pricing">See plans</a></div>';
            } else if (!ACCESS.entitled && !s.eligible) {
                notice.innerHTML = '<div class="note is-warn"><span>This account isn’t eligible to run a '
                    + 'coin-billed report.</span></div>';
            }

            var allowanceSpent = !ACCESS.entitled && !COST.freeAvailable && s.balance < COST.cost;
            var blocked = !ACCESS.entitled && (s.isFrozen || !s.eligible || allowanceSpent);
            SUBMIT_BLOCKED = blocked;
            SUBMIT_BLOCKED_REASON = !blocked ? '' : (s.isFrozen
                ? 'Your TMR Coin wallet is frozen, so a paid report cannot run.'
                : allowanceSpent
                    ? 'Today’s free report is used. A plan (or TMR Coin) is needed to run another one today.'
                    : 'This account is not eligible to run a coin-billed report.');
            submitButtons.forEach(function (b) {
                // Account state may only ever ADD a reason to disable; a form
                // that has already gated its own button keeps it disabled.
                b.disabled = blocked || b.hasAttribute('data-incomplete');
                if (blocked) {
                    b.setAttribute('title', s.isFrozen
                        ? 'Your TMR Coin wallet is frozen, so a paid report cannot run.'
                        : allowanceSpent
                            ? "Today's free report is used. A plan (or TMR Coin) is needed to run another one today."
                            : 'This account is not eligible to run a coin-billed report.');
                } else if (b.getAttribute('title') && !b.hasAttribute('data-incomplete')) {
                    b.removeAttribute('title');
                }
            });

    async function runReview() {

    async function loadFilterLibrary(sport) {

        // catalogue that cannot have changed and dropped the panel back to

     *  screen this replaces. */
    function buildPeriodOptions() {
        var keep = mTimeframe.value;
        var first = coverage && coverage.earliest_season, last = coverage && coverage.latest_season;
        var opts = ['<option value="all">All available history'
            + (first ? ' — since ' + first : '') + '</option>'];
        if (first && last) {
            for (var y = last; y >= first; y--) opts.push('<option value="' + y + '">' + y + '</option>');
        }
        opts.push('<option value="custom">Custom date range\u2026</option>');
        mTimeframe.innerHTML = opts.join('');
        // Keep the user's choice across a re-render; a season the new sport
        // does not cover falls back to all-history rather than silently
        // querying a year that is not there.
        mTimeframe.value = [].some.call(mTimeframe.options, function (o) { return o.value === keep; })
            ? keep : 'all';

    }

    function setFilter(fid, bound, raw) {
        if (bound === 'min' || bound === 'max') {
            var cur = (filters[fid] && typeof filters[fid] === 'object') ? filters[fid] : {};
            var next = { min: cur.min, max: cur.max };
            next[bound] = (raw === '' || raw == null) ? null : Number(raw);
            if (next.min == null && next.max == null) delete filters[fid];
            else filters[fid] = next;
            return;
        }
        if (raw === '' || raw == null || raw === false) delete filters[fid];
        else filters[fid] = raw;
    }

    /** Repaint only the parts of a condition row that a keystroke changes. A

        if (!reads || spec.available === false) return;
        // The refusal has to appear on the keystroke that causes it, beside
        // the input, not only on a full re-render the reader never triggers.
        var bad = valueError(spec, filters[key]);
        if (bad) {
            reads.className = 'fielderr';
            reads.setAttribute('role', 'alert');
            reads.textContent = bad;

    // ------------------------------------------------------- table sorting
    /**
     * Sort a rendered results table by one of its columns.
     *
     * Presentation only: it reorders the rows already on screen and never
     * re-queries, so no record, average or sample size can move as a result.
     * The caption says so, because a table that reorders itself is otherwise
     * indistinguishable from one that re-filtered.
     *
     * A cell's `data-k` wins over its text where the two differ ("4-5" sorts
     * on 9, "Yankees -148" on -148). Rows with no value for the column always
     * sink to the bottom in both directions, so a run of "—" never breaks up
     * the ordering the reader asked for.
     */
    function sortTableBy(th) {
        var kind = th.getAttribute('data-sort');
        if (!kind) return;
        var table = th.closest('table');
        var tbody = table.tBodies[0];
        if (!tbody) return;
        var index = [].indexOf.call(th.parentNode.children, th);
        var next = th.getAttribute('aria-sort') === 'ascending' ? 'descending' : 'ascending';
        var dir = next === 'ascending' ? 1 : -1;

        var keyed = [].map.call(tbody.rows, function (row, position) {
            var cell = row.cells[index];
            var raw = cell ? (cell.hasAttribute('data-k') ? cell.getAttribute('data-k')
                                                          : cell.textContent.trim()) : '';
            var empty = raw === '' || raw === '—';
            var value = kind === 'num' ? Number(raw) : raw.toLowerCase();
            if (kind === 'num' && !isFinite(value)) empty = true;
            // `position` keeps the sort stable: equal keys hold the order the
            // server returned them in rather than shuffling on every click.
            return { row: row, value: value, empty: empty, position: position };
        });
        keyed.sort(function (a, b) {
            if (a.empty !== b.empty) return a.empty ? 1 : -1;
            if (a.empty) return a.position - b.position;
            if (a.value < b.value) return -1 * dir;
            if (a.value > b.value) return 1 * dir;
            return a.position - b.position;
        });
        var frag = document.createDocumentFragment();
        keyed.forEach(function (item) { frag.appendChild(item.row); });
        tbody.appendChild(frag);

        [].forEach.call(table.querySelectorAll('th[aria-sort]'), function (other) {
            other.setAttribute('aria-sort', other === th ? next : 'none');
        });
    }

    root.addEventListener('click', function (ev) {
        var th = ev.target.closest && ev.target.closest('th.th-sort');
        if (th) sortTableBy(th);
    });
    root.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        var th = ev.target.closest && ev.target.closest('th.th-sort');
        if (!th) return;
        ev.preventDefault();
        sortTableBy(th);
    });

    function filterPayload() {
        var body = {}, game = {}, t1 = {}, t2 = {};
        Object.keys(filters).forEach(function (key) {
            if (!isSet(filters[key])) return;
            var id = idOf(key), bucket = bktOf(key);
            // Every condition travels in the bucket it was added FOR, legacy
            // ids included. The endpoint promotes a legacy id out of `filters`
            // onto its top-level field, so game-level ones run exactly as they
            // always did -- while a TEAM-level one (role, min_rest_days) keeps
            // the side it was chosen for. Sent top-level it had no side at all,
            // so "Colorado as underdog" was answered for Atlanta, and the same
            // id picked for both teams silently kept one.
            // A whole-number condition is sent as a number, not the raw
            // input string.
            var value = (id === 'min_rest_days') ? Number(filters[key]) : filters[key];
            if (bucket === 't1') t1[id] = value;
            else if (bucket === 't2') t2[id] = value;
            else game[id] = value;
        });
        if (Object.keys(game).length) body.filters = game;
        if (Object.keys(t1).length) body.team_1_filters = t1;
        if (Object.keys(t2).length) body.team_2_filters = t2;
        return body;
    }

    /** A team total does not survive a sport change, and the reader is told.
     *
     *  The line is a number of RUNS in MLB, GOALS in NHL and POINTS in the NBA
     *  and NFL, and the team it points at belongs to the league it was chosen
     *  in. 4.5 happens to be inside the NFL band as well as the MLB one, which
     *  is exactly why "keep it if it still validates" is the wrong rule: it
     *  would leave 4.5 runs sitting on a 49ers matchup as 4.5 points, valid
     *  and meaningless. So it is always cleared -- and always explained,
     *  because a value vanishing without a word is the thing we are fixing. */
    function carryTeamTotalAcrossSport(fromSport) {
        var line = ttLine.value;
        if (!ttTeam.value && !line) { ttNote.hidden = true; return; }
        var band = ttBand();
        ttTeam.value = ''; ttLine.value = ''; ttOdds.value = ''; ttSide.value = 'under';
        ttNote.textContent = 'Team total cleared. ' + (line ? line + ' was a ' + fromSport + ' number; ' : '')
            + mSport.value + ' team totals are ' + ttNoun() + ', usually '
            + (mSport.value === 'NBA' ? '95 to 130' : mSport.value === 'NFL' ? '14 to 34'
                : mSport.value === 'NHL' ? '1.5 to 4.5' : '3 to 6')
            + ' — enter the number you are being offered.';

    mSport.addEventListener('change', function () {

        // Situations are league-specific: an NHL faceoff reading has no
        // meaning in the NBA, and a season from another league is not a period
        // here. Both are cleared -- and now SAID, rather than the panel simply
        // being empty when the user looks back at it.
        var hadSituations = activeFilterCount();
        if (hadSituations) dropped.push(hadSituations + (hadSituations === 1 ? ' situation' : ' situations'));
        filters = {};
        closeAreas();
        reviewSig = null;
        $('review').hidden = true;
        if (mTimeframe.value !== 'all') dropped.push('the chosen period');
        mTimeframe.value = 'all';
        // The result on screen answered a question about another league.

        // The market value is kept only where it still means something.
        carryTeamTotalAcrossSport(from);

        var note = $('sportNote');

    mTimeframe.addEventListener('change', function () {
