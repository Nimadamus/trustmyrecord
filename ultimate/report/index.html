<script>
/* TMR_ULTIMATE_20261024. Access is decided by the server (403 for anyone
   without an active Ultimate plan); this page only draws the answer. */
(function () {
  'use strict';
  var API = 'https://trustmyrecord-api.onrender.com/api';
  var S = null;
  var stateEl = document.querySelector('[data-ult-state]');
  function state(html) { stateEl.hidden = false; stateEl.innerHTML = html; document.querySelector('[data-ult-shell]').hidden = true; }

  function draw(r) {
    var R = window.TMRUltimateReport;
    if (!r.overall || !r.overall.n) {
      state('<h2>Your report starts with your first graded pick</h2><p>Make picks on TrustMyRecord. Each one is graded on the final score and added here. A category gets a verdict once it has 30 graded picks.</p><a class="ult-btn ult-btn--gold" href="/sportsbook/">Make a pick</a>');
      return;
    }
    stateEl.hidden = true;
    document.querySelector('[data-ult-shell]').hidden = false;
    var asof = document.querySelector('[data-ult-asof]');
    if (asof && r.generated_at) asof.textContent = 'Built from your ' + r.overall.n + ' graded picks. Updated ' +
      new Date(r.generated_at).toLocaleString('en-US', { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' PT.';
    R.renderProfile(document.querySelector('[data-ult-profile]'), r);
    R.renderReport(document.querySelector('[data-ult-report]'), r, {
      name: 'you',
      canStartPlan: true,
      onStartPlan: function (btn) {
        btn.classList.add('is-busy');
        S.authFetch(API + '/ultimate/intelligence/plan', { method: 'POST' }).then(function (x) {
          if (!x.ok) throw new Error('plan ' + x.status);
          return load();
        }).catch(function () { btn.classList.remove('is-busy'); btn.textContent = 'Could not start the plan. Try again'; });
      }
    });
  }

  function load() {
    return S.authFetch(API + '/ultimate/intelligence', { cache: 'no-store' }).then(function (x) {
      return x.json().catch(function () { return {}; }).then(function (b) { return { x: x, b: b }; });
    }).then(function (o) {
      if (o.x.ok) return draw(o.b);
      if (o.x.status === 401) { window.location.href = '/login/?next=' + encodeURIComponent('/ultimate/report/'); return; }
      if (o.x.status === 403) {
        state('<h2>Performance Intelligence is part of TMR Ultimate</h2><p>Ultimate includes everything in TMR Pro plus this report on your own record. See the full sample report first.</p><a class="ult-btn ult-btn--gold" href="/ultimate/">See TMR Ultimate</a>');
        return;
      }
      state('<h2>Your report could not load</h2><p>' + (o.b && o.b.error ? String(o.b.error).replace(/</g, '&lt;') : 'Please try again in a minute.') + '</p><button type="button" class="ult-btn ult-btn--ghost" data-ult-retry>Try again</button>');
      var b = stateEl.querySelector('[data-ult-retry]'); if (b) b.addEventListener('click', function () { state('<p>Loading your report.</p>'); load(); });
    }).catch(function () { state('<h2>Your report could not load</h2><p>Please check your connection and try again.</p>'); });
  }

  function start() {
    S = window.TMRSession || null;
    if (S && S.api) API = S.api;
    if (!S || !S.hasTokens || !S.hasTokens()) {
      state('<h2>Sign in to see your report</h2><p>Performance Intelligence reads your own graded picks, so it needs your account.</p><a class="ult-btn ult-btn--gold" href="/login/?next=' + encodeURIComponent('/ultimate/report/') + '">Sign in</a>');
      return;
    }
    load();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
