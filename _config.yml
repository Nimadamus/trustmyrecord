# GitHub Pages publishes this whole repository as the website. This file only
# keeps the working files (session notes, test suites, build scripts, worker
# source, package manifests) out of the published site, so they stop being
# served at trustmyrecord.com/CLAUDE.md, /scripts/..., /tests/... and so on.
# Nothing a page loads lives in any of these paths. They stay in the repo.
# (2026-11-20 audit.)
exclude:
  # Jekyll's own defaults, restated because a custom list replaces them
  - node_modules
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - Gemfile
  - Gemfile.lock
  # working directories
  - scripts
  - tests
  - docs
  - workers
  - test-results
  # manifests and test configuration
  - package.json
  - package-lock.json
  - playwright.blp-live.config.cjs
  - playwright.blp-situations-live.config.cjs
  - playwright.blp.config.cjs
  - playwright.challenges-extra.config.cjs
  - playwright.challenges-live.config.cjs
  - playwright.challenges.config.cjs
  - playwright.config.cjs
  - playwright.earn.config.cjs
  - playwright.football-props.config.cjs
  - playwright.grading-reports.config.cjs
  - playwright.handicapping.config.cjs
  - playwright.match-live.config.cjs
  - playwright.match.config.cjs
  - playwright.model-builder.config.cjs
  - playwright.notifications-live.config.cjs
  - playwright.notifications.config.cjs
  - playwright.production-verification.config.cjs
  - playwright.regression-audit.config.cjs
  - playwright.regression.config.cjs
  - playwright.trendspotter.config.cjs
  - pw.match.config.cjs
  - site_final3.json
  # internal notes
  - ACTIVATION_REACTIVATION_TEMPLATES.md
  - AGENTS.md
  - CLAUDE.md
  - DEVELOPMENT_RULES.md
  - FILE_MAPPING.md
  - HANDOFF_TO_CLOUD_CLAUDE.md
  - HANDOFF_TO_LOCAL_CLAUDE.md
  - HANDOFF_TRENDSPOTTER_VALIDATION_FIX.md
  - MOBILE_PARITY_INVENTORY.md
  - README.md
  - RELEASE_NFL_SIM_UX_20261021.md
  - SEO_INDEXING_PROTOCOL.md
  - THEME_RESTORE_CHECKLIST.md
  - TRUSTMYRECORD_FIX_TRACKER.md
  - TRUSTMYRECORD_PRODUCT_UPGRADE_SYSTEM.md
