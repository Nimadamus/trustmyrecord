<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://trustmyrecord.com/marketplace/purchases/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Purchased Picks | Pick Marketplace | TrustMyRecord</title>
    <meta name="description" content="Your purchased picks on TrustMyRecord: revealed selections, order history, payment status, and receipts.">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <!-- Global nav: the same canonical component the homepage uses
         (tmr-ds.css + tmr-ds-nav.js). tmr-sitewide.css/js and tmr-light.css
         dropped: the two nav systems cannot coexist, and one marketplace
         cannot have two headers. -->
    <link rel="stylesheet" href="/static/css/tmr-ds.5a0234d6173a.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root, body.tmr-ds.mp-purchases-page, body.tmr-ds.tmr-ds--dark.mp-purchases-page {
            --bg:#FFFFFF; --panel:#FFFFFF; --line:#D2DEEA;
            --text:#07182A; --muted:#2E4459; --teal:#0C948C; --cyan:#0C948C;
            --amber:#B98505; --green:#0A8B4E; --red:#BC372E;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body.mp-purchases-page { background:linear-gradient(180deg,#FFFFFF,#FFFFFF); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh; }
        body.mp-purchases-page a { color:inherit; text-decoration:none; }
        body.mp-purchases-page .mp-shell { max-width:980px; margin:0 auto; padding:28px 24px 70px; }
        body.mp-purchases-page .crumb { color:var(--muted); font-size:12.5px; margin-bottom:14px; }
        body.mp-purchases-page .crumb a { color:var(--cyan); }
        body.mp-purchases-page h1 { font-family:'Barlow Condensed','Inter',sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(28px,4vw,40px); letter-spacing:-.5px; margin-bottom:18px; }
        body.mp-purchases-page h1 .accent { background:linear-gradient(135deg,var(--teal),var(--cyan)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
        body.mp-purchases-page .notice { border-radius:12px; padding:13px 16px; font-size:13.5px; line-height:1.55; margin-bottom:16px; display:none; }
        body.mp-purchases-page .notice-wait { border:1px solid rgba(185,133,5,.30); background:rgba(185,133,5,0.08); color:#B98505; }
        body.mp-purchases-page .notice-ok { border:1px solid rgba(10,139,78,.28); background:rgba(10,139,78,0.08); color:#07182A; }
        body.mp-purchases-page .order { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:11px; }
        body.mp-purchases-page .o-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        body.mp-purchases-page .o-ava { width:40px; height:40px; border-radius:50%; object-fit:cover; background:#F6F9FC; border:1px solid var(--line); }
        body.mp-purchases-page .o-name { font-weight:800; font-size:14.5px; }
        body.mp-purchases-page .o-meta { color:var(--muted); font-size:12px; margin-top:2px; }
        body.mp-purchases-page .o-right { margin-left:auto; text-align:right; }
        body.mp-purchases-page .o-price { font-family:'JetBrains Mono',monospace; font-weight:800; font-size:16px; }
        body.mp-purchases-page .status-pill { display:inline-flex; padding:4px 10px; border-radius:999px; font:700 10.5px/1 'JetBrains Mono',monospace; letter-spacing:.09em; text-transform:uppercase; margin-top:4px; }
        body.mp-purchases-page .pill-green { background:rgba(10,139,78,0.1); border:1px solid rgba(10,139,78,.28); color:var(--green); }
        body.mp-purchases-page .pill-amber { background:rgba(185,133,5,0.1); border:1px solid rgba(185,133,5,.30); color:var(--amber); }
        body.mp-purchases-page .pill-red { background:rgba(188,55,46,0.1); border:1px solid rgba(188,55,46,.28); color:var(--red); }
        body.mp-purchases-page .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:9px; font-weight:800; font-size:12.5px; cursor:pointer; border:1px solid transparent; transition:.15s; font-family:inherit; }
        body.mp-purchases-page .btn-primary { background:linear-gradient(135deg,var(--teal),var(--cyan)); color:#04111a; }
        body.mp-purchases-page .btn-outline { background:rgba(7,24,42,0.02); color:var(--text); border-color:var(--line); }
        body.mp-purchases-page .reveal { margin-top:12px; border-top:1px dashed #D2DEEA; padding-top:12px; display:none; }
        body.mp-purchases-page .rv-sel { font-family:'Barlow Condensed','Inter',sans-serif; font-weight:900; font-size:22px; text-transform:uppercase; }
        body.mp-purchases-page .rv-line { color:#07182A; font-size:13px; margin-top:4px; }
        body.mp-purchases-page .rv-grade { margin-top:6px; font-size:13px; font-weight:800; }
        body.mp-purchases-page .mp-empty { text-align:center; color:var(--muted); padding:52px 18px; border:1px dashed var(--line); border-radius:13px; font-size:13.5px; line-height:1.7; }
        body.mp-purchases-page .mp-empty a { color:var(--cyan); }
        @media (max-width:560px) { body.mp-purchases-page .mp-shell { padding:20px 14px 56px; } body.mp-purchases-page .o-right { text-align:left; margin-left:0; width:100%; } }
    </style>
<link rel="stylesheet" href="/static/css/tmr-linkhub.css?v=4f2b57ff49a8">
<script defer src="/static/js/tmr-linkhub.js?v=0e645b0f061b"></script>
<link rel="stylesheet" href="/static/css/tmr-marketplace-shell.css?v=2518dee34f97">
<style>
    body.mp-purchases-page .pay-filter { display:flex; gap:7px; flex-wrap:wrap; margin:0 0 16px; }
    body.mp-purchases-page .pay-filter button { padding:7px 13px; border-radius:999px; border:1px solid var(--line); background:#F4F7FA; color:var(--text); font:700 13px/1 Inter,system-ui,sans-serif; cursor:pointer; }
    body.mp-purchases-page .pay-filter button.on { background:#0C948C; border-color:#0C948C; color:#fff; }
    body.mp-purchases-page .o-price .paylbl { display:block; font:700 10px/1 "JetBrains Mono",monospace; letter-spacing:.08em; text-transform:uppercase; color:#2E4459; margin-top:4px; }
</style>
</head>
<body class="mp-purchases-page tmr-ds">

<main class="mp-shell">
    <!-- One marketplace, one purchase history. Cash orders and TMR Coin
         orders are the same orders table, so they belong on the same page. -->
    <div class="mpx" data-mp-tab="purchases"
         data-mp-sub="Everything you have bought here, however you paid for it. Cash and TMR Coin purchases sit in one history."></div>
    <h1 style="font-size:22px;margin-bottom:12px;">My <span class="accent">Purchases</span></h1>
    <div class="pay-filter" id="payFilter">
        <button data-pay="" class="on">All</button>
        <button data-pay="cash">Cash</button>
        <button data-pay="tmr">TMR Coin</button>
    </div>
    <div class="notice notice-wait" id="waitNotice">Payment received — confirming with Stripe and unlocking your pick. This usually takes a few seconds; this page refreshes automatically.</div>
    <div class="notice notice-ok" id="okNotice">Your pick is unlocked below.</div>
    <div id="list"><div class="mp-empty">Loading purchases…</div></div>
</main>

<script src="/static/js/config.js?v=7e4b853bbb3d"></script>
<script src="/static/js/backend-api.js?v=c1f7d7dd762d"></script>
<script src="/static/js/tmr-marketplace-shell.js?v=a4d43c028fea"></script>
<script>
(function () {
    const list = document.getElementById('list');
    const q = new URLSearchParams(location.search);
    const highlightOrder = q.get('order');
    const justPaid = q.get('status') === 'success';
    let pollCount = 0;

    function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function money(cents, cur) { return new Intl.NumberFormat('en-US',{style:'currency',currency:(cur||'usd').toUpperCase()}).format((cents||0)/100); }
    function isTmr(p) { return String(p.payment_method || 'cash') === 'tmr'; }
    /* A TMR order stores price_cents = 0 and currency 'TMR': its real price is
       price_tmr. Formatting it as money printed every TMR purchase as $0.00. */
    function priceOf(p) { return isTmr(p) ? Number(p.price_tmr || 0).toLocaleString() + ' TMR' : money(p.price_cents, p.currency); }
    function payLabel(p) { return isTmr(p) ? 'Paid in TMR' : 'Paid in cash'; }
    function marketLabel(m) {
        const map = { h2h:'Moneyline', spreads:'Spread', totals:'Total', team_totals:'Team Total', f5_h2h:'F5 Moneyline', f5_spreads:'F5 Runline', f5_totals:'F5 Total' };
        return map[m] || String(m || '').replace(/_/g,' ');
    }
    function oddsFmt(o) { return o > 0 ? '+' + o : String(o); }

    function isPass(p) { return p.product_type && p.product_type !== 'single_pick'; }
    function passLabel(t) {
        return { daily_access: 'Day Pass', weekly_access: 'Weekly Pass', monthly_access: 'Monthly Pass' }[t] || String(t || '').replace(/_/g, ' ');
    }
    function pill(status, entStatus, p) {
        if (status === 'paid' && entStatus === 'active' && p && isPass(p) && p.expires_at && new Date(p.expires_at) <= new Date())
            return '<span class="status-pill pill-amber">Pass Ended</span>';
        if (status === 'paid' && entStatus === 'active') return '<span class="status-pill pill-green">Unlocked</span>';
        if (status === 'pending_payment') return '<span class="status-pill pill-amber">Awaiting Payment</span>';
        if (status === 'paid') return '<span class="status-pill pill-amber">Unlocking…</span>';
        if (status === 'refunded' || status === 'partially_refunded') return '<span class="status-pill pill-red">Refunded</span>';
        if (status === 'disputed' || status === 'dispute_lost') return '<span class="status-pill pill-red">Disputed</span>';
        if (status === 'expired' || status === 'payment_failed') return '<span class="status-pill pill-red">' + esc(status.replace('_',' ')) + '</span>';
        return '<span class="status-pill pill-amber">' + esc(status) + '</span>';
    }

    let allPurchases = [];
    // ?pay=cash|tmr so a link can point at one payment method's history --
    // /marketplace/tmr/#purchases used to be its own page and still resolves here.
    let payFilter = (function () {
        const v = String(q.get('pay') || '').toLowerCase();
        return v === 'cash' || v === 'tmr' ? v : '';
    })();

    function render(purchases) {
        allPurchases = purchases;
        const rows = payFilter
            ? purchases.filter(function (p) { return (payFilter === 'tmr') === isTmr(p); })
            : purchases;
        if (window.TMRMarketplaceShell) window.TMRMarketplaceShell.setCount('purchases', purchases.length || '');
        if (!rows.length) {
            list.innerHTML = '<div class="mp-empty">' +
                (purchases.length
                    ? 'No ' + (payFilter === 'tmr' ? 'TMR Coin' : 'cash') + ' purchases yet.'
                    : 'No purchases yet.<br>Browse the <a href="/marketplace/">Pick Marketplace</a> to find sellers with verified records.') +
                '</div>';
            return;
        }
        list.innerHTML = rows.map(function (p) {
            const unlocked = p.status !== 'pending_payment' && p.entitlement_status === 'active';
            const pass = isPass(p);
            const meta = '@' + esc(p.seller_username) + ' &middot; ' + new Date(p.created_at).toLocaleString() +
                ' &middot; ' + esc(pass ? passLabel(p.product_type) : 'single pick') +
                (pass && p.expires_at ? ' &middot; access ' + (new Date(p.expires_at) > new Date() ? 'until ' : 'ended ') + new Date(p.expires_at).toLocaleString() : '') +
                (p.refunded_cents && !isTmr(p) ? ' &middot; refunded ' + money(p.refunded_cents, p.currency) : '');
            const action = !unlocked ? '' :
                pass ? '<div style="margin-top:11px;"><button class="btn btn-primary" data-pass="' + esc(p.public_id) + '" data-target="rv-' + esc(p.public_id) + '">View Picks</button> <a class="btn btn-outline" href="/marketplace/seller/?u=' + encodeURIComponent(p.seller_username) + '">Storefront</a></div>'
                     : '<div style="margin-top:11px;"><button class="btn btn-primary" data-reveal="' + p.pick_id + '" data-target="rv-' + esc(p.public_id) + '">View Pick</button> <a class="btn btn-outline" href="/marketplace/seller/?u=' + encodeURIComponent(p.seller_username) + '">Storefront</a></div>';
            return '<div class="order" data-order="' + esc(p.public_id) + '">' +
                '<div class="o-head">' +
                    '<img class="o-ava" src="' + esc(p.seller_avatar || '/static/img/default-avatar.png') + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
                    '<div><div class="o-name">' + esc(p.seller_display_name || p.seller_username) + '</div>' +
                    '<div class="o-meta">' + meta + '</div></div>' +
                    '<div class="o-right"><div class="o-price">' + priceOf(p) + '<span class="paylbl">' + payLabel(p) + '</span></div>' + pill(p.status, p.entitlement_status, p) + '</div>' +
                '</div>' + action +
                '<div class="reveal" id="rv-' + esc(p.public_id) + '"></div>' +
            '</div>';
        }).join('');

        list.querySelectorAll('[data-pass]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
                const target = document.getElementById(btn.getAttribute('data-target'));
                if (target.style.display === 'block') { target.style.display = 'none'; return; }
                btn.textContent = 'Loading…';
                try {
                    const out = await api.request('/marketplace/passes/' + btn.getAttribute('data-pass') + '/picks');
                    target.innerHTML = (out.picks.length ? out.picks.map(function (pk) {
                        const graded = pk.status !== 'pending';
                        return '<div style="padding:9px 0;border-bottom:1px solid rgba(148,163,184,.1);">' +
                            '<div class="rv-sel" style="font-size:18px;">' + esc(pk.selection) + (pk.line != null ? ' ' + (pk.line > 0 && /spread/i.test(pk.market_type) ? '+' : '') + pk.line : '') + '</div>' +
                            '<div class="rv-line">' + esc(pk.away_team) + ' @ ' + esc(pk.home_team) + ' &middot; ' + esc(marketLabel(pk.market_type)) + ' &middot; ' + oddsFmt(pk.odds) + ' &middot; ' + pk.units + 'u &middot; ' + new Date(pk.commence_time).toLocaleString() +
                            (graded ? ' &middot; <b style="color:' + (pk.status==='won'?'var(--green)':pk.status==='lost'?'var(--red)':'var(--muted)') + ';">' + esc(pk.status.toUpperCase()) + (pk.result_units != null ? ' (' + (pk.result_units > 0 ? '+' : '') + pk.result_units + 'u)' : '') + '</b>' : '') +
                            '</div></div>';
                    }).join('') : '<p style="color:var(--muted);font-size:13px;">No picks in your pass window yet — new picks from this seller appear here automatically while your pass is active.</p>') +
                    '<p style="color:var(--muted);font-size:11.5px;margin-top:8px;">For your eyes only — redistributing purchased picks violates the buyer terms. Results are never guaranteed.</p>';
                    target.style.display = 'block';
                } catch (e) {
                    target.innerHTML = '<p style="color:var(--red);font-size:13px;">' + esc(e.message || 'Could not load picks') + '</p>';
                    target.style.display = 'block';
                }
                btn.textContent = 'View Picks';
            });
        });

        list.querySelectorAll('[data-reveal]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
                const target = document.getElementById(btn.getAttribute('data-target'));
                if (target.style.display === 'block') { target.style.display = 'none'; return; }
                btn.textContent = 'Loading…';
                try {
                    const out = await api.request('/marketplace/purchased-picks/' + btn.getAttribute('data-reveal'));
                    const pk = out.pick;
                    const graded = pk.status !== 'pending';
                    target.innerHTML =
                        '<div class="rv-sel">' + esc(pk.selection) + (pk.line != null ? ' ' + (pk.line > 0 && /spread/i.test(pk.market_type) ? '+' : '') + pk.line : '') + '</div>' +
                        '<div class="rv-line">' + esc(pk.away_team) + ' @ ' + esc(pk.home_team) + ' &middot; ' + esc(marketLabel(pk.market_type)) + ' &middot; ' + oddsFmt(pk.odds) + ' &middot; ' + pk.units + 'u &middot; ' + new Date(pk.commence_time).toLocaleString() + '</div>' +
                        (graded ? '<div class="rv-grade ' + (pk.status === 'won' ? 'pill-green' : pk.status === 'lost' ? 'pill-red' : '') + '" style="background:none;border:none;color:' + (pk.status==='won'?'var(--green)':pk.status==='lost'?'var(--red)':'var(--muted)') + ';">Result: ' + esc(pk.status.toUpperCase()) + (pk.result_units != null ? ' (' + (pk.result_units > 0 ? '+' : '') + pk.result_units + 'u)' : '') + (pk.home_score != null ? ' — final ' + pk.away_score + '-' + pk.home_score : '') + '</div>' : '') +
                        '<p style="color:var(--muted);font-size:11.5px;margin-top:8px;">For your eyes only — redistributing purchased picks violates the buyer terms. Results are never guaranteed.</p>';
                    target.style.display = 'block';
                } catch (e) {
                    target.innerHTML = '<p style="color:var(--red);font-size:13px;">' + esc(e.message || 'Could not load pick') + '</p>';
                    target.style.display = 'block';
                }
                btn.textContent = 'View Pick';
            });
        });
    }

    async function load() {
        api.loadTokens && api.loadTokens();
        if (!api.token) {
            list.innerHTML = '<div class="mp-empty">Log in to see your purchases.<br><a href="/login/?redirect=%2Fmarketplace%2Fpurchases%2F">Log In</a></div>';
            return;
        }
        try {
            const out = await api.request('/marketplace/me/purchases');
            const purchases = out.purchases || [];
            render(purchases);

            if (justPaid && highlightOrder) {
                const target = purchases.find(function (p) { return p.public_id === highlightOrder; });
                const unlocked = target && target.entitlement_status === 'active';
                document.getElementById('waitNotice').style.display = unlocked ? 'none' : 'block';
                document.getElementById('okNotice').style.display = unlocked ? 'block' : 'none';
                // Webhook fulfillment usually lands within seconds — poll up to ~60s.
                if (!unlocked && pollCount < 20) { pollCount++; setTimeout(load, 3000); }
            }
        } catch (e) {
            list.innerHTML = '<div class="mp-empty">Could not load purchases. Please refresh.</div>';
        }
    }
    Array.prototype.forEach.call(document.querySelectorAll('#payFilter button'), function (b) {
        b.classList.toggle('on', (b.getAttribute('data-pay') || '') === payFilter);
    });
    document.getElementById('payFilter').addEventListener('click', function (ev) {
        var b = ev.target.closest('button[data-pay]');
        if (!b) return;
        payFilter = b.getAttribute('data-pay') || '';
        Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        render(allPurchases);
    });

    load();
})();
</script>
<script src="/static/js/analytics.js?v=471dc3fea1e5"></script>
