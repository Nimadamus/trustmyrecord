<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustMyRecord</title>
<!--
  X DM CAMPAIGN ATTRIBUTION PATH (added 2026-08-17)

  Purpose: the X invite DMs link to trustmyrecord.com/x so campaign traffic can be
  measured as a GROUP. This page records the visit, then hands the visitor straight
  into the normal homepage. It is not a landing page and shows no content of its own.

  How attribution works, using mechanisms the site already had:
    * we redirect to /?utm_source=x&utm_medium=dm&utm_campaign=invite
    * static/js/analytics.js captureFirstTouch() stores those params in the
      first party key tmr_first_touch, first touch wins
    * register/index.html already reads tmr_first_touch and sends the existing
      GA4 account_created event with source = utm_source, so signups from this
      campaign report as source "x" with no change to the signup flow
    * GA4 also attributes the session natively from the same utm params

  Deliberately NOT done:
    * no per handle or per person identifiers, the DM carries no unique link
    * no cookies or storage written here beyond what analytics.js already writes
    * no query string in the DM itself, the visitor only ever types/sees /x
    * no separate landing experience, this redirects immediately
    * no change to homepage analytics, the homepage keeps its own config
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-V5MCVXS2HE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // Declare the campaign on THIS pageview, not just on the homepage we redirect to.
  // GA4 fixes a session's traffic source when the session starts, and the session
  // starts HERE, on /x, arriving from t.co with no utm in the address bar. Without
  // this the whole campaign would be attributed to t.co / referral and be
  // indistinguishable from ordinary tweet clicks, which is the exact thing /x
  // exists to separate. page_location is set to the campaign form of this url so
  // GA4 parses it as a normal campaign landing, and the campaign_* fields are sent
  // as well so attribution does not depend on url parsing alone.
  gtag('config', 'G-V5MCVXS2HE', {
    page_location: window.location.origin
      + '/x/?utm_source=x&utm_medium=dm&utm_campaign=invite',
    campaign_source: 'x',
    campaign_medium: 'dm',
    campaign_name: 'invite'
  });

  (function () {
    var DEST = '/?utm_source=x&utm_medium=dm&utm_campaign=invite';

    // Record first touch here, in the SAME first party key and shape that
    // static/js/analytics.js captureFirstTouch() uses. This page has to do it
    // itself because the homepage does not load analytics.js, so a visitor sent
    // from here would otherwise reach /register with the utm params long gone
    // and get attributed to an internal referrer instead of this campaign.
    // First touch wins, exactly like analytics.js: never overwrite an existing
    // value, so a returning visitor keeps their original source.
    try {
      if (!localStorage.getItem('tmr_first_touch')) {
        localStorage.setItem('tmr_first_touch', JSON.stringify({
          referrer: (document.referrer || '').slice(0, 500),
          landing: '/x/',
          ts: new Date().toISOString(),
          utm_source: 'x',
          utm_medium: 'dm',
          utm_campaign: 'invite'
        }));
      }
    } catch (e) { /* storage unavailable */ }

    var went = false;
    function go() {
      if (went) return;
      went = true;
      // replace, not assign, so Back does not bounce the visitor through here again
      window.location.replace(DEST);
    }
    // count the campaign click, then move on as soon as it is recorded
    try {
      gtag('event', 'x_dm_campaign_click', {
        campaign_source: 'x',
        campaign_medium: 'dm',
        campaign_name: 'invite',
        event_callback: go
      });
    } catch (e) {}
    // never let a blocked or slow tag strand the visitor
    setTimeout(go, 1200);
  })();
</script>
<!--
  CANONICAL AND THE NO-JS FALLBACK (added 2026-08-18)

  This page had no canonical, which failed the permanent SEO gate: a meta
  refresh stub must carry a canonical that agrees with its refresh target,
  and must never be noindex. It was the only failure in the whole suite.

  The canonical points at the clean homepage rather than the campaign URL.
  Canonicalising to /?utm_source=x... would ask search engines to index a
  tracking-tagged address as the page of record, which is the opposite of
  what a canonical is for. So the no-JS refresh drops the utm params too,
  and the two agree on the clean homepage.

  ATTRIBUTION IS UNAFFECTED. Everything that measures this campaign is
  JavaScript: the gtag config above with campaign_source/medium/name, the
  tmr_first_touch write below, and the window.location.replace to the utm
  destination. A visitor with JS disabled runs none of it and produces no
  GA4 hit at all, so the utm params in this noscript fallback could never
  have been recorded by anything. Nothing measurable is lost.
-->
<link rel="canonical" href="https://trustmyrecord.com/">
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>

     plus the homepage's own navbar rules, so every page renders the same bar. -->

</head>

</html>
