<style>
  .em-wrap{min-height:70vh;display:grid;place-items:center;padding:32px 16px;}
  .em-card{width:min(520px,100%);background:#fff;border:1px solid #D2DEEA;border-radius:18px;box-shadow:0 24px 60px rgba(7,24,42,.1);padding:32px;font-family:'Inter',sans-serif;color:#07182A;}
  .em-brand{font-family:'Anton',sans-serif;letter-spacing:1px;font-size:26px;color:#07182A;}
  .em-brand span{font-family:'Inter',sans-serif;font-size:13px;color:#5b6b7f;letter-spacing:0;margin-left:6px;}
  .em-title{font-size:22px;font-weight:800;margin:18px 0 8px;}
  .em-text{font-size:15px;line-height:1.6;color:#33475b;margin:0 0 18px;}
  .em-btn{display:inline-block;background:#0B4FA8;color:#fff;font-weight:800;border:0;border-radius:10px;padding:12px 22px;font-size:15px;text-decoration:none;cursor:pointer;}
  .em-btn[disabled]{opacity:.6;cursor:default;}
  .em-links{margin-top:18px;font-size:14px;}
  .em-links a{color:#0B4FA8;margin-right:16px;}
</style>

<body class="tmr-ds-shell tmr-polished-page tmr-light">
<main class="em-wrap"><div class="em-card">
  <div class="em-brand">BETLEGEND<span>on TrustMyRecord</span></div>
  <h1 class="em-title" id="t">Confirming your email</h1>
  <p class="em-text" id="m">One moment.</p>
  <div class="em-links" id="links" hidden>
    <a href="https://www.betlegendpicks.com/">BetLegend Picks</a>
    <a href="/u/BetLegend/">BetLegend record on TrustMyRecord</a>
    <a href="/betlegend-pro/">BetLegend Pro</a>
  </div>
</div></main>
<script>
(function () {
  var t = document.getElementById('t'), m = document.getElementById('m'), links = document.getElementById('links');
  function show(title, msg) { t.textContent = title; m.textContent = msg; links.hidden = false; }
  var token = new URLSearchParams(location.search).get('t');
  if (!token) { show('Link missing', 'This confirm link is incomplete. Open the link from your email again, or sign up again on BetLegend Picks.'); return; }
  fetch('https://trustmyrecord-api.onrender.com/api/email/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (d) {
      if (d && d.ok) {
        var names = (d.lists || []).join(' and ');
        show('You are in', names ? ('You are confirmed for the ' + names + '. Watch your inbox.') : 'You are confirmed. Watch your inbox.');
        if (window.gtag) gtag('event', 'betlegend_email_confirmed');
      } else if (d && d.error === 'expired_token') {
        show('This link expired', 'Confirm links last 7 days. Sign up again on BetLegend Picks and we will send a fresh one.');
      } else if (d && d.error === 'unsubscribed') {
        show('This address is unsubscribed', 'This email address was unsubscribed, so we will not add it back. Reply to any BetLegend email if that was a mistake.');
      } else {
        show('That link did not work', 'Open the newest confirm email and tap the button again, or sign up again on BetLegend Picks.');
      }
    })
    .catch(function () { show('Something went wrong', 'We could not reach the server. Try the link again in a minute.'); });
})();
</script>
<script src="/static/js/tmr-session.63f50f4d0988.js"></script><script src="/static/js/tmr-ds-nav.a2305e68bc59.js"></script>
</body>
