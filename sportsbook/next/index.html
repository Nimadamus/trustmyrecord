<!DOCTYPE html>
<html lang="en" class="sbn sbn-v3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sportsbook Preview | TrustMyRecord</title>
<!-- SPORTSBOOK_NEXT_20260903 — ISOLATED PREVIEW.
     Nothing here is loaded by the production sportsbook at /sportsbook/.
     It reuses only the read-only board API, the shared auth session and the
     proven api.createPick submit path. Canonical points at the live board so
     this preview never competes with it in search (never noindex, house rule). -->
<link rel="canonical" href="https://trustmyrecord.com/sportsbook/">
<meta name="description" content="Preview of the redesigned TrustMyRecord sportsbook board.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/sportsbook-next.css?v=b64ba2ce24b6">
<!-- SPORTSBOOK_NEXT_V3_20260904: refinement pass, preview only. Scoped to
     html.sbn-v3, which the live board neither loads nor carries. -->
<link rel="stylesheet" href="/static/css/sportsbook-next-v3.css?v=b3884db9b945">
</head>
<body>
<a class="sbn-skip" href="#sbnBoard">Skip to the board</a>

<header class="sbn-topbar">
  <a class="sbn-brand" href="/sportsbook/">
    <span class="sbn-brand-mark">TMR</span>
    <span class="sbn-brand-name">Trust<b>My</b>Record</span>
  </a>
  <span class="sbn-flag">Sportsbook preview</span>
  <a class="sbn-back" href="/sportsbook/">Back to the live sportsbook</a>
</header>

<div class="sbn-notice" role="status">
  <strong>Preview.</strong> The live sportsbook is unchanged. Picks locked here go to your real record.
</div>

<main class="sbn-shell">
  <aside class="sbn-railwrap" aria-label="Sports">
    <div class="sbn-railhead">Sports</div>
    <nav id="sbnRail" class="sbn-rail"></nav>
  </aside>

  <section class="sbn-main">
    <h1 id="sbnTitle" class="sbn-sr">Board</h1>
    <div id="sbnBoard" class="sbn-boardlist"></div>
  </section>

  <aside id="sbnSlip" class="sbn-slip" aria-label="Pick slip"></aside>
</main>

<div id="sbnDrawer" class="sbn-drawer"></div>

<div id="sbnBar" class="sbn-bar" role="button" tabindex="0" aria-controls="sbnSlip">
  <span class="sbn-bardot" aria-hidden="true"></span>
  <span class="sbn-bartext">Tap a price to start</span>
  <span class="sbn-barcta">View slip</span>
</div>

<p id="sbnLive" class="sbn-sr" role="status" aria-live="polite"></p>

<script src="/static/js/config.js?v=738db2dd80a5"></script>
<script src="/static/js/backend-api.js?v=68c9d15dbed8"></script>
<script src="/static/js/auth-persistent.js?v=533b6a5999e2"></script>
<script src="/static/js/sportsbook-next.js?v=87fda9565bfd"></script>
<!-- SPORTSBOOK_NEXT_V3_20260904: preview only. Moves the game/price tally out of
     the market tab row and into the empty first column header, so all eight market
     tabs fit on one line instead of the last one clipping. -->
<script>
(function () {
    function moveTally() {
        var tally = document.querySelector('.sbn-toolbar .sbn-tally');
        if (!tally) return;
        var slot = document.querySelector('.sbn-colhead span:first-child');
        if (!slot) {
            // ladder tabs print no column header, so the count gets a strip of its
            // own rather than staying in the tab row and wrapping it onto two lines
            var board = document.getElementById('sbnBoard');
            if (!board) return;
            slot = board.querySelector('.sbn-loosetally');
            if (!slot) {
                slot = document.createElement('div');
                slot.className = 'sbn-loosetally';
                board.insertBefore(slot, board.firstChild);
            }
        }
        slot.textContent = tally.textContent;
        if (!/loose/.test(slot.className)) slot.className = 'sbn-headtally';
        tally.style.display = 'none';
    }
    // The engine writes a player prop label as one string, "Name . Prop Type".
    // Split it so the player reads first and the market supports it.
    function splitPropLabels() {
        var on = document.querySelector('.sbn-cat.is-on');
        if (!on || on.getAttribute('data-cat') !== 'player_props') return;
        [].forEach.call(document.querySelectorAll('.sbn-striplabel > b'), function (b) {
            if (b.querySelector('i')) return;
            var parts = b.textContent.split('·');
            if (parts.length < 2) return;
            b.innerHTML = '';
            var who = document.createElement('span');
            who.className = 'sbn-propwho';
            who.textContent = parts[0].trim();
            var what = document.createElement('i');
            what.textContent = parts.slice(1).join('·').trim();
            b.appendChild(who); b.appendChild(what);
            b.parentNode.classList.add('is-prop');
        });
    }
    function tidy() { moveTally(); splitPropLabels(); }
    var board = document.getElementById('sbnBoard');
    if (board && window.MutationObserver) new MutationObserver(tidy).observe(board, { childList: true });
    document.addEventListener('DOMContentLoaded', tidy);
    setTimeout(tidy, 400); setTimeout(tidy, 1500);
})();
</script>
</body>
</html>
