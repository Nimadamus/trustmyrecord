<script>
(function () {
  var r = document.getElementById('dsNavReserve');

  var drop = function () { if (r && r.parentNode) { r.parentNode.removeChild(r); r = null; } };
  if (document.querySelector('nav.ds-nav')) return drop();
  var o = new MutationObserver(function () {

  window.addEventListener('load', function () {

  });
}());

<main class="std" id="simToday">
  <nav class="std-crumb" aria-label="Breadcrumb"><a href="/">Home</a><i aria-hidden="true">&rsaquo;</i><a href="/sports-simulators/">Sports Simulators</a><i aria-hidden="true">&rsaquo;</i><span aria-current="page">Today's Simulated Games</span></nav>

    <h1>Today's Simulated <em>Games</em></h1>
    <p class="std-sub">Every game run on the TrustMyRecord simulators in the last 24 hours: the simulated final score and who ran it.</p>

  </header>

  <button type="button" class="std-more" id="stdMore" hidden>Show more</button>
</main>
<script>
/* SIM_TODAY_20261115: reads GET /api/sim-archive/today (last 24 hours, newest first). */
(function () {
  var API = 'https://api.trustmyrecord.com/api';
  try { if (window.CONFIG && CONFIG.api && CONFIG.api.baseUrl) API = CONFIG.api.baseUrl; } catch (e) {}
  var list = document.getElementById('stdList'), more = document.getElementById('stdMore'), totals = document.getElementById('stdTotals');
  var state = { sport: '', runs: [], shown: 40 };
  var ENT = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ENT[c]; }); }
  function when(iso) { try { return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }) + ' PT'; } catch (e) { return ''; } }
  function runHref(r) {
    if (r.sport === 'mlb') return '/mlb-simulator/';
    return '/' + r.sport + '-simulator/?away=' + encodeURIComponent(r.away.abbr) + '&home=' + encodeURIComponent(r.home.abbr);
  }
  function team(t, win) {
    return '<span class="std-team' + (win ? ' win' : '') + '">' + (t.logo ? '<img src="' + esc(t.logo) + '" alt="" loading="lazy">' : '') +
      esc(t.abbr || t.name) + ' <span class="std-pts">' + esc(t.score) + '</span></span>';
  }
  function row(r) {
    var by = r.by && r.by.username ? '<a href="/u/' + encodeURIComponent(r.by.username) + '/">' + esc(r.by.username) + '</a>' : esc((r.by && r.by.label) || 'Guest');
    var times = r.times > 1 ? '<small>ran it ' + r.times + ' times</small>' : '';
    var aw = r.away || {}, hm = r.home || {};
    return '<div class="std-row"><span class="std-time">' + when(r.recorded_at) + '</span><span class="std-sport">' + esc(String(r.sport || '').toUpperCase()) + '</span>' +
      '<span class="std-game">' + team(aw, r.winner_abbr && r.winner_abbr === aw.abbr) + '<span class="std-at">at</span>' + team(hm, r.winner_abbr && r.winner_abbr === hm.abbr) + '</span>' +
      '<span class="std-by">by ' + by + times + '</span><a class="std-run" href="' + runHref(r) + '">Run it</a></div>';
  }
  function paint() {
    if (!state.runs.length) {
      list.innerHTML = '<div class="std-empty">No games simulated in the last 24 hours' + (state.sport ? ' for ' + state.sport.toUpperCase() : '') + '. <a href="/sports-simulators/">Run the first one</a>.</div>';
      more.hidden = true; return;
    }
    list.innerHTML = state.runs.slice(0, state.shown).map(row).join('');
    more.hidden = state.runs.length <= state.shown;
  }
  function load() {
    list.setAttribute('aria-busy', 'true');
    fetch(API + '/sim-archive/today?limit=200' + (state.sport ? '&sport=' + state.sport : ''), { credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (d) {
        state.runs = d.runs || []; state.shown = 40;
        var t = d.totals || {};
        totals.innerHTML = '<b>' + Number(t.runs || 0).toLocaleString() + ' <span>simulations</span></b><b>' + Number(t.people || 0).toLocaleString() + ' <span>people</span></b>';
        totals.hidden = false; paint();
      })
      .catch(function () { list.innerHTML = '<div class="std-empty">Could not load the simulations right now. <a href="">Try again</a>.</div>'; })
      .then(function () { list.removeAttribute('aria-busy'); });
  }
  document.getElementById('stdTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sport]'); if (!b) return;
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    state.sport = b.getAttribute('data-sport'); load();
  });
  more.addEventListener('click', function () { state.shown += 40; paint(); });
  load();
})();
</script>
