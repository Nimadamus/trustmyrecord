  </defs>
  <circle cx="72" cy="72" r="70" fill="url(#cub)"/>
  <circle cx="72" cy="72" r="70" fill="none" stroke="#CFB87C" stroke-width="4"/>
  <circle cx="72" cy="72" r="60" fill="none" stroke="#CFB87C" stroke-width="1.5" opacity=".55"/>
  <text x="72" y="88" text-anchor="middle" fill="#CFB87C"
