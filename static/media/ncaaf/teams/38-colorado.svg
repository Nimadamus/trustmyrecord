<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-label="Colorado club mark">
  <title>Colorado club mark</title>
  <defs>
    <linearGradient id="cub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1B1B"/>
      <stop offset="100%" stop-color="#000000"/>
