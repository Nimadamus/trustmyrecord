<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="TMR Game File cover: New York Mets at Atlanta Braves, August 10, 2026, Truist Park">
  <!--
    MATCHUP_OF_THE_DAY_PHASE1_20260810 — original TMR cover graphic.

    Typographic and generated entirely here: no photography, no club marks, no
    third-party asset of any kind. That is a hard constraint on Game File
    imagery, not a stylistic preference — a research page cannot open with a
    borrowed photograph.

    Team colours are used as abstract accent bars rather than as insignia.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#04101C"/>
      <stop offset="48%"  stop-color="#07192B"/>
      <stop offset="100%" stop-color="#030B14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="14%" r="62%">
      <stop offset="0%"   stop-color="#22D2C0" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#22D2C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="88%" r="58%">
      <stop offset="0%"   stop-color="#FFC93C" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <rect width="1.5" height="26" fill="#FFFFFF" opacity=".028"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- eyebrow -->
  <rect x="72" y="64" width="286" height="34" rx="17" fill="#22D2C0" fill-opacity=".12" stroke="#22D2C0" stroke-opacity=".34"/>
  <text x="94" y="87" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="800"
        letter-spacing="2.6" fill="#8DEDE0">TMR MATCHUP OF THE DAY</text>

  <!-- teams -->
  <text x="72" y="228" font-family="Barlow Condensed, Oswald, Impact, Segoe UI, Arial, sans-serif"
        font-size="118" font-weight="900" letter-spacing="1" fill="#FFFFFF">METS</text>
  <text x="72" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800"
        letter-spacing="8" fill="#22D2C0">vs</text>
  <text x="72" y="404" font-family="Barlow Condensed, Oswald, Impact, Segoe UI, Arial, sans-serif"
        font-size="118" font-weight="900" letter-spacing="1" fill="#FFFFFF">BRAVES</text>

  <!-- accent bars: abstract team colour, not a club mark -->
  <rect x="40" y="128" width="9" height="118" rx="4.5" fill="#FF5910"/>
  <rect x="40" y="304" width="9" height="118" rx="4.5" fill="#CE1141"/>

  <!-- rule -->
  <rect x="72" y="452" width="1056" height="1" fill="#FFFFFF" fill-opacity=".14"/>

  <text x="72" y="497" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800"
        letter-spacing="5.6" fill="#FFC93C">THE TMR GAME FILE</text>
  <text x="72" y="533" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500"
        fill="#B7CEE4">August 10, 2026 &#183; Truist Park, Atlanta &#183; 4:15 PM PT</text>

  <text x="72" y="580" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700"
        letter-spacing="1.2" fill="#6E8CA8">Historical database research &#183; Trend Spotter &#183; Advanced matchup analysis</text>

  <!-- wordmark -->
  <text x="1128" y="580" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17"
        font-weight="900" letter-spacing="3" fill="#FFFFFF" fill-opacity=".82">TRUSTMYRECORD</text>
</svg>
