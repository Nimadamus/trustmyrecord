    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 12% 0%, rgba(11, 79, 168,0.12), transparent 28%),
                linear-gradient(180deg, #FFFFFF, #FFFFFF) !important;
            color: #07182A;
            font-family: 'Inter', sans-serif;
        }
        /* NAV_IN_GRID_BODY_20261120: body is a centred grid with 24px padding, and the shared
           navbar is injected as one of its items. The single auto column grew to the
           navbar's full natural width, so the navbar sat 24px in from the left, ran off the
           right edge (a sideways scrollbar on desktop) and on phones the card itself was cut
           off at the right. One column that cannot outgrow the page; navbar edge to edge. */
        body { grid-template-columns: minmax(0, 1fr); }
        body > .ds-nav { justify-self: stretch !important; min-width: 0 !important; width: auto !important; max-width: none !important; margin: -24px -24px 0 !important; }
        body > .tmr-global-footer { min-width: 0 !important; max-width: 100% !important; }

        .reset-container {
            width: min(520px, 100%);
            margin: 0 auto;
            padding: 34px;
            background:
                linear-gradient(180deg, rgba(7,24,42,0.02), rgba(7,24,42,0.02)),
                #FFFFFF;
            border: 1px solid #D2DEEA;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(7,24,42,0.1);
        }
        .reset-title {
            margin: 0 0 10px;
            font-family: 'Barlow', sans-serif;
            font-size: clamp(2rem, 5vw, 2.55rem);
            line-height: 0.96;
            letter-spacing: -0.03em;
            color: #07182A;
            text-align: center;
        }
        .reset-subtitle {
            font-size: 0.94rem;
            color: #2E4459;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.72rem;
            color: #2E4459;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
        }
        .form-group input {
            width: 100%;
            min-height: 46px;
            padding: 0 15px;
            border: 1px solid #D2DEEA;
            border-radius: 14px;
            background: rgba(7,24,42,0.02);
            color: #07182A;
            font-size: 0.95rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(11, 79, 168,.28);
            box-shadow: 0 0 0 3px rgba(7,24,42,0.041);
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #DEF4F2, #DEF4F2);
            color: #06120f;
            border: none;
            min-height: 48px;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 38px rgba(7,24,42,0.075);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .message.success {
            background: rgba(11, 79, 168,0.12);
            border: 1px solid rgba(11, 79, 168,.28);
            color: #07182A;
        }
        .message.error {
            background: rgba(188,55,46,0.12);
            border: 1px solid rgba(188,55,46,.28);
            color: #BC372E;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #2E4459;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #07182A;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(11, 79, 168,.28);
            border-top-color: rgba(11, 79, 168,.28);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .password-requirements {

        }
        .password-requirements.valid {

        }
        @media (max-width: 640px) {
            .reset-container { padding: 24px 20px; }
        }

    <div class="reset-container">
        <!-- Request Reset Form -->
        <div id="request-form">
            <h1 class="reset-title">Forgot Password?</h1>
            <p class="reset-subtitle">Enter your email or username and we'll send the reset link to the account email on file</p>
            
            <div id="request-message"></div>
            
            <form id="forgot-form" onsubmit="handleForgotSubmit(event)">
                <div class="form-group">
                    <label for="email">Email Or Username</label>
                    <input type="text" id="email" required placeholder="your@email.com or your username">
                </div>
                <button type="submit" class="btn-primary" id="request-btn">
                    Send Reset Link
                </button>
            </form>
        </div>

        <!-- Reset Password Form -->
        <div id="reset-form" class="hidden">
            <h1 class="reset-title">Create New Password</h1>
            <p class="reset-subtitle">Enter your new password below</p>
            
            <div id="reset-message"></div>
            
            <form id="new-password-form" onsubmit="handleResetSubmit(event)">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required 
                           minlength="8" placeholder="••••••••">
                    <div class="password-requirements" id="password-help">
                        Must be at least 8 characters
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required 
                           placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="reset-btn">
                    Reset Password
                </button>
            </form>
        </div>

        <!-- Success State -->
        <div id="success-state" class="hidden">
            <div class="message success">
                ✅ Your password has been reset successfully!
            </div>
                    <a href="/login/" class="btn-primary" style="text-decoration: none; display: inline-block; text-align: center;">
                Go to Login
            </a>
        </div>

        <a href="/" class="back-link">← Back to home</a>
    </div>

<script src="/static/js/config.js?v=60a0696a58ba"></script>

<script src="/static/js/auth-persistent.js?v=b0b217feaa25"></script>
    <script>
        const apiClient = window.api;
        let resetToken = '';

        async function ensureApiReady() {
            if (!apiClient) {
                throw new Error('Password reset service is unavailable right now.');
            }

            if (apiClient.ready) {
                try {
                    await apiClient.ready;
                } catch (error) {}
            }

            return apiClient;
        }

        // Check URL for reset token
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            resetToken = urlParams.get('token');
            const loginPrefill = (urlParams.get('login') || '').trim();

            if (resetToken) {
                document.getElementById('request-form').classList.add('hidden');
                document.getElementById('reset-form').classList.remove('hidden');
            } else if (loginPrefill) {
                const emailField = document.getElementById('email');
                if (emailField) emailField.value = loginPrefill;
            }
        });

        // Password validation
        document.getElementById('new-password')?.addEventListener('input', (e) => {
            const help = document.getElementById('password-help');
            if (e.target.value.length >= 8) {
                help.classList.add('valid');
                help.textContent = '✓ Password looks good';
            } else {
                help.classList.remove('valid');
                help.textContent = 'Must be at least 8 characters';
            }
        });

        async function handleForgotSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('request-btn');
            const msg = document.getElementById('request-message');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Sending...';

            try {
                const api = await ensureApiReady();
                await api.forgotPassword(email);
                msg.innerHTML = '<div class="message success">If that account exists, a reset link is on the way to its email address.</div>';
                document.getElementById('forgot-form').reset();
            } catch (error) {
                msg.innerHTML = `<div class="message error">${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link';
            }
        }

        async function handleResetSubmit(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('reset-btn');
            const msg = document.getElementById('reset-message');

            if (newPassword !== confirmPassword) {
                msg.innerHTML = '<div class="message error">Passwords do not match</div>';
                return;
            }

            if (newPassword.length < 8) {
                msg.innerHTML = '<div class="message error">Password must be at least 8 characters</div>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Resetting...';

            try {
                const api = await ensureApiReady();
                await api.resetPassword(resetToken, newPassword);
                document.getElementById('reset-form').classList.add('hidden');
                document.getElementById('success-state').classList.remove('hidden');
            } catch (error) {
                msg.innerHTML = `<div class="message error">${error.message}</div>`;
                btn.disabled = false;
                btn.innerHTML = 'Reset Password';
            }
        }
    </script>
