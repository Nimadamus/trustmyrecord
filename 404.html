    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background:
                radial-gradient(circle at 10% 0%, rgba(11, 79, 168,0.12), transparent 30%),
                linear-gradient(180deg, #FFFFFF, #FFFFFF);
            /* The ground here is white; this ink is left over from the dark
               original, so the h1 that inherits it sat at 1.0:1. */
            color: #0A1B2E;
            font-family: 'Inter', sans-serif;
        }

        .redirect-shell {
            width: min(560px, 100%);
            padding: 28px;
            border-radius: 22px;
            border: 1px solid #D2DEEA;
            background:
                linear-gradient(180deg, rgba(7,24,42,0.02), rgba(7,24,42,0.02)),
                #FFFFFF;
            box-shadow: 0 24px 60px rgba(7,24,42,0.1);
            text-align: center;
        }

        .nf-links a{color:#0B4FA8;text-decoration:none;margin:0 2px;}
        .redirect-kicker {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid rgba(11, 79, 168,.28);
            background: rgba(11, 79, 168,0.1);
            color: #0B4FA8;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 18px 0 10px;
            font-family: 'Barlow', sans-serif;
            font-size: clamp(2rem, 6vw, 2.8rem);
            line-height: 0.96;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0;
            color: #3C5468;
            font-size: 0.96rem;
            line-height: 1.65;
        }

        /* The shared theme sheet loads after this block and paints h1-h5 and
           anchors for the dark shell, which this page is not: its ground and
           its card are both literal #FFFFFF. Pinned here so the heading is
           not white on white. */
        body.tmr-light h1,
        body.tmr-light .redirect-shell h1{ color:#0A1B2E !important; -webkit-text-fill-color:#0A1B2E !important; background:none !important; }
        body.tmr-light .redirect-shell p{ color:#3C5468 !important; }
        body.tmr-light .redirect-kicker{ color:#0B4FA8 !important; }
        body.tmr-light .nf-links a{ color:#0B4FA8 !important; }

    <script>
        // Route known legacy SPA-style paths directly to the real multipage site.
        var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
        var query = window.location.search;
        var hash = window.location.hash;
        var profilePathMatch = path.match(/^profile\/([^\/?#]+)$/i);
        var embedPathMatch   = path.match(/^embed\/([^\/?#]+)$/i);
        var forumThreadMatch = path.match(/^forum\/thread\/(\d+)(?:\/.*)?$/i);
        var userProfileMatch = path.match(/^u\/([^\/?#]+)$/i);
        var legacyRouteMap = {
            '': '',
            'home': '',
            'picks': 'picks/',
            'mypicks': 'mypicks/',
            'my-record': 'my-record/',
            'promos': 'promos/',
            'tools': 'tools/',
            'consensus': 'consensus/',
            'make-picks': 'sportsbook/',
            'submit': 'sportsbook/',
            'submit-pick': 'sportsbook/',
            'pick': 'sportsbook/',
            'sportsbook': 'sportsbook/',
            'signup': 'register/',
            'signin': 'login/',
            'register': 'register/',
            'login': 'login/',
            'leaderboards': 'leaderboards/',
            'leaderboard': 'leaderboards/',
            'live': 'live/',
            'marketplace': 'marketplace/',
            'groups': 'groups/',
            'messages': 'messages/',
            'profile': 'profile/',
            'account': 'profile/',
            'dashboard': 'profile/',
            'premium': 'premium/',
            'forum': 'forum/',
            'forums': 'forum/',
            'members': 'handicappers/',
            'cappers': 'handicappers/',
            'directory': 'handicappers/',
            'handicappers': 'handicappers/',
            'community': 'feed/',
            'feed': 'feed/',
            'arena': 'arena/',
            'notifications': 'notifications/',
            'polls-trivia': 'polls-trivia/',
            'polls': 'polls/',
            'trivia': 'trivia/',
            'predictions': 'predictions/'
        };

        var mappedRoute = legacyRouteMap[path];
        if (embedPathMatch) {
            // /embed/<username> -> /embed/?u=<username> (preserves ?size, ?theme, etc.)
            var embedQuery = '?u=' + encodeURIComponent(decodeURIComponent(embedPathMatch[1])) +
                (query ? '&' + query.slice(1) : '');
            window.location.replace(
                window.location.origin + '/embed/' + embedQuery + hash
            );
        } else if (profilePathMatch) {
            var profileQuery = '?user=' + encodeURIComponent(decodeURIComponent(profilePathMatch[1])) +
                (query ? '&' + query.slice(1) : '');
            window.location.replace(
                window.location.origin + '/profile/' + profileQuery + hash
            );
        } else if (forumThreadMatch) {
            // /forum/thread/<id>/<slug>/ pages are baked static by the 30-min
            // prerender cron. A thread created between runs (or opened under a
            // renamed slug) has no static page yet, so the path lands here. The
            // thread's existence is confirmed against the API first: real thread
            // -> route into the forum app, which canonicalizes the address bar
            // back to the clean URL; nonexistent id -> stays a genuine 404.
            (function (tid) {
                fetch('https://trustmyrecord-api.onrender.com/api/forum/threads/' + tid)
                    .then(function (r) {
                        if (r.ok) window.location.replace(window.location.origin + '/forum/?thread=' + tid + hash);
                    })
                    .catch(function () { /* API unreachable: honest 404 stays */ });
            })(forumThreadMatch[1]);
        } else if (userProfileMatch) {
            // /u/<username>/ pages are baked static (case-sensitive filenames) by
            // the 30-min prerender cron from scripts/build_profile_pages.py. Two
            // ways to land here for a REAL member: (1) the URL was typed/linked in
            // the wrong case (GitHub Pages is case-sensitive; the DB lookup is
            // not), or (2) the member just verified and their page hasn't been
            // baked yet. Confirm the username against the live API (case-insensitive
            // lookup, same as every /u/ link generator on the site) first:
            // real member whose canonical username differs in case from what's in
            // the URL -> redirect to the canonical-case URL (fixes case 1 without
            // masking anything, exactly like the forum-thread router above);
            // canonical case already matches (case 2, page just not baked yet) or
            // no such member -> stays a genuine 404, same as any other real gap.
            (function (typedName) {
                fetch('https://trustmyrecord-api.onrender.com/api/users/' + encodeURIComponent(decodeURIComponent(typedName)))
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (d) {
                        var canonical = d && d.user && d.user.username;
                        if (canonical && canonical !== typedName) {
                            window.location.replace(window.location.origin + '/u/' + encodeURIComponent(canonical) + '/' + hash);
                        }
                    })
                    .catch(function () { /* API unreachable: honest 404 stays */ });
            })(userProfileMatch[1]);
        } else if (mappedRoute) {
            window.location.replace(window.location.origin + '/' + mappedRoute);
        }
        // NO catch-all redirect. A genuinely nonexistent URL must stay a genuine
        // 404 and render the not-found page below. This branch used to do
        //   location.replace('/?p=' + path)
        // which bounced every unknown URL to the homepage -- a soft-404 machine:
        // the visitor lost the failed URL and search engines saw 404s that behave
        // like the homepage. The redirects above are kept because they are real
        // pretty-URL routers (/profile/<user>, /embed/<user>, legacy aliases),
        // not 404 concealment. Owner rule: never redirect a nonexistent public URL.
    </script>
